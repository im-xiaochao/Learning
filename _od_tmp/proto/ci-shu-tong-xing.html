<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>词数同行 · 单词与考研知识点</title>
<style>
:root {
  --bg: oklch(0.977 0.006 92); --surface: oklch(1 0 0); --fg: oklch(0.265 0.025 191);
  --muted: oklch(0.48 0.022 190); --border: oklch(0.9 0.012 180);
  --primary: oklch(0.43 0.079 185); --primary-hover: oklch(0.35 0.07 185); --primary-soft: oklch(0.943 0.023 174);
  --accent: oklch(0.67 0.137 39); --accent-ink: oklch(0.46 0.11 36); --accent-soft: oklch(0.955 0.027 40);
  --ring: oklch(0.81 0.103 42); --desk: oklch(0.925 0.012 177); --shadow: oklch(0.24 0.027 190 / 0.055);
  --display: "Songti SC", "STSong", "SimSun", serif;
  --body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--desk); color: var(--fg); font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { color: inherit; border: 0; padding: 0; cursor: pointer; background: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
button, a, input, select { outline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent-ink); }
button:disabled { background: var(--border); color: var(--muted); box-shadow: none; }
button:not(:disabled):active { transform: translateY(1px); }
h1, h2, h3, p { margin: 0; }
p { text-wrap: pretty; }
svg { width: 22px; height: 22px; flex: 0 0 auto; vertical-align: middle; }
.device { position: relative; width: 406px; padding: 7px; border: 1px solid oklch(0.56 0.015 185); border-radius: 53px; background: oklch(0.22 0.008 185); box-shadow: 0 30px 70px oklch(0.24 0.025 180 / 0.2), 0 4px 12px oklch(0.24 0.025 180 / 0.12), inset 0 0 0 2px oklch(0.63 0.015 180); }
.device::before, .device::after { content: ""; position: absolute; width: 3px; background: oklch(0.43 0.01 180); border-radius: 2px; }
.device::before { left: -3px; top: 145px; height: 62px; box-shadow: 0 76px 0 oklch(0.43 0.01 180); }
.device::after { right: -3px; top: 204px; height: 86px; }
.screen { width: 390px; height: 844px; border-radius: 45px; background: var(--bg); overflow: hidden; display: grid; grid-template-rows: 43px 45px minmax(0, 1fr) 80px; position: relative; isolation: isolate; }
.status-bar { display: flex; align-items: center; justify-content: space-between; padding: 5px 27px 0; font-size: 14px; font-weight: 650; user-select: none; }
.island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 104px; height: 27px; border-radius: 20px; background: oklch(0.12 0.004 190); }
.status-icons { display: flex; gap: 5px; align-items: center; }
.status-icons svg { width: 16px; height: 16px; }
.battery { width: 23px; height: 11px; border: 1px solid currentColor; border-radius: 3px; position: relative; padding: 1.5px; margin-left: 1px; }
.battery::before { content: ""; display: block; height: 100%; background: var(--fg); border-radius: 1px; }
.battery::after { content: ""; position: absolute; width: 2px; height: 4px; top: 2.5px; right: -4px; background: var(--fg); border-radius: 1px; }
.app-bar { padding: 0 17px 0 19px; display: flex; align-items: center; justify-content: space-between; gap: 7px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: 1px; min-width: 0; }
.brand-logo { color: var(--primary); width: 27px; height: 27px; }
.brand.sub { letter-spacing: 0; font-size: 15px; gap: 2px; }
.back-button { width: 44px; height: 44px; display: grid; place-items: center; margin-left: -9px; margin-right: 3px; }
.capsule { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 20px; background: oklch(1 0 0 / 0.65); height: 32px; flex: 0 0 auto; }
.capsule button { width: 44px; height: 44px; display: grid; place-items: center; }
.capsule button svg { width: 20px; height: 20px; }
.capsule .divider { height: 16px; width: 1px; background: var(--border); }
.viewport { min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 19px 20px 22px; }
.viewport::-webkit-scrollbar { display: none; }
.page { animation: enter 180ms ease-out; }
/* 单词页内容整体往下移：只动这一页，不动 .viewport 的全局内边距 */
.words-page { padding-top: 20px; }
@keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.eyebrow { font-size: 11px; color: var(--muted); line-height: 1.6; letter-spacing: 0.6px; }
.page-title { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.45; letter-spacing: -0.4px; margin-top: 4px; text-wrap: balance; }
.subtext { color: var(--muted); line-height: 1.7; font-size: 12px; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: 20px; padding: 6px 9px; flex: 0 0 auto; }
.streak svg { width: 13px; height: 13px; }
.daily-card { margin-top: 14px; background: var(--primary); color: var(--surface); border-radius: 23px; padding: 17px 20px; min-height: 140px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 7px 15px oklch(0.35 0.07 185 / 0.09); }
.daily-card .eyebrow { color: oklch(0.89 0.027 176); font-size: 10px; letter-spacing: 1.5px; }
.daily-card h2 { font-family: var(--display); font-size: 22px; line-height: 1.35; margin: 6px 0 8px; letter-spacing: 0.5px; }
.daily-meta { display: flex; align-items: center; gap: 5px; font-size: 10px; color: oklch(0.94 0.01 176); }
.daily-meta svg { width: 12px; height: 12px; }
.progress-ring { position: relative; width: 100px; height: 100px; flex: 0 0 auto; display: grid; place-items: center; }
.progress-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: oklch(0.66 0.045 182 / 0.55); stroke-width: 7; }
.ring-fill { fill: none; stroke: var(--ring); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 400ms ease; }
.ring-label { text-align: center; }
.ring-label strong { font-family: var(--body); font-size: 26px; font-weight: 600; letter-spacing: -1px; }
.ring-label strong span { font-size: 13px; margin-left: 1px; }
.ring-label small { display: block; font-size: 9px; color: oklch(0.94 0.01 176); margin-top: 3px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 21px 0 11px; min-height: 23px; }
.section-head h2 { font-size: 16px; font-weight: 650; letter-spacing: 0.2px; }
.section-head > span { color: var(--muted); font-size: 10px; }
.section-head .text-button { margin: -10px -2px -10px 0; }
.learning-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.study-card.wide { grid-column: 1 / -1; min-height: 0; }
.study-card { text-align: left; padding: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 19px; min-height: 151px; box-shadow: 0 3px 9px var(--shadow); transition: border-color 150ms, box-shadow 150ms; }
.study-card .card-icon { color: var(--primary); width: 22px; height: 22px; }
.card-kicker { font-size: 9px; color: var(--muted); }
.study-card h3 { font-size: 15px; font-weight: 650; margin: 8px 0 3px; }
.study-numbers { font-size: 12px; color: var(--muted); }
.study-numbers strong { font-size: 23px; color: var(--fg); font-weight: 600; letter-spacing: -0.8px; margin-right: 3px; }
.study-card .small-progress { margin: 6px 0 7px; }
.small-progress { height: 4px; background: var(--primary-soft); border-radius: 5px; overflow: hidden; }
.small-progress > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width 250ms; }
.card-link { color: var(--primary); display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; min-height: 18px; }
.card-link svg { width: 15px; height: 15px; }

/* ── 政治刷题 ─────────────────────────────────────────── */
.quiz-list { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.quiz-row { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; padding: 11px 12px; min-height: 67px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.quiz-row.ok { border-color: oklch(0.86 0.06 160); background: var(--primary-soft); }
.quiz-row.bad { border-color: oklch(0.87 0.05 40); }
.quiz-row h3 { font-size: 12.5px; font-weight: 600; line-height: 1.55; margin-bottom: 4px; }
.quiz-row p { font-size: 10px; color: var(--muted); }
.quiz-row svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
.quiz-row.ok svg { color: var(--primary); }

.hint-note { font-size: 10px; color: var(--muted); line-height: 1.7; margin: 9px 0 0; }

.option-list { display: flex; flex-direction: column; gap: 9px; margin: 16px 0 4px; }
.option-row { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); min-height: 52px; }
.option-row.picked { border-color: var(--primary); background: var(--primary-soft); }
.option-row.ok { border-color: oklch(0.86 0.06 160); background: var(--primary-soft); }
.option-row.bad { border-color: oklch(0.87 0.05 40); background: oklch(0.97 0.015 40); }
.option-row[disabled] { opacity: 1; }
.option-key { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2, #f2efe9); color: var(--muted); font-size: 12px; font-weight: 650; }
.option-row.picked .option-key, .option-row.ok .option-key { background: var(--primary); color: #fff; }
.option-row.bad .option-key { background: oklch(0.72 0.11 40); color: #fff; }
.option-text { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.6; }
.option-row svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--primary); }
.option-row.bad svg { color: oklch(0.6 0.12 40); }

.quiz-explain ol.point-ol { margin: 4px 0 0; padding-left: 19px; }
.quiz-explain ol.point-ol li { font-size: 12px; line-height: 1.9; margin-bottom: 8px; }
.material-para { font-size: 12px; line-height: 1.95; margin-bottom: 8px; }
.material-para:last-child { margin-bottom: 0; }

.primary-button[hidden] { display: none; }

.recent-card { display: flex; align-items: center; gap: 12px; padding: 12px; width: 100%; min-height: 68px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; text-align: left; }
.recent-formula { width: 42px; height: 42px; background: var(--primary-soft); border-radius: 12px; display: grid; place-items: center; font: italic 23px Georgia, serif; color: var(--primary); flex: 0 0 auto; }
.recent-text { flex: 1; min-width: 0; }
.recent-text strong { font-size: 12px; display: block; margin-bottom: 5px; font-weight: 600; }
.recent-text small { font-size: 10px; color: var(--muted); }
.recent-card > svg { width: 17px; height: 17px; color: var(--muted); }
.tabbar { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); padding: 6px 9px 20px; background: var(--surface); border-top: 1px solid var(--border); z-index: 3; }
.tabbar::after { content: ""; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); height: 4px; width: 117px; border-radius: 5px; background: var(--fg); }
.tab { min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 10px; position: relative; }
.tab-icon { width: 42px; height: 28px; display: grid; place-items: center; border-radius: 10px; }
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--primary); font-weight: 700; }
.tab.active .tab-icon { background: var(--primary-soft); }
.primary-button, .secondary-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 49px; border-radius: 14px; padding: 12px 16px; font-weight: 600; font-size: 14px; line-height: 1.5; transition: background 150ms, border-color 150ms; }
.primary-button { color: var(--surface); background: var(--primary); }
.secondary-button { color: var(--primary); background: var(--surface); border: 1px solid var(--border); }
.text-button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--primary); font-size: 11px; min-height: 44px; padding: 5px 2px; }
.text-button svg { width: 15px; height: 15px; }
.icon-button { width: 44px; height: 44px; display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 12px; color: var(--muted); }
.icon-button.saved { color: var(--accent-ink); background: var(--accent-soft); }
.icon-button.saved svg { fill: currentColor; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 21px; padding: 20px; box-shadow: 0 3px 12px var(--shadow); }
.mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 20px; padding: 5px 8px; font-size: 10px; line-height: 1.5; background: var(--primary-soft); color: var(--primary); }
.pill svg { width: 12px; height: 12px; }
.pill.orange { background: var(--accent-soft); color: var(--accent-ink); }
.big-number { font-size: 36px; font-weight: 600; letter-spacing: -1px; }
.big-number small { font-size: 16px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.task-list { display: grid; gap: 11px; }
.task { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 83px; padding: 14px; border: 1px solid var(--border); border-radius: 17px; background: var(--surface); text-align: left; }
.task .task-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--primary-soft); color: var(--primary); flex: 0 0 auto; }
.task-content { flex: 1; min-width: 0; }
.task-content h3 { font-size: 14px; font-weight: 600; line-height: 1.5; }
.task-content p { margin-top: 4px; font-size: 11px; color: var(--muted); line-height: 1.5; }
.task > svg { width: 17px; height: 17px; color: var(--muted); }
.progress-split { font-size: 10px; color: var(--muted); margin-top: 11px; }
.quiet-note { text-align: center; color: var(--muted); font-size: 11px; line-height: 1.8; margin-top: 15px; }
.search-box { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 0 13px; height: 46px; margin-top: 16px; }
.search-box svg { width: 18px; height: 18px; color: var(--muted); }
.search-box input { width: 100%; min-width: 0; height: 44px; border: 0; background: transparent; color: var(--fg); font-size: 12px; outline-offset: 0; }
input::placeholder { color: var(--muted); opacity: 1; }
.subject-tabs { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0,1fr)); gap: 5px; margin-top: 11px; border-bottom: 1px solid var(--border); }
.subject-tabs.dense button { font-size: 11px; padding: 0 1px; }
.subject-tabs button { min-width: 0; min-height: 46px; padding: 0 2px; font-size: 12px; line-height: 1.4; color: var(--muted); position: relative; white-space: normal; }
.subject-tabs button.active { color: var(--primary); font-weight: 700; }
.subject-tabs button.active::after { content: ""; position: absolute; width: 25px; height: 3px; bottom: -1px; left: calc(50% - 12.5px); background: var(--primary); border-radius: 3px; }
.knowledge-feature { position: relative; background: var(--primary-soft); border: 1px solid oklch(0.88 0.027 175); border-radius: 20px; padding: 17px 18px; margin-top: 17px; width: 100%; text-align: left; min-height: 157px; }
.knowledge-feature h2 { font-family: var(--display); font-size: 24px; line-height: 1.4; margin: 9px 0 4px; }
.knowledge-feature .feature-text { position: relative; z-index: 1; max-width: 205px; }
.knowledge-feature .eyebrow { font-size: 10px; color: var(--primary); }
.knowledge-feature .chapter-foot { display: flex; align-items: center; gap: 11px; margin-top: 16px; }
.chapter-foot .small-progress { width: 94px; background: oklch(0.86 0.03 174); }
.chapter-foot .small-progress span { background: var(--primary); }
.chapter-foot span { font-size: 10px; color: var(--primary); }
.feature-art { position: absolute; right: 15px; bottom: 39px; width: 93px; height: 82px; color: var(--primary); opacity: 0.5; }
.feature-art svg { width: 100%; height: 100%; }
.feature-arrow { position: absolute; right: 15px; bottom: 13px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--primary); }
.feature-arrow svg { width: 16px; height: 16px; }
.knowledge-list { display: grid; gap: 8px; }
.knowledge-row { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; padding: 11px 12px; min-height: 67px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.knowledge-number { color: var(--muted); width: 26px; font: 15px var(--display); }
.knowledge-row .knowledge-content { flex: 1; min-width: 0; }
.knowledge-content h3 { font-size: 12px; font-weight: 600; line-height: 1.6; }
.knowledge-content p { color: var(--muted); font-size: 10px; margin-top: 3px; }
.knowledge-row > svg { width: 16px; height: 16px; color: var(--muted); }
.knowledge-anchor { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 20px; margin-bottom: 10px; font-family: var(--body); font-size: 10px; font-weight: 650; letter-spacing: 0.08em; }
.knowledge-anchor::before, .knowledge-anchor::after { content: ""; width: 28px; height: 1px; background: oklch(0.75 0.05 180); }
.approach-note { display: inline-flex; align-items: center; gap: 5px; color: var(--primary); font-size: 10px; font-weight: 650; }
.approach-note svg { width: 13px; height: 13px; }
.lim { display: inline-flex; flex-direction: column; align-items: center; font-style: normal; vertical-align: middle; line-height: 1.1; margin-right: 6px; font-size: 0.9em; }
.lim small { font-size: 0.44em; margin-top: 3px; }
.fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.35; margin: 0 4px; }
.fraction > span:first-child { border-bottom: 1px solid currentColor; padding: 0 7px 2px; }
.fraction > span:last-child { padding-top: 2px; }
.math { font-family: Georgia, "Times New Roman", var(--display); }
.profile-head { display: flex; gap: 13px; align-items: center; padding: 4px 0 0; }
.avatar { width: 58px; height: 58px; flex: 0 0 auto; border-radius: 20px; background: var(--primary); color: var(--surface); display: grid; place-items: center; font-family: var(--display); font-size: 28px; }
.profile-head h1 { font-size: 21px; font-weight: 600; margin-bottom: 6px; }
.profile-head p { font-size: 11px; color: var(--muted); }
.demo-label { margin-left: auto; align-self: flex-start; margin-top: 4px; font-size: 9px; border: 1px solid var(--border); padding: 4px 6px; border-radius: 5px; color: var(--muted); }
.stats-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); margin-top: 22px; padding: 18px 4px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.stats-grid > div { text-align: center; }
.stats-grid > div + div { border-left: 1px solid var(--border); }
.stats-grid strong { font-size: 27px; font-weight: 600; letter-spacing: -1px; }
.stats-grid small { color: var(--muted); font-size: 11px; display: block; margin-top: 5px; }
.chart-switch { display: flex; background: var(--bg); border-radius: 9px; padding: 2px; }
.chart-switch button { min-width: 48px; min-height: 44px; font-size: 10px; color: var(--muted); border-radius: 7px; }
.chart-switch button.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.week-chart { display: flex; align-items: end; justify-content: space-between; height: 130px; gap: 13px; padding: 18px 0 0; }
.chart-day { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; min-width: 0; font-size: 9px; color: var(--muted); }
.chart-day .bar { width: 100%; max-width: 23px; background: var(--primary-soft); border-radius: 6px 6px 3px 3px; min-height: 4px; }
.chart-day.today .bar { background: var(--accent); }
.chart-day.today { color: var(--accent-ink); font-weight: 700; }
.chart-caption { font-size: 10px; margin-top: 13px; color: var(--muted); line-height: 1.7; }
.menu-list { border: 1px solid var(--border); background: var(--surface); border-radius: 18px; padding: 0 15px; margin-top: 17px; }
.menu-row { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 55px; text-align: left; }
.menu-row + .menu-row { border-top: 1px solid var(--border); }
.menu-row > svg { width: 19px; height: 19px; color: var(--primary); }
.menu-row strong { font-size: 12px; flex: 1; font-weight: 500; }
.menu-row small { color: var(--muted); font-size: 10px; }
.menu-row > svg:last-child { width: 15px; height: 15px; color: var(--muted); }
.toast { position: absolute; bottom: 99px; left: 24px; right: 24px; background: var(--fg); color: var(--surface); font-size: 12px; line-height: 1.6; padding: 12px 17px; border-radius: 13px; z-index: 20; text-align: center; box-shadow: 0 8px 25px oklch(0.2 0.02 190 / 0.2); pointer-events: none; }

const X4_QUESTIONS = [{"id":"x4-1-1","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":1,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"1.1921年中国共产党的成立,是中华民族伟大复兴征程中的一大里程碑。100 多年来,不管形势和任务如何变化,不管遇到什么样的惊涛骇浪，我们党都始终把握历史主动、锚定奋斗目标,沿着正确方向坚定前行。历史和实践充分证明,我们党坚定信仰信念、把握历史主动的根本所在是","options":[{"key":"A","text":"拥有马克思主义科学理论指导"},{"key":"B","text":"坚持不懈用党的创新理论凝心铸魂"},{"key":"C","text":"始终把人民放在心中最高位置"},{"key":"D","text":"科学社会主义提供了解决实际问题的正确答案"}],"answerKey":"A","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-1-2","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":2,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"2.中国是农业发达的文明古国,春耕、夏耘、秋收、冬藏是农业社会基本的生产实践活动。发于农耕文明的“二十四节气”,是古人观察时令、气候、物候等现象时总结出的时间知识体系,它能够准确反映自然节律变化，一直沿用至今。现代的人们仍能够通过“二十四节气”指导四时农耕,说明","options":[{"key":"A","text":"真理是永恒不变的"},{"key":"B","text":"自然规律具有重复性和稳定性"},{"key":"C","text":"一切真知都是从间接经验发源的"},{"key":"D","text":"正确的认识具有直接现实性"}],"answerKey":"B","explanation":"规律具有重复性。只要具备一定的条件,某种合乎规律的联系就以一种不可抗拒的趋势重复出现，发生作用。规律具有稳定性。世界上的事物和现象总是千差万别、变化不定的，但规律却是变化不定的现象中隐含着的相对稳定的东西。正是因为自然规律具有重复性和稳定性，人们在掌握了正确反映自然规律的“二十四节气”后,沿用至今,依然能在现实中获得与预想基本一致的结果。B正确。割裂真理的绝对性与相对性的辩证关系，就会走向形而上学的真理观,即绝对主义和相对主义。绝对主义又称独断论,片面夸大真理的绝对性,否认真理的相对性，认为真\n的道路。A错误。离开实践的认识是不可能产生的。一切真知都是从直接经验发源的。C错误。实践具有直接现实性，认识只有通过实践才能变成直接的、实实在在的现实。D错误。","issues":[]},{"id":"x4-1-3","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":3,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"3.在资本主义条件下,劳动是否是生产性的,取决于","options":[{"key":"A","text":"劳动是生产物质产品还是提供服务"},{"key":"B","text":"具体劳动能否还原为抽象劳动"},{"key":"C","text":"劳动能否为资本家带来剩余价值"},{"key":"D","text":"劳动力是否为社会生产发展所绝对需要"}],"answerKey":"C","explanation":"在资本主义条件下，劳动是否是生产性的，并不取决于劳动是生产物质产品还是提供服务，而取决于劳动能否为资本家带来剩余价值，只有创造剩余价值的劳动才是生产性劳动。C正确。","issues":[]},{"id":"x4-1-4","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":4,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"4.1921年3月，俄共（布）召开十大,毅然决定从战时共产主义政策过渡到新经济政策。新经济政策\n的主要特征是","options":[{"key":"A","text":"开展农业合作化"},{"key":"B","text":"发展商品经济"},{"key":"C","text":"发展大工业"},{"key":"D","text":"实行国家资本主义"}],"answerKey":"B","explanation":"从1918年夏到1921年春，列宁领导的苏维埃政权实行了以余粮收集制和取润\n\n\n2026考研政治终极预测④套卷\n系为主要特征的战时共产主义政策。1921年3月，俄共（布)召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经济为主要特征的新经济政策。其主要内容有：用粮食税制取代余粮收集制，允许私人自由贸易，恢复商品货币关系，允许私人小工业企业发展，采取一些国家资本主义的形式来发展生产。B正确。","issues":[]},{"id":"x4-1-5","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":5,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"5.毛泽东思想是在我国新民主主义革命、社会主义革命和社会主义建设的实践过程中,在总结我国\n革命和建设正反两方面历史经验的基础上,逐步形成和发展起来的。标志着毛泽东思想开始萌\n芽的是","options":[{"key":"A","text":"关于新民主主义革命基本思想的提出"},{"key":"B","text":"关于农村包围城市、武装夺取政权的思想的提出"},{"key":"C","text":"反对本本主义的提出"},{"key":"D","text":"马克思主义中国化命题的明确提出"}],"answerKey":"A","explanation":"大革命时期，毛泽东在《中国社会各阶级的分析》《湖南农民运动考察报告》等著作中提出的关于新民主主义革命的基本思想，标志着毛泽东思想开始萌芽。A正确。毛泽东提出并深人阐述的农村包围城市、武装夺取政权的思想，对红军和农村革命根据地的建立、巩固和发展发挥着根本指导作用,标志着毛泽东思想的初步形成；《反对本本主义》是毛泽东写于1930年土地革命战争时期（不是大革命时期）的著作；1938年在党的六届六中全会上毛泽东明确提出了马克思主义中国化的命题。B、C、D错误。点拨注意区分：毛泽东思想的开始萌芽/初步形成/走向成熟/继续发展。毛泽东思想在大革命时期开始萌芽，在土地革命战争时期初步形成，在抗日战争时期走向成熟，并在解放战争时期和中华人民共和国成立后继续发展。中共七大把毛泽东思想确立为党的指导思想并写入党章。","issues":[]},{"id":"x4-1-6","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":6,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"6.毛泽东《论十大关系》的报告,初步总结了我国社会主义建设的经验,明确提出要以苏为鉴,独立自主地探索适合中国情况的社会主义建设道路,标志着党探索中国社会主义建设道路的良好开端。毛泽东在《论十大关系》中提出的中国社会主义建设的基本方针是","options":[{"key":"A","text":"不要四面出击"},{"key":"B","text":"积极引导,稳步前进"},{"key":"C","text":"调动一切积极因素为社会主义事业服务"},{"key":"D","text":"实现工业、农业、国防和科学技术的现代化\n\n\n2026考研政治终极预测④套卷"}],"answerKey":"C","explanation":"《论十大关系》的报告确定了一个基本方针，就是“努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素全部调动起来”，为社会主义建设服务。调动一切积极因素为社会主义事业服务，是党关于社会主义建设的一条极为重要的方针，对于最大限度地团结全国各族人民，为建设社会主义现代化国家而奋斗，具有长远的指导意义。C正确。","issues":[]},{"id":"x4-1-7","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":7,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"7.高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要仔务。推动高质量发展的战略基点是","options":[{"key":"A","text":"加快实现高水平科技自立自强"},{"key":"B","text":"加快构建新发展格局"},{"key":"C","text":"推进农业现代化"},{"key":"D","text":"更好统筹质的有效提升和量的合理增长"}],"answerKey":"B","explanation":"加快实现高水平科技自立自强，是推动高质量发展的必由之路；加快构建新发展格局，是推动高质量发展的战略基点；推进农业现代化是实现高质量发展的必然要求；更好统筹质的有效提升和量的合理增长是推动高质量发展的重要举措。B正确，A、C、D错误。","issues":[]},{"id":"x4-1-8","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":8,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"8.党的二十届四中全会审议通过的《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，对“扩大高水平对外开放，开创合作共赢新局面”作了专章部署，强调“稳步扩大制度型开放”“积极扩大自主开放”。其中，扩大市场准人和开放领域的重点是","options":[{"key":"A","text":"新兴产业"},{"key":"B","text":"服务业"},{"key":"C","text":"农业"},{"key":"D","text":"先进制造业"}],"answerKey":"B","explanation":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》指出，对接国际高标准经贸规则，以服务业为重点，扩大市场准入和开放领域，扩大单边开放领域和区域。B正确。点拨2025年3月28日，习近平在会见国际工商界代表时指出，降低市场准入门槛是我们接下来扩大开放的重点。2025年，我们将扩大一些方面开放试点，还将加快文化、教育等领域的\n开放。","issues":[]},{"id":"x4-1-9","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":9,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"9.党的十八大以来，我们党把宗教工作摆在治国理政的重要位置，鲜明提出坚持我国宗教中国化方向等一系列新理念新举措，完善宗教工作体制机制，提高宗教工作法治化水平，推动新时代宗教工作取得积极成效。正确处理宗教领域各种矛盾和问题的根本途径是","options":[{"key":"A","text":"依法治理宗教事务"},{"key":"B","text":"系统推进我国宗教中国化"},{"key":"C","text":"积极引导宗教与社会主义社会相适应"},{"key":"D","text":"推动我国宗教同中华优秀传统文化相融合"}],"answerKey":"A","explanation":"中共中央政治局于2025年9月29日就系统推进我国宗教中国化进行第二十二次集体学习。习近平指出，依法治理宗教事务，是正确处理宗教领域各种矛盾和问题的根本途径。要完善相关法规和政策，深人开展法治宣传教育，推动严格执法，切实提高宗教工作法治化水平。A正确。","issues":[]},{"id":"x4-1-10","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":10,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"10.从1840年至1919年的80年间，中国人民对外来侵略进行了英勇顽强的反抗。但是，历次的反侵略战争,都是以中国失败、中国政府被迫签订丧权辱国的条约而告结束的。近代中国反侵略战争屡遭失败的最重要的原因是","options":[{"key":"A","text":"经济技术的落后"},{"key":"B","text":"思想观念的保守"},{"key":"C","text":"作战能力的不足"},{"key":"D","text":"社会制度的腐败"}],"answerKey":"D","explanation":"历次的反侵略战争，都是以中国失败、中国政府被迫签订丧权辱国的条约而告结束的。其原因，从中国内部因素来分析，主要有以下两个方面：一是社会制度的腐败，二是\n\n\n2026考研政治终极预测4套卷（一）答案及解析\n后。而前者则是更根本的原因。正是社会制度的腐败，才使得经济技术落后的状况长期得不到改变。腐败的中国半殖民地半封建的社会制度，阻碍了中国人民群众的广泛动员和抵抗，这是近代中国反侵略战争屡遭失败的最重要的原因。D正确。近代中国反侵略战争失败的另一个重要原因,是国家综合实力特别是经济技术和作战能力的落后。A、B、C 错误。\n11.答案C[简析新文化运动的倡导者通过批判孔学,动摇了封建正统思想的统治地位，在中国社会掀起一股思想解放的潮流。新文化运动的倡导者批判孔学，是为了给中国发展资本主义扫清障碍。C正确。新文化运动提倡民主和科学，搞新文化运动,并不是要否定中国的全部传统文化。A错误。五四运动促进了马克思主义在中国的传播及其同中国工人运动的结合。B错误。新文化运动是在1915年开始的,清政府这个“洋人的朝廷”早已被推翻。D错误。","issues":[]},{"id":"x4-1-11","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":11,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"11.新文化运动的倡导者以进化论观点和个性解放思想为主要武器，猛烈秤击以孔子为代表的“往圣先贤”，大力提倡新道德、反对旧道德，提倡新文学、反对旧文学，包括提倡白话文、反对文言文。新文化运动的倡导者批判孔学,是为了","options":[{"key":"A","text":"否定中国的全部传统文化"},{"key":"B","text":"促进马克思主义在中国的传播及其同中国工人运动的结合"},{"key":"C","text":"给中国发展资本主义扫清障碍"},{"key":"D","text":"推翻清政府这个“洋人的朝廷”"}],"answerKey":"C","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-1-12","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":12,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"12.中国人民的抗日战争从1931年开始，到1945年结束，前后经历了14年的浴血奋战。在世界反法西斯战争的进程中，中国人民的抗日战争被称为“最早的抗争，最后的胜利”。成为抗日战争取得完全胜利的重要标志的是","options":[{"key":"A","text":"中国参加联合国制宪会议，成为联合国的创始国和五个常任理事国之一"},{"key":"B","text":"日本天皇裕仁发布《终战诏书》，日本无条件投降"},{"key":"C","text":"日本代表在东京湾美军军舰密苏里号上签署向同盟国的投降书"},{"key":"D","text":"台湾以及澎湖列岛重归中国主权管辖"}],"answerKey":"D","explanation":"1945年10月25日，中国政府在台湾举行受降仪式。被日本占领50年之久的台湾以及澎湖列岛,重归中国主权管辖。这是抗日战争取得完全胜利的重要标志。D正确。联合国制宪会议于1945年4月至6月在美国旧金山举行，包括中国解放区代表董必武在内的中国代表团出席\n日，中、美、英三国发表《波茨坦公告》，敦促日本投降。8月15日，日本天皇裕仁发布《终战诏书》，日本无条件投降。9月2日，日本天皇和政府以及日本大本营的代表在东京湾美军军舰密苏里号上签署向同盟国的投降书，侵华日军128万人向中国投降。至此，中国人民的14年抗日战争胜利结束,世界反法西斯战争也胜利结束。9月3日成为中国人民抗日战争胜利纪念日。A、B、C都不符合题意。","issues":[]},{"id":"x4-1-13","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":13,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"13.经过艰苦卓绝的战斗，中朝军队战胜武装到牙齿的强敌，打破了美军不可战胜的神话，迫使不可\n一世的侵略者于1953年7月27日在停战协定上签字。抗美援朝战争的伟大胜利","options":[{"key":"A","text":"是中华民族从近代以来陷人深重危机走向伟大复兴的历史转折点"},{"key":"B","text":"是近代以来中国人民反抗外敌人侵第一次取得完全胜利的民族解放斗争"},{"key":"C","text":"彻底结束了旧中国一盘散沙的局面"},{"key":"D","text":"是中国人民站起来后屹立于世界东方的宣言书\n\n\n2026考研政治终极预测4套卷（一）"}],"answerKey":"D","explanation":"抗美援朝战争的伟大胜利，是中国人民站起来后屹立于世界东方的宣言书，是中华民族走向伟大复兴的重要里程碑。D正确。中国人民抗日战争是20世纪中国和人类历史上的重大事件。这一伟大胜利，是近代以来中国人民反抗外敌人侵第一次取得完全胜利的民族解放斗争，是中华民族从近代以来陷人深重危机走向伟大复兴的历史转折点。A、B错误。新民主主义革命的胜利，中华人民共和国的成立，彻底结束了旧中国一盘散沙的局面。C错误。","issues":[]},{"id":"x4-1-14","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":14,"type":"choice","difficulty":1,"module":"思想道德与法治","stem":"14.法律权利是指由一定的社会物质生活条件所制约的行为自由，是法律所允许的权利人为了满足自己的利益而采取的、由其他人的法律义务所保障的法律手段。法律权利区别于其他权利的根本所在是","options":[{"key":"A","text":"受社会物质生活条件的制约"},{"key":"B","text":"由国家强制力保障其实现"},{"key":"C","text":"源于现实需要"},{"key":"D","text":"随着历史的发展变化而变化"}],"answerKey":"B","explanation":"法律权利不仅由法律规定或认可，而且受法律维护或保障，具有不可侵犯性。由国家强制力保障其实现,这是法律权利区别于其他权利的根本所在。B正确，A、C、D都不符合题意。","issues":[]},{"id":"x4-1-15","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":15,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"15.习近平在《关于<中共中央关于制定国民经济和社会发展第十五个五年规划的建议》的说明》中指出，“十五五”规划建议的着力点是","options":[{"key":"A","text":"推动人的全面发展、全体人民共同富裕迈出坚实步伐"},{"key":"B","text":"推动经济实现质的有效提升和量的合理增长"},{"key":"C","text":"有力有序有效应对世界百年变局的新形势和发展中突出问题"},{"key":"D","text":"为基本实现社会主义现代化目标奠定更加坚实的基础\n次峰会是上海合作组织迄今规模最大的一次峰会，是谋划高质量发展的一次峰会，是指引人类前进方向的一次峰会，是成果最为丰硕的一次峰会。上合组织天津峰会的最大亮点是"}],"answerKey":"C","explanation":"习近平在《关于（中共中央关于制定国民经济和社会发展第十五个五年规划的建议》的说明》中指出，在《建议》稿起草过程中，我们坚持目标导向和问题导向，立足于夯实基础、全面发力的基本定位，以为基本实现社会主义现代化目标奠定更加坚实的基础为着眼点进行系统谋划，\n以有力有序有效应对世界百年变局的新形势和发展中突出问题为着力点补短板、强弱项。C正\n确，D错误。推动经济实现质的有效提升和量的合理增长，推动人的全面发展、全体人民共同富\n裕迈出坚实步伐，是《建议》指导方针的内容。A、B错误。\n\n\n2026考研政治终极预测0套卷","issues":[]},{"id":"x4-1-16","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":16,"type":"choice","difficulty":1,"module":"形势与政策","stem":"2025年8月31日至9月1日，上海合作组织成员国元首理事会第二十五次会议在天津举行。这 |","options":[],"answerKey":"A","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x4-1-17","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":17,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"17.习近平指出,人工智能带来前所未有发展机遇,也带来前所未遇风险挑战。要把握人工智能发展趋势和规律，加紧制定完善相关法律法规、政策制度、应用规范、伦理准则，构建技术监测、风险预警、应急响应体系，确保人工智能安全、可靠、可控。这启示我们","options":[{"key":"A","text":"对待人工智能要坚持“两点论”和“重点论”的统一"},{"key":"B","text":"事物的本质有一个逐渐暴露、逐渐展开的过程"},{"key":"C","text":"在人工智能这类新技术的治理中要加强底线思维"},{"key":"D","text":"发展人工智能要坚持真理尺度和价值尺度的统一\n的认识之外独立地存在着并起着作用,使我们成为“盲目的必然性”的奴隶。一经我们认识了这种不依赖于我们的意志和我们的意识而起着作用的（如马克思千百次反复说过的那样）规律，我们就成为自然界的主人。”以下说法正确的有"}],"answerKey":"ABCD","explanation":"“两点论”是指在分析事物的矛盾时，不仅要看到矛盾双方的对立，而且要看到矛盾双方的\n统一；不仅要看到矛盾体系中存在主要矛盾、矛盾的主要方面，而且要看到次要矛盾、矛盾的次要方面。“重点论”是指要着重把握主要矛盾、矛盾的主要方面,并以此作为解决问题的出发点。“两点论”和“重点论”的统一要求我们，看问题既要全面地看，又要看主流、大势、发展趋势。对待人工智能,既要看到人工智能带来机遇的一面,也要看到人工智能带来风险的一面。A正确。事物的现象错综复杂，而且事物的本质有一个逐渐暴露、逐渐展开的过程，所以，人们对事物本质的认识不是一次完成的，而是一个不断深化的过程。对于人工智能发展趋势和规律的认识也\n需要和客观的条件，划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值的一种积极的思维。人工智能带来了前所未遇的风险挑战,因此底线思维在人工智能治理领域有其特殊重要性。C正确。任何成功的实践都是真理尺度和价值尺度的统一,是合规律性和合目的性的统一。D正确。","issues":[]},{"id":"x4-1-18","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":18,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"18.列宁在《唯物主义和经验批判主义》中指出，“当我们不知道自然规律的时候，自然规律是在 |","options":[],"answerKey":"AC","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x4-1-19","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":19,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"19.当前,世界之变、时代之变、历史之变正以前所未有的方式展开。面对动荡多变的国际形势，只有站在历史正确的一边，拿出智慧、勇气和担当，才能作出正确选择。从唯物史观的角度分析，要“站在历史正确的一边”是因为","options":[{"key":"A","text":"历史发展有其自身的客观规律\n\n\n2026考研政治终极预测①套卷"},{"key":"B","text":"任何历史人物都不能决定和改变历史发展的总进程和总方向"},{"key":"C","text":"正确认识历史发展方向是社会历史存在和发展的前提"},{"key":"D","text":"历史规律不以任何个人、阶级的意志为转移"}],"answerKey":"ABD","explanation":"自然规律和社会规律都具有不以人的意志为转移的客观性。历史规律不以任何个人、阶\n级以至整个人类的意志为转移。A、D正确。不管什么样的历史人物，在历史上发挥什么样的作用，都要受到社会发展客观规律的制约，而不能决定和改变历史发展的总进程和总方向。B正确。唯物史观认为，人不是抽象的而是现实的,现实的人及其活动是社会历史存在和发展的前提。C错误。","issues":[]},{"id":"x4-1-20","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":20,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"20.经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径，这种解决方式虽然最终也能够使社会再生产由失衡慢慢转变为平衡，却是以社会经济生活的严重混乱甚至瘫以及社会资源和财富的极大浪费为代价的。以下关于经济危机的认识，正确的有","options":[{"key":"A","text":"只要存在资本主义制度，经济危机就是不可避免的"},{"key":"B","text":"资本主义经济危机具有周期性，这是由社会资本再生产的周期性决定的"},{"key":"C","text":"生产过剩是资本主义经济危机的本质特征"},{"key":"D","text":"经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起的"}],"answerKey":"ACD","explanation":"资本主义发展到一定阶段，就会发生以生产过剩为基本特征的经济危机。当经济危机发生时，大量商品积压，大批生产企业减产或停工，许多金融机构倒闭，整个社会经济生活一片混乱。生产过剩是资本主义经济危机的本质特征，但是这种过剩是相对过剩，即相对于劳动人民有支付能力的需求来说社会生产的商品显得过剩，而不是与劳动人民的实际剩。经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付三\n\n\n2026考研政治终极预测4套卷（一）答案及解析\n这仅仅是危机在形式上的可能性。资本主义经济危机爆发的根本原因是资本主义的基本矛盾。只要存在资本主义制度，经济危机就是不可避免的。A、C、D正确。资本主义经济危机具有周期性,这是由资本主义基本矛盾运动的阶段性决定的。B错误。点拨注意另一个提法：资本主义经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性的特点。","issues":[]},{"id":"x4-1-21","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":21,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"21.资本主义生产的目的是获得利润。不同生产部门的资本家之间为了得到尽可能多的利润必然展开激烈的竞争从而导致利润平均化。平均利润形成后","options":[{"key":"A","text":"商品价值就转化为生产价格"},{"key":"B","text":"价值规律的实现形式发生了变化"},{"key":"C","text":"生产价格不再随着商品价值的变化而变动"},{"key":"D","text":"每一个部门获得的利润都等于该部门生产的剩余价值"}],"answerKey":"AB","explanation":"利润转化为平均利润，价值也就转化为生产价格。生产价格是商品价值的转化形式，是生产成本与平均利润之和。A正确。生产价格是价值的转化形式，商品按照生产价格而不是价值出售并不违背价值规律，而是价值规律的实现形式发生了变化。虽然从个别部门来看，资本家获得的平均利润与本部门工人创造的剩余价值可能不一致，但从全社会来看，整个资本家阶级获得的利润总额与雇佣工人所创造的剩余价值总额是相等的。B正确,D错误。生产价格随着商品价值的变化而变动，生产商品的社会必要劳动时间减少，生产价格就会降低；反之，生产价格就会提高。C错误。","issues":[]},{"id":"x4-1-22","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":22,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"22.马克思主义要在中国发挥跨越时空的思想伟力，必须“穿中国服装”“讲中国话”。1938年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，正式提出了“马克思主义的中国化”这一命题。毛泽东强调","options":[{"key":"A","text":"没有抽象的马克思主义，只有具体的马克思主义"},{"key":"B","text":"马克思主义的中国化就是使中国的每一实践都与马克思主义理论相符合"},{"key":"C","text":"马克思主义的中国化使马克思主义在其每一表现中带着中国的特性"},{"key":"D","text":"马克思主义的中国化即是说按照中国的特点去应用它"}],"answerKey":"ACD","explanation":"1938年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，强调：“没有抽象的马克思主义,只有具体的马克思主义…马克思主义的中国化，使之在其每一表现中带着中国的特\n思主义的中国化”这一命题的正式提出。A、C、D正确。马克思主义强调理论联系实际,而不是\n让实践符合理论。B错误。","issues":[]},{"id":"x4-1-23","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":23,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"23.党的二十届四中全会通过的“十五五”规划建议，明确要求“高标准建设海南自由贸易港”。高标准建设海南自由贸易港，主要目的是","options":[{"key":"A","text":"促进海南高质量发展"},{"key":"B","text":"助力全国构建新发展格局"},{"key":"C","text":"打造中国式现代化的引领地"},{"key":"D","text":"打造中国新发展格局的战略支点"}],"answerKey":"AB","explanation":"2025年11月6日，习近平在海南省三亚市听取海南自由贸易港建设工作汇报。在这次汇\n报会上，习近平阐述了背后的深刻考量：“高标准建设海南自由贸易港，主要目的是促进海南高质量发展，助力全国构建新发展格局。”A、B正确。11月9日，习近平主席会见来华出席第十五届全国运动会开幕式的国际奥委会主席考文垂和终身名誉主席巴赫。习近平强调，全运会是中国最大规模、最高水平的综合性运动会，这届全运会由广东、香港、澳门三地合办。粤港澳大湾区是中国开放程度最高、经济活力最强的区域之一。推进粤港澳大湾区建设，就是要打造中国新发展格局的战略支点、高质量发展的示范地、中国式现代化的引领地。C、D错误。","issues":[]},{"id":"x4-1-24","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":24,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"24.深化要素市场化改革是构建高水平社会主义市场经济体制的重要举措，是推进全国统一大市场建设的重要内容。深化要素市场化改革，有助于","options":[{"key":"A","text":"推动生产要素畅通流动"},{"key":"B","text":"各类资源高效配置"},{"key":"C","text":"市场潜力充分释放"},{"key":"D","text":"让市场起全部作用"}],"answerKey":"ABC","explanation":"A、B、C正确。发挥市场在资源配置中的决定性作用，并不是让市场起全部作用。应当看到，市场并不是万能的，在产业布局、公共产品供给、市场秩序维护等领域存在天然失灵。政府\n必须坚持有所为、有所不为，弥补市场失灵和无力涉及的领域。D错误。","issues":[]},{"id":"x4-1-25","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":25,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"25.几十年来，关于对民营经济在改革开放和社会主义现代化建设事业中地位和作用的认识、党和国家对民营经济发展的方针政策，我们党理论和实践是一脉相承、与时俱进的。党和国家对民营经济发展的基本方针政策，概括起来就是A.非公有制经济是我国社会主义市场经济的重要组成部分，受宪法和法律保护B.毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展\nD.促进各种所有制经济优势互补、共同发展，促进非公有制经济健康发展和非公有制经济人士健康成长\n\n\n2026考研政治终极预测4套卷（一）\n有力行动、付出艰苦努力，推动绿色低碳转型取得历史性成就。实现碳达峰碳中和是","options":[{"key":"A","text":"中国破解资源环境约束突出问题、实现可持续发展的内在要求"},{"key":"B","text":"中国顺应技术进步趋势、推动经济结构转型升级的必然选择"},{"key":"C","text":"中国满足人民群众日益增长的优美生态环境需求、促进人与自然和谐共生的迫切需要"},{"key":"D","text":"中国担当大国责任、推动构建人类命运共同体的主动作为"}],"answerKey":"ABCD","explanation":"几十年来，关于对民营经济在改革开放和社会主义现代化建设事业中地位和作用的认识、\n党和国家对民营经济发展的方针政策，我们党理论和实践是一脉相承、与时俱进的。党和国家对民营经济发展的基本方针政策，概括起来就是：中国共产党领导人民发展社会主义市场经济，非公有制经济是我国社会主义市场经济的重要组成部分，受宪法和法律保护；党和国家坚持和\n完善社会主义基本经济制度，毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支\n\n\n2026考研政治终极预测4套卷\n有制经济发展；党和国家保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护，促进各种所有制经济优势互补、共同发展，促进非公有制经济健康发展和非公有制经济人士健康成长。这些基本方针政策已经纳入中国特色社会主义制度体系，宪法和党章都有明确体现，我们将一以贯之坚持和落实，不能变，也不会变。我们谈促进民营经济发展，这是一个基本的大前提。A、B、C、D全选。","issues":[]},{"id":"x4-1-26","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":26,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"作出碳达峰碳中和重大宣示五年来，中国牢固树立和践行绿水青山就是金山银山的理念，采取有力行 |","options":[],"answerKey":"ABCD","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x4-1-27","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":27,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"27.130多年前爆发的中日甲午战争是中国近代史上的一个重要时间节点。甲午战争中国战败的影响有","options":[{"key":"A","text":"中国开始陷人“边疆危机”"},{"key":"B","text":"中国人开始有了普遍的民族意识的觉醒"},{"key":"C","text":"帝国主义列强对中国的争夺和瓜分达到高潮"},{"key":"D","text":"标志着以“自强”“求富”为目标的洋务运动的失败"}],"answerKey":"BCD","explanation":"B、C、D正确。中国在中日甲午战争前已经陷入“边疆危机”。19世纪70至80年代,列强从侵占中国周边邻国发展到蚕食中国边疆地区，使中国陷人“边疆危机”。英国从印度侵人西藏，又从缅甸入侵云南。法国则从越南侵犯广西。俄国从中亚人侵新疆。日本吞并琉球，侵犯中国台湾。A错误。点拨帝国主义列强对中国的争夺和瓜分的图谋，在1894年中日甲午战争爆发后达到高潮，表现在列强竞相租借港湾和划分势力范围，中国陷入“瓜分危机”。注意区分“边疆危机”和“瓜分危机”。","issues":[]},{"id":"x4-1-28","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":28,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"28.1935年12月，中共中央在陕北瓦窑堡召开政治局扩大会议，讨论全国政治形势和党的策略路线问题、军事战略问题。会议批评并克服了党内长期存在的“左”倾冒险主义、关门主义错误倾向，明确提出党的基本策略任务是建立广泛的抗日民族统一战线。瓦窑堡会议是从第五次反“围剿”失败到全民族抗战兴起过程中召开的一次重要会议，它表明","options":[{"key":"A","text":"党在新的历史时期将要到来时掌握了政治上的主动权"},{"key":"B","text":"党开始努力解决政治路线问题"},{"key":"C","text":"党正在从中国的实际情况出发，创造性地开展工作"},{"key":"D","text":"实事求是的思想路线在全党范围确立起来"}],"answerKey":"ABC","explanation":"1935年12月，中共中央在陕北瓦窑堡召开政治局扩大会议，提出党的基本策略任务是建立广泛的抗日民族统一战线，批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向。瓦窑堡会议是从第五次反“围剿”失败到全民族抗战兴起过程中召开的一次重要会议，它表明党已经克服“左”倾冒险主义和关门主义，制定出抗日民族统一战线的新策略，使党在新的历史时期将要到来时掌握了政治上的主动权；表明党在遵义会议着重解决军事路线问题和组织问题之后，开始努力解决政治路线问题；表明党在总结经验教训的基础上，正在从中国的实际情况出发，创造性地开展工作。A、B、C正确。延安整风运动是一次深刻的马克思主义思想教育运动，也是一场思想解放运动。它坚持马克思主义同中国实际相结合的正确方向，使实事求是的思想路线在全党范围确立起来。D错误。","issues":[]},{"id":"x4-1-29","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":29,"type":"multi","difficulty":2,"module":"形势与政策","stem":"29.2021年一2025年的“十四五”时期，我国发展历程极不寻常、极不平凡。面对错综复杂的国际形势和艰巨繁重的国内改革发展稳定任务，以习近平同志为核心的党中央团结带领全党全国各族人民,迎难而上、砺前行,经受住世纪疫情严重冲击,有效应对一系列重大风险挑战，推动党和国家事业取得新的重大成就。“十四五\"时期我国发展取得的重大成就主要有","options":[{"key":"A","text":"我国经济实力、科技实力、综合国力跃上新台阶"},{"key":"B","text":"人均国内生产总值达到中等发达国家水平"},{"key":"C","text":"中国式现代化迈出新的坚实步伐"},{"key":"D","text":"第二个百年奋斗目标新征程实现良好开局"}],"answerKey":"ACD","explanation":"2021年一2025年的“十四五”时期，我国发展历程极不寻常、极不平凡。面对错综复杂的国际形势和艰巨繁重的国内改革发展稳定任务，以习近平同志为核心的党中央团结带领全党全国各族人民，迎难而上、砥砺前行，经受住世纪疫情严重冲击，有效应对一系列重大风险挑战，推动党和国家事业取得新的重大成就。我国经济实力、科技实力、综合国力跃上新台阶，中国式现代化迈出新的坚实步伐，第二个百年奋斗目标新征程实现良好开局。A、C、D正确。人均国内生产总值达到中等发达国家水平，是2035年我国基本实现社会主义现代化的一个重要标志性指标。B错误。\n\n\n2026考研政治终极预测4套卷（一）答案及解析","issues":[]},{"id":"x4-1-30","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":30,"type":"multi","difficulty":2,"module":"思想道德与法治","stem":"30.社会主义核心价值观具有超越以往一切社会核心价值观的先进性。社会主义核心价值观","options":[{"key":"A","text":"体现社会主义的本质属性"},{"key":"B","text":"扎根中华优秀传统文化土壤"},{"key":"C","text":"吸纳世界文明有益成果"},{"key":"D","text":"是反映人类社会发展进步的价值理念"}],"answerKey":"ABCD","explanation":"社会主义核心价值观体现了社会主义意识形态的本质要求，体现了社会主义制度在思想精神层面的质的规定性，以其先进性、人民性、真实性站在人类道义制高点上，彰显出独特而强大的价值观优势。社会主义核心价值观具有超越以往一切社会核心价值观的先进性，它集中体现了社会主义的本质属性，扎根于中华优秀传统文化的土壤，吸收借鉴了一切人类优秀文化的先进价值，是反映人类社会发展进步的价值理念。A、B、C、D全选。","issues":[]},{"id":"x4-1-31","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":31,"type":"multi","difficulty":2,"module":"思想道德与法治","stem":"31.习近平总书记强调：“改革和法治如鸟之两翼、车之两轮。”改革的“破”和“变”，与法治的“立”和“稳”，只有相辅相成才能相得益彰。耕好改革“试验田”，需要把在法治轨道上推进改革和在改革进程中完善法治有机结合起来，发挥好立法引导、推动、规范、保障改革的“稳定器”作用。为此,要做到","options":[{"key":"A","text":"立法主动适应改革需要，确保改革于法有据"},{"key":"B","text":"实践证明行之有效的举措和经验，应及时上升为法律法规"},{"key":"C","text":"对不适应改革要求的现行法律法规，能修改的则及时修改，宜废止的则及时废止"},{"key":"D","text":"改革创新要大胆试，大胆闯，相关立法活动不受法定程序限制\n\n\n2026考研政治终极预测④套卷"}],"answerKey":"ABC","explanation":"耕好改革“试验田”，需要把在法治轨道上推进改革和在改革进程中完善法治有机结合起来，发挥好立法引导、推动、规范、保障改革的“稳定器”作用。立法主动适应改革需要，确保改革于法有据，改革创新大胆试、大胆闯、自主改就更有底气。实践证明行之有效的举措和经验，也应及时上升为法律法规。耕好改革“试验田”，立法工作除了要做好“加法”，还要做好“减法”。对不适应改革要求的现行法律法规，能修改的则及时修改，宜废止的则及时废止。防止不合时宜的法规条款束缚改革步伐、迟滞改革进程，有助于增强改革决心、排除改革阻力、巩固改革成果。A、B、C正确。我国立法贯彻公正、公平、公开原则，坚持科学立法、民主立法、依法立法，表达人民的共同意志和诉求。立法活动必须遵循法定程序。就全国人民代表大会的立法程序而言，大体包括法律案的提出、法律案的审议、法律案的表决和法律的公布四个环节。D错误。","issues":[]},{"id":"x4-1-32","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":32,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"32.中国人民抗日战争暨世界反法西斯战争胜利80周年纪念活动，是一次庄严隆重、大气磅、震撼\n人心、激励奋进的抗战纪念盛典。纪念活动","options":[{"key":"A","text":"进一步弘扬了伟大抗战精神"},{"key":"B","text":"进一步强化了与原同盟国的军事合作"},{"key":"C","text":"进一步坚定了全面推进强国建设、民族复兴伟业的信念信心"},{"key":"D","text":"进一步展示了推动构建人类命运共同体的责任担当"}],"answerKey":"ACD","explanation":"习近平强调,纪念中国人民抗日战争暨世界反法西斯战争胜利80周年活动，是一次庄严隆重、大气磅、震撼人心、激励奋进的抗战纪念盛典，进一步弘扬了伟大抗战精神，进一步坚定了全面推进强国建设、民族复兴伟业的信念信心，进一步展示了推动构建人类命运共同体的责任担当。A、C、D 正确,B错误。\n33.答案ABCD市早苗涉华错误言行阐明中国政府立场。傅聪在致函中表示，日本首相高市早苗在国会答辩时公然发表涉台露骨挑言论。这是1945年日本战败以来日方领导人首次在正式场合鼓吹所谓台湾有事就是日本有事”并与行使集体自卫权相关联，首次在台湾问题上表达试图武装介人的野心，首次对中国发出武力威胁，公然挑战中方核心利益。有关言论极其错误、极为危险，性质影响极其恶劣。在中方多次严正交涉和强烈抗议后，日方仍不思悔改，拒不撤回错误言论。中方对此强烈不满、坚决反对。\n后国际秩序，是对14亿多中国人民和曾遭受日本侵略的亚洲国家人民的公然挑。台湾是中国的神圣领土，如何解决台湾问题是中国人自己的事，不容任何外来干涉。如日方胆敢武力介人台海局势，将构成侵略行为，中方将坚决行使《联合国宪章》和国际法赋予的自卫权，坚定捍卫国家主权和领土完整。作为二战战败国，日方必须深刻反省历史罪责，恪守对于台湾问题做出的政治承诺,立即停止挑越线，收回错误言论。该函将作为联合国大会正式文件，向全体会员国散发。A、B、C、D全选。\n\n\n2026考研政治终极预测④套卷","issues":[]},{"id":"x4-1-33","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":33,"type":"multi","difficulty":2,"module":"形势与政策","stem":"33.2025年11月21日，中国常驻联合国代表傅聪致函联合国秘书长古特雷斯，就日本首相高市早苗涉华错误言行阐明中国政府立场。傅聪在致函中表示，日本首相高市早苗在国会答辩时公然发表涉台露骨挑言论。这是1945年日本战败以来日方领导人首次在正式场合鼓吹所谓“台湾有事就是日本有事”并与行使集体自卫权相关联，首次在台湾问题上表达试图武装介人的野\n心，首次对中国发出武力威胁，公然挑战中方核心利益。高市早苗有关言论","options":[{"key":"A","text":"严重违反国际法和国际关系基本准则"},{"key":"B","text":"严重破坏战后国际秩序"},{"key":"C","text":"是对14亿多中国人民和曾遭受日本侵略的亚洲国家人民的公然挑"},{"key":"D","text":"极其错误、极为危险，性质影响极其恶劣"}],"answerKey":"ABCD","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-1-34","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":34,"type":"material","difficulty":2,"module":"马克思主义基本原理","stem":"如何理解“向善惠民，始终是科技创新的价值取向”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","习近平总书记强调：“要把满足人民对美好生活的向往作为科技创新的落脚点，把惠民、利 民、富民、改善民生作为科技创新的重要方向。”向善惠民，始终是科技创新的价值取向。 在乡村沃野，智能高效稻麦联合收割机1分钟收割600公斤作物，大幅提高夏收秋收效率； 在医院手术室，国产骨科手术机器人、腔镜手术机器人投入应用；在养老机构，智能腕表和智能 拐杖等装备优化养老服务…·……“十四五”期间，一个个“小而美”的科技创新成果与百姓生活深 度融合，更好满足人民群众对美好生活的向往。 恩格斯曾说，“社会一旦有技术上的需要，则这种需要就会比十所大学更能把科学推向 前进。”我国有14亿多人口，中等收入群体规模超4亿人，拥有超大规模市场和丰富的技术应用场景。民生日用的现实需求与日俱增，各行业对新技术、新产品翘首以盼。当供给侧“贴合”需求侧，当生产与消费深度互动，创新的“星星之火”就能以“燎原之势”形成新的产业蓝海。往深层看，坚持科技向善惠民，不仅关乎民生改善，更关乎科技创新的未来。当今时代，人工智能、生物医药、基因编辑等新技术在激发发展新动能的同时，也对社会治理、法律规则等各 方面带来新的冲击。比如，大语言模型处理、生成数据时，可能侵犯个人隐私；换脸、拟声等技术 可能被用来诈骗、制造虚假信息。因此，科技创新已经不只是一个技术课题，而是具有了更鲜明 的价值属性、治理属性、伦理属性。只有坚持科技向善惠民，并在这样的价值基准上完善社会治理、法律规则，才能在防范社会风险的同时让科技创新的正向效应最大化。 2026考研政治终极预测4套卷（一） 中国式现代化，民生为大。科技创新最终要落到“人”上。新征程上，抓住一切有利时机， 利用一切有利条件，推动更多好技术变成新应用，定能以科技创新的累累硕果惠及广大群众，创 造更加美好的生活。 摘编自《人民日报》（2025年10月15日）","前不久，到宇树科技参观，负责人特意介绍起脚下的一段楼梯：低处的台阶边缘多处破损，越往上，破损痕迹越少。原来，这是训练机器人时留下的。一开始，机器人可能走不了几步就会 摔倒;经过不断调试改良，越走越顺利，爬楼已经不在话下。这段意义独特的楼梯，镌刻成长之 路，照见创新之路。 创新是一个不断试错的过程，望而却步不行，盲目蛮千也不行。在我国航天领域,有一套独 特的工作方法一一归零。哪方面出现问题时，就从技术和管理两个层面，对问题进行定位、分 析、复现、纠正、举一反三，确保从根本上消除问题。正因为不怕试错、善于纠错，才成就了探月 工程六战六捷的佳绩。有位科研人员说得好：“做科研最不怕的就是“问题’，有“问题’的地方 正是科研可挖的“并，。”大胆假设、认真求证，在总结经验教训中再出发，才能通往成功彼岸。 不断试错的创新，需要更多包容与支持。在2025年世界人形机器人运动会上，一些机器人 “选手”摔倒等情况引发讨论。事实上，创新就有可能跌跌撞撞。新兴产业与未来产业在孕育 早期,也很难做到“零失误”“零瑕疵”。从稚嫩到成熟,从跟跑到奔跑,这是事物发展的必经阶段。过去，新能源汽车续航短是个困扰，但今天“里程焦虑”正在技术的升级下不断得到缓解， 新能源汽车越来越受欢迎。近来，多地出台科技创新“容错”新规，更多耐心资本充当企业“长跑搭档”。营造好鼓励创新、宽容失败的环境，给予创新创业“十年不鸣”的底气，才能浇灌出“一鸣惊人”的硕果。摘编自《人民日报》（2025年10月9日） （1）如何理解“向善惠民，始终是科技创新的价值取向”？ （2）为什么在鼓励创新的同时也要宽容失败？ 2026考研政治终极预测④套卷"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-1-35","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":35,"type":"material","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"35.结合材料回答问题：\n材料 1过去10年，中国新能源汽车年销量增长约171倍。从受困于“缺芯之痛”，到如今实现“破茧","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","过去10年，中国新能源汽车年销量增长约171倍。从受困于“缺芯之痛”，到如今实现“破茧成蝶”，创新驱动加速产业选代升级，新能源汽车不仅成为高质量发展的强劲引擎，也是“中国制造”走向世界的闪亮名片。这场华丽转身，生动诠释了理念变革如何为产业发展注入新动能，为中国经济打开新天地。理念一新天地宽。一辆汽车，可以窥见一个大国发展理念的深层嬉变。回望来路，自党的十八届五中全会提出创新、协调、绿色、开放、共享的新发展理念以来，一 不断跃上新台阶，深刻体现出科学思想的真理力量和实践伟力。翻开“十四五”成绩单，新发展理念指引下，实践向前的步履愈发坚实：全球创新指数排名 首次硚身前十，大国重器频频亮相；京津冀、长三角、粤港澳大湾区经济体量占全国四成以上；全国地级及以上城市PM"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-1-36","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":36,"type":"material","difficulty":2,"module":"中国近现代史纲要","stem":"如何理解“中国人民抗日战争，从一开始就具有拯救人类文明、保卫世界和平的重大\n意义”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","我们的战争是神圣的、正义的,是进步的、求和平的。不但求一国的和平,而且求世界的和平,不但求一时的和平,而且求永久的和平。欲达此目的,便须决一死战,便须准备着一切牺牲,坚持到底,不达目的,绝不停止。牺牲虽大，时间虽长,但是永久和平和永久光明的新世界,已经鲜明地摆在我们的前面。我们从事战争的信念，便建立在这个争取永久和平和永久光明的新中 国和新世界的上面。 摘自毛泽东《论持久战》1939年1月，毛泽东同志在为《论持久战》英译本所作序言中指出，“伟大的中国抗战,不但是中国的事,东方的事,也是世界的事”。与军国主义侵略分子血战到底的中国人民,不仅在为中华民族的前途命运而战，也在为整个人类的前途命运而战。摘编自《人民日报》（2025年9月4日）","习近平总书记深刻指出，“中国人民抗日战争，从一开始就具有拯救人类文明、保卫世界和平的重大意义”。摘自《求是》（2025年第17期）","纪念中国人民抗日战争暨世界反法西斯战争胜利80周年盛大阅兵,在展示综合国力、振奋 民心士气的同时，让全世界看到中国维护和平的坚定意志和强大能力。中华民族自古热爱和 平,和平性是中华文明的突出特性。但历史告诉我们,仅仅热爱和平是不够的,只有具备强大的 国防实力,才能维护和平。 历史教训说明：能战方能止战，准备打才可能不必打,越不能打越可能换打。从战争与和平的辩证法出发，“以武止戈”思想的时代价值需要进一步彰显。摘编自《人民日报》（2025年9月28日）（1）如何理解“中国人民抗日战争，从一开始就具有拯救人类文明、保卫世界和平的重大 意义”？（或：如何理解伟大的中国抗战“不但是中国的事，东方的事，也是世界的事”“不 但求一国的和平，而且求世界的和平”？） （2）结合党带领人民实现民族独立、人民解放的历史和当前的发展环境，说明为什么要建设世界 一流军队。 2026考研政治终极预测0套卷"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-1-37","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":37,"type":"material","difficulty":2,"module":"思想道德与法治","stem":"如何理解“对于青年人而言，他们寻找英烈、致敬英烈的过程，实际上也是一次精神层面的\n自我洗礼”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","要结合党史宣传教育，讲好老一辈无产阶级革命家的故事，教育引导广大千部群众特别是青少年传承红色基因、廣续红色血脉，永远听党话、跟党走。摘编习近平2025年11月7日在广东考察时的讲话","不久前，山东济南历城革命烈士陵园内，73·个曾被标注为“无名”的墓碑，终于刻上了烈士的姓名。无名烈士得以有名，背后是山东第一医科大学“提灯者”英烈回乡团队志愿者的不懈努力。从打开棺到整理遗骸,从提取DNA到比对数据，从开办讲座到制作短视频…这群平均年龄28岁的志愿者，用自己的专业和热情，让英雄有名，让岁月有声。据统计，我国登记在册的196万余名革命烈士中，仅有55.9万名有明确安葬地。这些烈士都曾是一个个鲜活的生命，他们也有儿女情长，也有悲欢离合。他们以坚定的信仰信念、炽烈的家国情怀，书写了一幅幅激越沉雄的历史画卷。为烈士确认身份、找到亲人，让他们从“无名”到“有名”、从“有名”到“留名”，既是对英烈的崇高致敬，也是对其亲属最好的慰藉。对于青年人而言，他们寻找英烈、致敬英烈的过程，实际上也是一次精神层面的自我洗礼。摘编自《人民日报》（2025年5月6日）","“人工智能是年轻的事业，也是年轻人的事业。”4月29日，习近平总书记在上海考察时勉励年轻一代，“要怀爱国之心、立报国之志、增强国之能，把个人奋斗同国家前途命运紧紧联系在一起，跑好历史的接力棒，在推进中国式现代化的宽广舞台上绽放绚丽的青春光彩”。人工智能成为发展的关键变量，新一轮科技革命和产业变革给出了历史性机遇。向来得风气之先、善于把握时代机遇的青年人，大有可为，当大有作为。青年是常为新的，最具创新热情，最具创新动力。纵观文明长河，“自古英雄出少年”，是人类社会的经验总结也是深切期许。 没有谁比青年更愿意、更善于创新创造。平均年龄不到30岁的青年突击队，自主研发的 “天枢”大模型，已成为化工领域“创新风向标”；平均年龄28岁的中国航信“技术极客”，研发的 “千”大模型，让航班预测准确率提升40%，智能客服响应速度提高3倍，每年为行业节省超亿元成本。从基础研究到应用转化，创新力十足的青年，正在挑大梁、担重任。这份奋发有为、做先锋的精气神，正化为源源不断的朝气锐气，展现在时代进步发展的方方面面。摘编自《在大有可为的时代大有作为》（《人民日报》2025年4月30日）（1）如何理解“对于青年人而言，他们寻找英烈、致敬英烈的过程，实际上也是一次精神层面的 自我洗礼”？ （2）新时代青年如何“把个人奋斗同国家前途命运紧紧联系在一起，跑好历史的接力棒，在推进 中国式现代化的宽广舞台上绽放绚丽的青春光彩”？（或：最具创新动力的青年，如何在大 有可为的时代大有作为？） 2026考研政治终极预测4套卷（一） 38.","回答问题：","针对记者问及全球治理侣议对解决全球性问题和挑战的现实意义，王毅说，今年是世界反 法西斯战争胜利和联合国成立80周年。在这个承前启后的特殊历史年份，习近平主席郑重提出全球治理侣议，为加强和完善全球治理进一步贡献中国智慧、提出中国方案。王毅说，全球治理倡议正逢其时。当前，百年变局加速演进，地区动荡频发、经济发展受阻、逆全球化抬头、规则法治缺位,治理赤字不断加剧。在此背景下,构建什么样的全球治理体系、如何改革完善全球治理体系，日益成为国际社会高度关注的重大命题。今年可谓全球治理的“大年”。习近平主席此时提出全球治理倡议，十分及时，十分关键，顺应了各国人民的普遍愿望，符合当今世界的紧迫需求，一经提出就得到与会各国领导人和国际组织的欢迎和支持，也必将得到国际社会的广泛认同。王毅说，全球治理倡议指引方向。习近平主席在讲话中明确了倡议的核心理念，即奉行主权平等、遵守国际法治、践行多边主义、倡导以人为本、注重行动导向。这五大理念阐明了改革完善全球治理需要遵循的原则、方法和路径。 中发挥核心作用，推动各国依托联合国等多边机制，参与全球治理体系改革与建设，使之与时俱进，更有效应对时代挑战。摘编自《人民日报》（2025年9月2日）","近期，习近平主席提出全球治理侣议，强调奉行主权平等、遵守国际法治、践行多边主义、侣 导以人为本、注重行动导向，为破解全球治理赤字提供了中国方案。全球治理倡议和全球发展倡议、全球安全倡议、全球文明倡议是新时代中国为世界提供的系统性国际公共产品。当前，130多个国家和国际组织参与全球发展倡议的落实机制，全球安全倡议已得到130多个国家和 国际地区组织支持，全球文明倡议多次被写入联合国决议及各种双多边文件，全球治理倡议一经提出就得到各国积极响应，近期更是在第八十届联大一般性辩论期间得到多方赞誉和支持。四大全球倡议为应对世界变局、破解紧迫难题贡献了中国智慧和方案，为构建人类命运共同体 提供战略引领。 摘编自《人民日报》（2025年10月2日） （2）“四大全球倡议为应对世界变局、破解紧迫难题贡献了中国智慧和方案”，这体现了中国怎样 的外交理念和世界情怀 2026考研政治终极预测④套卷"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-1-38","paper":"x4-1","book":"2026肖秀荣《4套卷》","setNo":1,"no":38,"type":"material","difficulty":2,"module":"形势与政策","stem":"结合材料回答问题：（2）“四大全球倡议为应对世界变局、破解紧迫难题贡献了中国智慧和方案” |","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":[]},"issues":["missing-content"],"qc":["missing-content"]},{"id":"x4-2-1","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":1,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"1.“中华民族伟大复兴势不可挡！”习近平总书记在天安门城楼上的庄严宣示，是历史昭示的真理，是团结奋进的强音。今天，在全面推进中国式现代化的新征程上，我们比历史上任何时期都更接\n近、更有信心和能力实现中华民族伟大复兴的目标，同时必须准备付出更为艰巨、更为艰苦的努力。推进中华民族伟大复兴历史进程，要求我们增强历史主动、发扬实干精神，这是因为","options":[{"key":"A","text":"每一个人都是历史的创造者"},{"key":"B","text":"人能够按照自己的需要去认识规律和改造规律"},{"key":"C","text":"历史规律只有通过人的有目的、有意识的活动才能实现"},{"key":"D","text":"人们在自已选定的条件下创造历史"}],"answerKey":"C","explanation":"自自然规律通过盲目的、不自觉的力量在起作用并实现出来。历史规律则不同。人的活动是\n历史规律得以存在并发生作用的前提、基础和途径，历史规律只有通过人的有目的、有意识的活动才能实现。中华民族伟大复兴势不可挡,但也必须通过人的实践奋斗才能实现。C正确。规律是客观的，人们可以认识规律但不能改造规律。B错误。人民群众是历史的创造者。就每一个人而言，他在一定意义上“创造”了自己的“历史”即通过自己的人生谱写了自身个体的“历史”，但这并不能与创造社会历史画等号。A错误。马克思指出：“人们自已创造自己的历史，但是他们并不是随心所欲地创造，并不是在他们自已选定的条件下创造，而是在直接碰到的、既定的、从过去承继下来的条件下创造。D错误。","issues":[]},{"id":"x4-2-2","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":2,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"2.20世纪初,物理学家卡尔·史瓦西解出了爱因斯坦广义相对论的一个精确解,这个数学结果预\n言：如果一个天体的质量被压缩到某个临界半径内，它周围的时空将变得极度弯曲,形成一个连\n光也无法逃逸的区域。这个区域就是黑洞。然而，黑洞的存在曾一度饱受质疑，就连爱因斯坦也\n认为它只是数学上的假想产物,并非真实存在。直到1971年，天文观测显示,天鹅座X一1双星系\n统中伴随蓝超巨星的不可见天体极有可能是一个黑洞。之后越来越多的观测证据显示，黑洞广\n泛存在于星系中心和大质量恒星残中。2019年，M87星系中心超大质量黑洞的照片发布，我们得以“看见”黑洞。黑洞从一个预言中的概念到最终被人们观测到，说明人的认识","options":[{"key":"A","text":"可以超前于直接的实践"},{"key":"B","text":"是自己头脑里固有的"},{"key":"C","text":"是对客观世界的直观反映"},{"key":"D","text":"先于人的实践经验"}],"answerKey":"A","explanation":"具体的认识过程可以与一定的实践不完全同步进行，预测、假说、规划等就超前于直接的实践。A正确。唯物主义认识路线坚持反映论的立场,认为认识是主体对客体的反映，人的一切知识都是从后天接触实际中得来的。唯心主义认识路线否认认识是人脑对客观世界的反映，认为认识先于人的实践经验。其中,主观唯心主义认为人的认识是主观自生的，是生而知之的。客观唯心主义认为人的认识是上帝的启示或某种客观精神的产物。B、D错误。旧唯物主义只是物化性理解现实世界的存在,把人与外部世界的关系理解为直观反映关系。C错误。","issues":[]},{"id":"x4-2-3","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":3,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"3.社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问","options":[{"key":"A","text":"两大部类在总量上的比例问题"},{"key":"B","text":"工资与剩余价值的分配问题"},{"key":"C","text":"社会总产品的实现问题"},{"key":"D","text":"劳动过程和价值增殖过程的统一问题"}],"answerKey":"C","explanation":"社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题。C 正确。\n\n\n2026考研政治终极预测套卷","issues":[]},{"id":"x4-2-4","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":4,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"4.第二次世界大战后，由于多种社会因素的影响，资本主义发生了一系列变化。正确认识这些变化的原因和实质,对于在新的历史条件下深刻把握资本主义的本质和规律，具有十分重要的意义。导致第二次世界大战后资本主义发生变化的根本推动力量是","options":[{"key":"A","text":"改良主义政党对资本主义制度的改革"},{"key":"B","text":"工人阶级争取自身权利和利益的斗争"},{"key":"C","text":"社会主义制度的优越性对资本主义的影响"},{"key":"D","text":"科学技术革命和生产力的发展"}],"answerKey":"D","explanation":"第二次世界大战后，资本主义发生变化的原因主要有以下几个方面：（1)科学技术革命和生产力的发展,是资本主义发生变化的根本推动力量。（2)工人阶级争取自身权利和利益的斗争，是推动资本主义发生变化的重要力量。（3)社会主义制度初步显示的优越性对资本主义产生了重要影响。（4)主张改良主义的政党对资本主义制度的改革，也对资本主义发生变化起到了重要作用。D正确。\n5.答案C半统治之下，实际上处于长期的不统一状态,再加上土地广大,其结果是中国的经济、政治和文化的发展表现出极端的不平衡。C正确。近代以来,资本-帝国主义侵略势力不但逐步操纵了中国\n统治。A错误。中国的封建势力日益衰败并同外国侵略势力勾结，成为资本-帝国主义压迫、奴役中国人民的社会基础和统治支柱。D错误。B不符合题意。","issues":[]},{"id":"x4-2-5","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":5,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"5.认清中国国情，是解决中国革命问题的基本前提。1939年毛泽东在《中国革命和中国共产党》中\n指出，中国是在许多帝国主义国家的统治或半统治之下，实际上处于长期的不统一状态，再加上\n土地广大,其结果是","options":[{"key":"A","text":"帝国主义侵略势力日益成为直接统治中国的决定性力量"},{"key":"B","text":"封建经济在社会经济生活中占着显然的优势\n\n\n2026考研政治终极预测4套卷（二）"},{"key":"C","text":"经济、政治和文化的发展表现出极端的不平衡"},{"key":"D","text":"资产阶级成为资本-帝国主义压迫、奴役中国人民的社会基础"}],"answerKey":"C","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-2-6","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":6,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"6.我国对资本主义工商业的社会主义改造经历了三个步骤。其中，在实行个别企业的公私合营中，企业利润分配上采取的办法是","options":[{"key":"A","text":"定股定息"},{"key":"B","text":"四马分肥"},{"key":"C","text":"和平买"},{"key":"D","text":"公私兼顾"}],"answerKey":"B","explanation":"我国对资本主义工商业的社会主义改造经历了三个步骤。其中，第一步（初级形式的国家资本主义）和第二步（个别企业的公私合营）的企业利润分配都是“四马分肥”。第三步（全行业的公私合营）在分配上实行定股定息。B正确。","issues":[]},{"id":"x4-2-7","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":7,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"7.实现现代化是近代以来中国人民孜孜以求的宏愿。中国共产党团结带领中国人民追求民族复兴\n的历史，也是一部不断探索现代化道路的历史。现代化的最终目标是实现","options":[{"key":"A","text":"中华民族伟大复兴"},{"key":"B","text":"物质财富极大丰富"},{"key":"C","text":"社会关系高度和谐"},{"key":"D","text":"人自由而全面的发展"}],"answerKey":"D","explanation":"推动全体人民共同富裕与促进人的全面发展是高度统一的。马克思主义政党的最高目标是实现共产主义，并把实现人的自由而全面发展作为共产主义的本质特征。习近平总书记指出，现代化的最终目标是实现人自由而全面的发展。D正确。物质财富极大丰富，消费资料按需分配；社会关系高度和谐，人们精神境界极大提高；实现每个人自由而全面的发展，人类从必然王国向自由王国飞跃，是共产主义社会三大基本特征。A、B、C错误。","issues":[]},{"id":"x4-2-8","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":8,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"8.教育是国之大计、党之大计，是功在当代、利在千秋的德政工程。教育的根本任务是","options":[{"key":"A","text":"人民满意"},{"key":"B","text":"价值观塑造"},{"key":"C","text":"立德树人"},{"key":"D","text":"为国育才"}],"answerKey":"C","explanation":"我们要建设的教育强国，是中国特色社会主义教育强国，必须以坚持党对教育事业的全面领导为根本保证，以立德树人为根本任务，以为党育人、为国育才为根本目标，以服务中华民族伟大复兴为重要使命，以教育理念、体系、制度、内容、方法、治理现代化为基本路径，以支撑引领中国式现代化为核心功能，最终是办好人民满意的教育。人民满意是发展教育的根本尺度。C正确。","issues":[]},{"id":"x4-2-9","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":9,"type":"choice","difficulty":1,"module":"形势与政策","stem":"9.2025年8月，习近平率中央代表团出席西藏自治区成立60周年庆祝活动，听取西藏自治区党委\n和政府工作汇报并发表重要讲话。习近平强调，治藏稳藏兴藏，首先是要","options":[{"key":"A","text":"保持西藏的政治安定、社会稳定、民族团结、宗教和顺"},{"key":"B","text":"因地制宜发展高原特色优势产业，特别是特色农牧业和清洁能源产业"},{"key":"C","text":"加强生态文明建设，守护好“世界屋脊”和“亚洲水塔”"},{"key":"D","text":"认真落实全面从严治党政治责任，努力营造风清气正的政治生态"}],"answerKey":"A","explanation":"习近平强调，治藏稳藏兴藏，首先是要保持西藏的政治安定、社会稳定、民族团结、宗教和顺。A正确。B、C、D错误。","issues":[]},{"id":"x4-2-10","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":10,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"10.近代中国资产阶级思想与封建主义思想的第一次正面交锋是","options":[{"key":"A","text":"“师夷长技以制夷”主张的提出"},{"key":"B","text":"洋务派与顽固派的论战"},{"key":"C","text":"维新派与守旧派的论战"},{"key":"D","text":"新文化运动倡导者对以孔子为代表的“往圣先贤”的猛烈秤击"}],"answerKey":"C","explanation":"维新派与守旧派的论战，实质上是资产阶级思想与封建主义思想在中国的第一次正面交锋。通过论战，西方资产阶级社会政治学说在中国得到进一步的传播，戊戌变法运动的惟幕随之拉开。C正确,A、B、D错误。\n\n\n2026考研政治终极预测4套卷（二）答案及解析","issues":[]},{"id":"x4-2-11","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":11,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"11.1924年1月，中国国民党第一次全国代表大会在广州召开，大会通过的宣言对三民主义作出了新的\n解释。新三民主义成为第一次国共合作的政治基础,究其原因,是由于新三民主义的政纲","options":[{"key":"A","text":"把民生主义概括为“平均地权”"},{"key":"B","text":"把斗争的矛头直接指向北洋军阀"},{"key":"C","text":"体现了联俄、联共、扶助农工三大革命政策"},{"key":"D","text":"同中国共产党在民主革命阶段的纲领基本一致"}],"answerKey":"D","explanation":"孙中山的新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致，因而成为第\n一次国共合作的政治基础。D正确。","issues":[]},{"id":"x4-2-12","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":12,"type":"choice","difficulty":1,"module":"中国近现代史纲要","stem":"12.全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必须保\n持在思想上、政治上和组织上的独立性，放手发动群众，壮大人民力量；必须坚持对人民军队的\n绝对领导，努力发展人民武装和抗日根据地；必须对国民党采取又团结又斗争、以斗争求团结的\n方针。这样做的目的,就是","options":[{"key":"A","text":"巩固和发展抗日民族统一战线"},{"key":"B","text":"发展进步势力、争取中间势力、孤立顽固势力"},{"key":"C","text":"发展和扩大抗日根据地，推动大后方的抗日运动"},{"key":"D","text":"力争中国共产党对抗日战争的领导权，使自已成为团结全民族抗战的中坚力量\n\n\n2026考研政治终极预测④套卷"}],"answerKey":"D","explanation":"全全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必\n须保持在思想上、政治上和组织上的独立性，放手发动群众，壮大人民力量；必须坚持对人民军\n队的绝对领导，努力发展人民武装和抗日根据地；必须对国民党采取又团结又斗争、以斗争求团\n结的方针。这样做的目的，就是力争中国共产党对抗日战争的领导权，使自己成为团结全民族\n抗战的中坚力量。这是把抗日战争引向胜利的中心一环。D正确。A、B、C错误。","issues":[]},{"id":"x4-2-13","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":13,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"13.《论人民民主专政》是毛泽东在中国新民主主义革命取得决定性胜利、全国性政权即将建立的时\n刻，为纪念中国共产党成立28周年而撰写的文章。文章论述了即将成立的中华人民共和国的国\n家性质，各阶级在国家中的地位及其相互关系，国家对内、对外政策等。《论人民民主专政》这篇\n①奠定了新中国国家政权的理论基础和一定发展阶段上的政策基础\n②为即将成立的新中国作了政治理论准备\n③与中共七届二中全会的决议一起构成了《中国人民政治协商会议共同纲领》的基础④是中国共产党人开始探索适合中国国情的社会主义建设道路的标志","options":[{"key":"A","text":"023"},{"key":"B","text":"①2@"},{"key":"C","text":"03④"},{"key":"D","text":"@23④"}],"answerKey":"A","explanation":"①②③正确。《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索适合中国国\n情的社会主义建设道路的标志。④错误。因此，本题选A。","issues":[]},{"id":"x4-2-14","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":14,"type":"choice","difficulty":1,"module":"思想道德与法治","stem":"14.法治思维是指以法治价值和法治精神为导向，运用法律原则、法律规则、法律方法思考和处理问\n题的思维模式。法治思维以法律原则和法律规则为依据来指导人们的社会行为，这是在强调，\n法治思维是一种","options":[{"key":"A","text":"正当性思维"},{"key":"B","text":"规范思维"},{"key":"C","text":"逻辑思维"},{"key":"D","text":"底线思维"}],"answerKey":"B","explanation":"法治思维包含以下几层含义：（1)法治思维以法治价值和法治精神为指导，蕴含着公正、平\n等、民主、人权等法治理念,是一种正当性思维；(2)法治思维以法律原则和法律规则为依据来指\n导人们的社会行为，是一种规范思维；（3)法治思维以法律手段与法律方法为依托分析问题、处\n理问题、解决纠纷,是一种逻辑思维；（4)法治思维是一种符合规律、尊重事实的科学思维。因此,法治思维是一种融法律的价值属性和工具理性于一体的特殊的高级法律意识。B正确，A、C、D 错误。\n15.答案A\n邓小平理论、“三个代表”重要思想、科学发展观，全面贯彻习近平新时代中国特色社会主义思\n想，深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，牢固树立人心是最大的政治的理念，把巩固马克思主义在意识形态领域的指导地位、巩固全党全国人民团结奋斗的共同思想基础作为根本任务，把推动用党的创新理论武装头脑、统一思想、\n凝聚共识、指导实践放在首位，以理想信念教育为核心，以调动一切积极因素为着力点，完善工\n作体系，夯实基层基础，创新方式方法，注重实际实效，促进全体人民紧紧团结在党的周围、凝聚\n在中国特色社会主义伟大旗帜下，为以中国式现代化全面推进强国建设、民族复兴伟业提供坚\n强思想政治保证。A正确,B、C、D不符合题意。\n16. 答案D\n“建设可持续的明天”是2025年10月30日至11月1日在韩国举行的亚太经合组织第三十二次\n团领导人第十八次峰会的主题；“构建公正的世界和可持续的星球”是2024年在巴西举行的二十国集团领导人第十九次峰会的主题。A、B、C错误。\n\n\n2026考研政治终极预测④套卷","issues":[]},{"id":"x4-2-15","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":15,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"15.2025年9月，《中国共产党思想政治工作条例》发布。《条例》是我们党历史上第一部关于思想\n政治工作的统领性、综合性基础主干法规，是做好新时代思想政治工作的基本遵循。《条例》强\n调，新时代思想政治工作的根本任务是","options":[{"key":"A","text":"巩固马克思主义在意识形态领域的指导地位、巩固全党全国人民团结奋斗的共同思想基础"},{"key":"B","text":"推动用党的创新理论武装头脑、统一思想、凝聚共识、指导实践"},{"key":"C","text":"加强理想信念教育，牢固树立人心是最大的政治的理念"},{"key":"D","text":"调动一切积极因素，完善工作体系，夯实基层基础，创新方式方法，注重实际成效\n导人峰会首次在非洲大陆举行。峰会顶住美国压力于开幕当日通过《二十国集团领导人约翰内\n斯堡峰会宜言》，这是G20峰会首次于开幕当日通过联合宣言。宣言的顺利通过表明各国正以\n实际行动加强协作、支持多边主义。G20约翰内斯堡峰会的主题是"}],"answerKey":"A","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-2-16","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":16,"type":"choice","difficulty":1,"module":"形势与政策","stem":"2025年11月22日,二十国集团(G20)领导人第二十次峰会在南非约翰内斯堡开幕,这是 |","options":[],"answerKey":"D","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x4-2-17","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":17,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"17.20多年前，时任浙江省委书记的习近平科学阐释“地瓜经济”理论，深刻指出“必须跳出浙江发\n展浙江，在大力引进各种要素的同时打到省外去、国外去，利用外部资源、外部市场实现更大的\n发展”。“地瓜经济”给我们的启示有","options":[{"key":"A","text":"事物发展的动力在外部"},{"key":"B","text":"任何事物都处在普遍联系之中"},{"key":"C","text":"事物之间的联系是多样的"},{"key":"D","text":"事物的发展可以脱离内部条件"}],"answerKey":"BC","explanation":"世界上的万事万物都处于普遍联系之中。联系具有多样性。世界上的事物是多样的，事\n物之间的联系也是多样的。事物联系的主要方式有直接联系与间接联系、内部联系与外部联系、本质联系与非本质联系、必然联系与偶然联系等。“跳出浙江发展浙江”就是要看到浙江与省外、国外的联系,这种联系可能是直接联系,也可能是间接联系。B、C 正确。对立统一规律揭示了事物普遍联系的根本内容和变化发展的内在动力。事物内部矛盾是事物发展的源泉和动力，A错误。D显然错误。","issues":[]},{"id":"x4-2-18","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":18,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"18.信息技术迅猛发展，催生了一个信息爆炸、思想奔涌的时代。海量信息以前所未有的速度与密\n度涌人社会认知领域，深度浸润青年一代。如何在纷繁复杂的信息海洋中保持清醒？人们需要\n批判性思维。辩证唯物主义揭示了“实践、认识、再实践、再认识”的螺旋式上升规律，而批判性\n思维正是实现这一认识飞跃的关键枢纽。它要求以实践为标准，不断检验、\n\n\n2026考研政治终极预测4套卷（二）\n止思想化。具备批判性思维的青年，就如同拥有穿透迷雾的“理性之眼”，能够洞察事物本质\n与发展规律，在复杂社会现象前保持头脑冷静，作出明智判断与理性决策。在认识和实践活动\n中，批判性思维体现在","options":[{"key":"A","text":"对感性材料加以去粗取精、去伪存真"},{"key":"B","text":"在认识活动中避免任何非理性因素的作用"},{"key":"C","text":"在对现存事物的肯定的理解中同时包含对现存事物的否定的理解"},{"key":"D","text":"在实践中不断推翻以往的真理并建立新的真理"}],"answerKey":"AC","explanation":"只有对感性材料进行去粗取精、去伪存真、由此及彼、由表及里的改造，才能获得对于事物的本质和规律的认识。A正确。认识活动是一个复杂的运动过程，表现为无论在感性认识中还\n是在理性认识中,都有非理性因素的作用。非理性因素对于人的认识能力和认识活动具有激活、驱动作用。B错误。唯物辩证法本质上是批判的和革命的。马克思指出：“辩证法在对现存事物的肯定的理解中同时包含对现存事物的否定的理解，即对现存事物的必然灭亡的理解；辩\n证法对每一种既成的形式都是从不断的运动中，因而也是从它的暂时性方面去理解；辩证法不崇拜任何东西，按其本质来说，它是批判的和革命的。”正确。真理只能发展，而不可能被推\n翻。任何真理都标志着主观同客观的符合，都包含着不依赖于任何人的客观内容，都同谬误有原则的界限，都不可能被推翻。否则，就不是真理。这一点是绝对的、无条件的。相对主义片面夸大真理的相对性，否认真理的绝对性，从而导致错误做法，即借口真理是发展的而否认真理内容的客观性，认为原来的真理已经不是真理而将它丢弃或推翻。这就把真理的相对性歪曲成了主观随意性，由此走向主观真理论，陷人了不可知论和诡辩论。D错误。","issues":[]},{"id":"x4-2-19","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":19,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"19.国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义。第二次世界大战后，在所有发达资本主义国家，国家垄断资本主义无论在广度上还是深度上都有了更迅速、更普遍的发展。国家通过多种形式参与私人垄断资本的再生产过程是国家垄断资本主义的主要形式之一。国家通过多种形式参与私人垄断资本的再生产过程,其方式主要包括","options":[{"key":"A","text":"国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节"},{"key":"B","text":"国家向私人垄断企业大量订货，为私人垄断企业提供有保证的国家市场"},{"key":"C","text":"国家通过各种形式的津贴和补助，直接、间接地资助私人垄断企业"},{"key":"D","text":"国家通过社会福利开支扩大消费需求，为私人断企业创造市场条件"}],"answerKey":"BCD","explanation":"国国家垄断资本主义的主要形式有五种。第一种是国家所有并直接经营企业。第二种是国\n家与私人共有、合营企业。第三种是国家通过多种形式参与私人垄断资本的再生产过程，包括\n国家作为商品和劳务的采购者，向私人垒断企业大量订货，为私人断企业提供有保证的国家\n市场；国家通过各种形式的津贴和补助，直接、间接地资助私人垄断企业；国家通过社会福利开\n支，提高社会购买力，扩大消费需求，为私人垄断企业创造市场条件。第四种是宏观调节，主要\n是国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节，以实现经济快速\n增长、充分就业、物价稳定和国际收支平衡的基本目标。第五种是微观规制。A项是宏观调节的\n内容，不属于题目所问的“国家通过多种形式参与私人垄断资本的再生产过程”的方式。正确答案是 B、C、D。","issues":[]},{"id":"x4-2-20","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":20,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"20.第二次世界大战后，资本主义生产资料所有制发生了新的变化，法人资本所有制崛起并成为居\n主导地位的资本所有制形式。法人资本所有制","options":[{"key":"A","text":"主要存在于当代资本主义经济生活中居支配地位的巨型公司中"},{"key":"B","text":"主要特点是资本占有主体多元化，公司资本的所有权与控制权不再统一"},{"key":"C","text":"在性质上是一种基于资本雇佣劳动的垄断资本集体所有制"},{"key":"D","text":"体现了资本剥削雇佣劳动的关系"}],"answerKey":"ACD","explanation":"A、C、D正确。法人资本所有制是法人股东化的产物，其主要特点是各类法人（企业法人\n和机构法人）取代个人或家族股东成为企业的主要出资人，企业的股票高度集中于少数法人股\n东之手，法人股东凭借手中集中化的控股权干预甚至直接参与公司治理，监督和制约管理阶层\n的经营行为，使公司资本的所有权与控制权重新趋于合一。B项描述的是私人股份资本所有制的特点,不选。\n\n\n2026考研政治终极预测4套卷（二）答案及解析","issues":[]},{"id":"x4-2-21","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":21,"type":"multi","difficulty":2,"module":"马克思主义基本原理","stem":"21.1921年3月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到新经济政策。这一决定\n表明，列宁的社会主义建设思想发生了重大转变，对俄国这样一个小农经济占优势的国家如何\n走向社会主义又有了新的认识。新经济政策的主要内容有","options":[{"key":"A","text":"取消粮食税制以调动农民的积极性"},{"key":"B","text":"恢复商品货币关系，允许私人自由贸易"},{"key":"C","text":"允许私人小工业企业发展"},{"key":"D","text":"采取一些国家资本主义的形式来发展生产"}],"answerKey":"BCD","explanation":"1921年3月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品\n经济为主要特征的新经济政策。其主要内容有：用粮食税制取代余粮收集制，允许私人自由贸\n易，恢复商品货币关系，允许私人小工业企业发展，采取一些国家资本主义的形式来发展生产。\nB、C、D正确,A错误。","issues":[]},{"id":"x4-2-22","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":22,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"22.社会主义改造基本完成后，我国进人社会主义建设时期。如何建设和巩固社会主义，是党面临的一\n个新课题。以毛泽东同志为主要代表的中国共产党人对社会主义建设道路的初步探索","options":[{"key":"A","text":"巩固和发展了我国的社会主义制度"},{"key":"B","text":"丰富了科学社会主义的理论和实践"},{"key":"C","text":"彻底摆脱了苏联模式的影响"},{"key":"D","text":"为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础"}],"answerKey":"ABD","explanation":"A、B、D正确。在社会主义建设道路初步探索时期，由于中国共产党人对什么是社会主义以及怎样建设社会主义的问题并没有完全搞清楚，因此，不能说已经彻底摆脱了苏联模式的影\n响。C错误。","issues":[]},{"id":"x4-2-23","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":23,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"23.“十五五”时期我国发展环境面临深刻复杂变化。大国关系牵动国际形势，国际形势演变深刻影响国内发展，我国发展处于战略机遇和风险挑战并存、不确定难预料因素增多的时期。但是，我国经济基础稳、优势多、韧性强、潜能大，长期向好的支撑条件和基本趋势没有变。我国发展具有的优势包括","options":[{"key":"A","text":"中国特色社会主义制度优势"},{"key":"B","text":"超大规模市场优势"},{"key":"C","text":"完整产业体系优势"},{"key":"D","text":"丰富人才资源优势\n\n\n2026考研政治终极预测④套卷"}],"answerKey":"ABCD","explanation":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出，我国经济基础\n稳、优势多、韧性强、潜能大，长期向好的支撑条件和基本趋势没有变，中国特色社会主义制度优\n势、超大规模市场优势、完整产业体系优势、丰富人才资源优势更加彰显。党的二十届四中全会\n着眼于发挥这“四大优势”作出战略部署。A、B、C、D全选。点拨这“四大优势”相辅相成、有机统一，超大规模市场优势成为重要战略支点。","issues":[]},{"id":"x4-2-24","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":24,"type":"multi","difficulty":2,"module":"思想道德与法治","stem":"24.“维护国家法治统一”是习近平法治思想的原创性概念、标识性概念，是习近平法治思想的重要\n理论创新成果。市场经济是法治经济，要用法治来规范政府和市场的边界。完善维护国家法治\n统一制度机制，维护国家法治统一，有利于","options":[{"key":"A","text":"消除区域市场分割和地方保护"},{"key":"B","text":"保障全国统一大市场建设"},{"key":"C","text":"加快构建高水平社会主义市场经济体制"},{"key":"D","text":"夯实高质量发展制度根基"}],"answerKey":"ABCD","explanation":"市场经济是法治经济，要用法治来规范政府和市场的边界。完善维护国家法治统一制度\n机制，维护国家法治统一，对于消除区域市场分割和地方保护，保障全国统一大市场建设，加快\n构建高水平社会主义市场经济体制，加快构建新发展格局，夯实高质量发展制度根基具有重要意义。A、B、C、D全选。","issues":[]},{"id":"x4-2-25","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":25,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"25.《教育强国建设规划纲要（2024一2035年）》提出，要坚定不移走中国特色社会主义教育发展道\n路，坚持社会主义办学方向，全面把握教育的","options":[{"key":"A","text":"政治属性"},{"key":"B","text":"人民属性"},{"key":"C","text":"战略属性"},{"key":"D","text":"创新属性"}],"answerKey":"ABC","explanation":"《教育强国建设规划纲要（2024一2035年）》的总体要求是：坚持以习近平新时代中国特色社会主义思想为指导，深人贯彻党的二十大和二十届二中、三中全会精神，全面贯彻习近平总书\n记关于教育的重要论述，深刻领悟“两个确立”的决定性意义，坚决做到“两个维护”，坚持教育优先发展，全面贯彻党的教育方针，坚定不移走中国特色社会主义教育发展道路，坚持社会主义办\n学方向，全面把握教育的政治属性、人民属性、战略属性，落实立德树人根本任务，为党育人、为\n国育才，全面服务中国式现代化建设，扎根中国大地办教育，加快建设高质量教育体系，培养德\n智体美劳全面发展的社会主义建设者和接班人，加快建设具有强大思政引领力、人才竞争力、科\n技支撑力、民生保障力、社会协同力、国际影响力的中国特色社会主义教育强国，为建设社会主\n义现代化强国、全面推进中华民族伟大复兴提供有力支撑。A、B、C正确。","issues":[]},{"id":"x4-2-26","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":26,"type":"multi","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"26.习近平指出：“没有农业农村现代化，就没有整个国家现代化。”党的二十届四中全会通过的《中\n专章部署，明确了“十五五”时期农业农村发展的战略任务和政策举措。以下内容正确的有","options":[{"key":"A","text":"农业农村现代化关系中国式现代化全局和成色"},{"key":"B","text":"农业农村现代化关系强国建设根基"},{"key":"C","text":"农业农村仍然是社会主义现代化建设的突出短板"},{"key":"D","text":"稳住农业基本盘、守好“三农”基础，始终是我们应对各种风险挑战的“压舱石”"}],"answerKey":"ABCD","explanation":"农业农村现代化关系中国式现代化全局和成色，关系强国建设根基，关系亿万农民福证。农业农村仍然是社会主义现代化建设的突出短板。农业农村现代化进程，直接关系中国式现代化目标的实现进程，关系社会主义现代化国家建设的整体水平。必须加快农业农村现代化，向乡村全面振兴聚焦发力，推动农业农村农民与国家同步基本实现现代化。全面建设社会主义现代化国家，基础在“三农”。稳住农业基本盘、守好“三农”基础，始终是我们应对各种风险挑战的\n“压舱石”。A、B、C、D全选。\n\n\n2026考研政治终极预测④套卷","issues":[]},{"id":"x4-2-27","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":27,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"27.1898年的“百日维新”如同县花一现，只经历了103天就天折了。除京师大学堂（北京大学的前\n身)被保留下来以外，其余新政措施大都被废除。戊戌维新运动失败的原因主要是","options":[{"key":"A","text":"维新派惧怕人民群众，把改革的全部希望寄托在一个没有实权的皇帝身上"},{"key":"B","text":"维新派触及了封建主义的经济基础一一封建土地所有制，导致守旧派强烈反扑"},{"key":"C","text":"维新派没有突破“中体西用”思想的局限，不敢触动君主专制制度"},{"key":"D","text":"维新派虽然大声疾呼救亡图存，却又幻想西方列强能帮助自已变法维新"}],"answerKey":"AD","explanation":"戊戌维新运动的失败，主要是由于维新派自身的局限和以慈禧太后为首的强大的守旧势\n力的反对。当时民族资本主义经济力量还十分微弱，民族资产阶级的社会基础相当狭窄。维新派的势力非常弱小，他们既没有严密的组织，也不掌握实权和军队，更没有去发动群众。这样，他们就只能把自已实行改革的全部希望寄托在一个没有实权的光绪皇帝身上。维新派本身的局限性突出地表现在三个方面：首先，不敢否定封建主义。他们在政治上不敢根本否定封建君主制度;在经济上,未触及封建主义的经济基础一一封建土地所有制；在思想上，他们虽然提倡学习西学，却仍要打着孔子的旗号，借古代圣贤之名“托古改制”。其次,对帝国主义抱有幻想。他们虽然大声疾呼救亡图存，却又幻想西方列强能帮助自已变法维新。最后，惧怕人民群众。A、D正确,B错误。维新派突破洋务派“中体西用”思想的局限，主张改革君主专制制度。他们鼓吹民权并提出开议院的主张，也就是要用君主立宪制取代君主专制制度。C错误。","issues":[]},{"id":"x4-2-28","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":28,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"28.大革命是在国共合作的条件下进行的,没有国共合作,不会在短时间内掀起这样一场革命。在这场革命中，中国共产党起着独特的、不可代替的作用。没有中国共产党，不会有这场大革命。中国共产党在大革命中的独特的、不可代替的作用表现在","options":[{"key":"A","text":"中国共产党是大革命的政治口号一一反对帝国主义、反对军阀一一的提出者"},{"key":"B","text":"中国共产党是人民群众的主要发动者和组织者"},{"key":"C","text":"中国共产党是国共合作的倡导者和统一战线的领导者"},{"key":"D","text":"中国共产党帮助和推动了国民革命军的建立"}],"answerKey":"ABD","explanation":"A、B、D正确。中国共产党是国共合作的倡导者和统一战线的组织者，但不是统一战线的\n领导者。中国共产党的中央领导机关在大革命的后期犯了以陈独秀为代表的右倾机会主义的错误，放弃了无产阶级对于农民群众、城市小资产阶级和民族资产阶级的领导权，尤其是武装力量的领导权,这是大革命失败的重要原因之一。C错误。","issues":[]},{"id":"x4-2-29","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":29,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"29.1945年8月25日，中共中央发表《对目前时局的宣言》,明确提出和平、民主、团结的口号。中共\n中央之所以提出这个口号，是因为","options":[{"key":"A","text":"希望通过和平途径对中国进行政治社会的改革"},{"key":"B","text":"中国人民在经历了长期战争后有和平建国的强烈要求"},{"key":"C","text":"需要时间来争取外援以进行经济建设"},{"key":"D","text":"人民力量的强大,加上其他条件，有可能造成和平发展的新阶段"}],"answerKey":"ABD","explanation":"抗日战争胜利后，中国广大人民热切希望实现和平、民主，为建设新中国而奋斗。中国共\n标迈进。因为，中国人民在经历了长期战争后，有和平建国的强烈要求，中国共产党应当充分考虑人民群众的这种愿望。同时，由于人民力量强大，加上其他条件，中国共产党估计，造成国共两党合作（加上民主同盟等）、和平发展新阶段的可能性是存在的。中国共产党应当努力争取中\n国出现这种局面。基于对和平的真诚愿望和对局势的清醒认识，中共中央认为，同国民党进行\n和平谈判是必要的；即使是暂时的和平局面，也应该积极争取。1945年8月25日，中共中央发表《对目前时局的宣言》,明确提出和平、民主、团结的口号。A、B、D正确,C错误。\n30.答案ABC\n要担当时代赋予的社会责任和历史使命。从根本上说，个人理想是由社会理想规定的。个人理\n想的确立要以社会理想为导向，个人理想的实现依赖于社会理想的指引。A、B、C正确。社会理想是个人理想的汇聚和升华，不是叠加，D错误。","issues":[]},{"id":"x4-2-30","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":30,"type":"multi","difficulty":2,"module":"思想道德与法治","stem":"30.2024年9月29日，习近平在国家勋章和国家荣誉称号颁授仪式上的讲话中强调，要胸怀强国之\n志，以国家富强为念，以人民幸福为盼，忠心爱国、矢志报国，把个人小我融人国家大我，在为国尽责、为民服务中实现个人价值、展现人生风采。在整个理想体系中，社会理想是最根本、最重要的，而个人理想则从属于社会理想。这是因为\n\n\n2026考研政治终极预测4套卷（二）","options":[{"key":"A","text":"个人理想的确立要以社会理想为导向"},{"key":"B","text":"个人理想的实现依赖于社会理想的指引"},{"key":"C","text":"从根本上说个人理想是由社会理想规定的"},{"key":"D","text":"社会理想是个人理想的登加"}],"answerKey":"ABC","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-2-31","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":31,"type":"multi","difficulty":2,"module":"思想道德与法治","stem":"31.平等是社会主义法律的基本属性，是社会主义法治的基本要求。坚持法律面前人人平等,有利于","options":[{"key":"A","text":"增强人民群众的主人翁意识和责任感"},{"key":"B","text":"预防特权思想和各种潜规则的侵蚀"},{"key":"C","text":"贯彻执行“以事实为根据，以法律为准绳”的司法原则"},{"key":"D","text":"维护法律权威、健全社会主义法治，确保实现全面依法治国的总目标"}],"answerKey":"ABCD","explanation":"平等是社会主义法律的基本属性，是社会主义法治的基本要求。坚持法律面前人人平等，\n对于坚持走中国特色社会主义法治道路具有十分重要的意义。（1)它可以充分显示中国特色社会主义制度的优越性，使人民在依法治国中的主体地位得到尊重和保障，从而有利于增强人民群众的主人翁意识和责任感。（2）它鲜明地反对法外特权、法外开恩，对掌握公权力的人形成制约，从而有利于预防特权思想和各种潜规则的侵蚀。（3)它鲜明地反对法律适）\n\n\n2026考研政治终极预测4套卷（二）答案及解析\n有利于贯彻执行“以事实为根据，以法律为准绳”的司法原则。（4)它要求人人都严格依法办事，既充分享有法律规定的各项权利，又切实履行法律规定的各项义务，有利于维护法律权威、健全\n社会主义法治，确保实现全面依法治国的总目标。A、B、C、D全选。","issues":[]},{"id":"x4-2-32","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":32,"type":"multi","difficulty":2,"module":"中国近现代史纲要","stem":"32.2025年10月24日，全国人大常委会通过决定，将10月25日设立为台湾光复纪念日。之所以设\n立这个纪念日，是为","options":[{"key":"A","text":"维护世界反法西斯战争胜利成果和战后国际秩序"},{"key":"B","text":"展现坚持一个中国原则和捍卫国家主权、统一、领土完整的坚定意志"},{"key":"C","text":"强化两岸同胞共同民族历史记忆，弘扬爱国主义精神"},{"key":"D","text":"激励两岸同胞在新时代新征程中为国家统一、民族复兴作出新的贡献"}],"answerKey":"ABCD","explanation":"为维护世界反法西斯战争胜利成果和战后国际秩序，展现坚持一个中国原则和捍卫国家主权、统一、领土完整的坚定意志，强化两岸同胞共同民族历史记忆，弘扬爱国主义精神，激励两岸同胞在新时代新征程中为国家统一、民族复兴作出新的贡献，根据《中华人民共和国宪法》，十\n四届全国人大常委会第十八次会议作出设立台湾光复纪念日的决定。A、B、C、D全选。","issues":[]},{"id":"x4-2-33","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":33,"type":"multi","difficulty":2,"module":"形势与政策","stem":"33.2025年3月12日，联合国秘书长古特雷斯在联合国总部提出“联合国80周年倡议”，宣布正式\n启动对包括140个实体的联合国全系统改革计划。改革的主要方面是","options":[{"key":"A","text":"效率和改进"},{"key":"B","text":"扩大安理会常任理事国"},{"key":"C","text":"任务执行情况审查"},{"key":"D","text":"结构和计划调整"}],"answerKey":"ACD","explanation":"2025年是联合国成立80周年，联合国秘书长古特雷斯提出“联合国80周年倡议”，正式\n启动对包括140个实体的联合国全系统进行“效率和改进”“任务执行情况审查”及“结构和计划调整”三方面的改革。计划中的改革包括设立共同行政平台、整合行政任务、大幅削减预算、机构合并和搬迁、职位裁撤、人员裁减等。A、C、D正确,B错误。","issues":[]},{"id":"x4-2-34","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":34,"type":"material","difficulty":2,"module":"马克思主义基本原理","stem":"运用矛盾分析方法，说明“学习借鉴并非简单复制”。","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","今年以来，浙江杭州因为诞生了深度求索、游戏科学、宇树科技等“六小龙”走红网络，由此引发其他城市“怎样才能培养出‘六小龙””等追问。这样的追问很有现实意义。新质生产力本质是先进生产力，不争先就难领先，以其他城市的成绩为标尺找差距、补短板，激发“不输于人”的闯劲、“比学赶超”的拼劲，有利于激活创新创造的一池春水，积蓄高质量发展的后劲。学习借鉴并非简单复制。各地资源赋不同、基础条件各异，也不必纠结为何没在热门领 域孵化竞争力强的企业。重要的是，学习借鉴优化政务服务、促进产业发展的先进经验，把握自身特色和优势，争取在更多细分领域锻造自己的长板。作为我国经济最活跃、开放程度最高、创新能力最强的区域之一，长三角发挥经济增长极和 动力源作用，一个主要抓手就是一体化里协同联动，以错位发展发挥各地区比较优势，以合理分工提高资源配置效率。一体化不是同质化，须立足自身资源票赋，找准定位。比如，近年来江苏苏州以生物医药产业为战略重点，打造涵盖创新药、高端医疗器械、生物技术的生物医药集群，目前已集聚近4200 家相关企业。又如，南京围绕传统优势钢铁产业做文章，打造高性能特种钢板生产基地，不断向 价值链高处攀登，当地钢铁业100多个产品达到国际先进水平。无论处在传统产业还是置身新兴产业，只要找准自己的舞台、做大自已的优势，就有希望发展成为明星企业、打造明星产品。摘编自《人民日报》（2025年 2026考研政治终极预测④套卷","一个周末中午，到一家网红餐厅吃饭。还没走进饭馆，就看到门口全是等候就餐的人。一看排在200号以外，心想这次铁定吃不上了。没想到店员告知，也可以点个隔壁餐厅的菜，在隔壁店入座后再点本店的菜，这样不用排队。果然隔壁店员也欢迎这种“吃法”。“在一家餐厅吃两家饭”，由彼此“争抢客源”到互相“分享客源”，变直接竞争关系为合作共赢关系，成就“三赢”局面，引人思考。市场欢迎竞争，但竞争不能被窄化为“你取代我、我取代你”。当人们聚焦“能一起得到什么”而非“你会抢走我什么”时，竞争的攻防模式也就切换到了探索模式。重庆大足区与四川安岳县地理相连、气候相近，过去一段时间，两地稻虾、中药材等产业陷入同质化无序竞争。两地携手成立大安粮药合作园后，变对手为队友，变“抱团打架”为“抱团使劲”，产业规模扩大了、产值提高了、品牌擦亮了。从斗而俱损到合而两利，证明搭好平台、建好机制，能够促进共赢之路越走越宽。当前一些地方、行业和企业，之所以出现“内卷”现象，原因之一是固于思维局限，没有跳出自家的“一亩三分地”。在狭窄的视野里，“发展的蛋糕就那么大”、市场的需求有限，别人多吃一块，自然会担心自己少吃一块甚至吃不上，由此走上自我封闭、拒绝合作的歧路，导致封上别人的门、堵住自己的路。 实际上，中国市场足够大，容得下亿万经营主体共生共赢、共同壮大；世界经济的海洋足够宽广，可任中外品牌千帆竞秀、百争流，关键在于思维和视野。摘编自《人民日报》（2025年8月15日）（1）运用矛盾分析方法，说明“学习借鉴并非简单复制”。"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-2-35","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":35,"type":"material","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"如何理解外部环境越是严峻复杂，越要加快构建新发展格局，坚持扩大内需这个战略基点？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","关于做强国内大循环、畅通国内国际双循环。外部环境越是严峻复杂，越要加快构建新发展格局，牢牢把握发展主动权。当前和今后一个时期，要坚持做强国内大循环，加快形成强大国内经济循环体系，以国内循环的稳定性对冲国际循环的不确定性。 2026考研政治终极预测4套卷（二） 《建议》稿突出做强国内大循环，对建设强大国内市场、加快构建高水平社会主义市场经济体制作出部署，强调坚持扩大内需这个战略基点，坚持惠民生和促消费、投资于物和投资于人紧 密结合，大力提振消费，扩大有效投资，坚决破除阻碍全国统一大市场建设卡点堵点，强调充分 激发各类经营主体活力，加快完善要素市场化配置体制机制，提升宏观经济治理效能。同时，提出拓展国际循环，稳步扩大制度型开放，维护多边贸易体制，高质量共建“一带一路”。摘自习近平《关于《中共中央关于制定国民经济和社会发展第十五个五年规划的建议)的说明》","纵深推进全国统一大市场建设,基本要求是“五统一、一开放”。“五统一”，就是统一市场 基础制度，特别是实现产权保护、公平竞争、质量标准等制度的统一；统一市场基础设施，打通物 流、资金流、信息流，健全现代商贸流通体系；统一政府行为尺度，地方在推动经济发展特别是招 商引资时，哪些能干哪些不能干有明确规矩，不能各行其是；统一市场监管执法，明确市场监管 行政处罚裁量基准，一把尺子量到底；统一要素资源市场，促进自由流动、高效配置，减少资源错 配和闲置浪费。“一开放”，就是持续扩大开放，实行对内对外开放联通，不搞封闭运行。落实这些基本要求，当前最急迫的是聚焦重点难点，下决心清除顽痒疾。摘自习近平《在二十届中央财经委员会第六次会议上的讲话》","我国经济发展获得巨大成功的一个关键因素，就是我们既发挥了市场经济的长处，又发挥 了社会主义制度的优越性。坚持有效市场和有为政府相结合，正是做好经济工作的一个重要 方法。 市场是最稀缺的资源，超大规模市场是我国的优势所在。如何将这一优势持续放大？把 “无形之手”和“有形之手”结合起来是重要途径。近年来，依靠市场提供多样化供给和服务，通过政府引导及“真金白银”支持，大规模设备更新和消费品以旧换新政策拉动内需、惠企利民，成为有效市场和有为政府协同发力的生动注脚。政府行为越规范，市场作用就越有效。从出台《全国统一大市场建设指引（试行）》，到选代 发布5版市场准入负面清单；从集中清理妨碍全国统一市场和公平竞争的规定和做法，到开展 新出台政策与宏观政策取向一致性评估纵深推进全国统一大市场建设，为我国发展增强了 韧性、注入了动力、释放了潜能。摘编自《人民日报》（2025年10月26日）（1）如何理解外部环境越是严峻复杂，越要加快构建新发展格局，坚持扩大内需这个战略基点？ （2）结合纵深推进全国统一大市场建设，分析“坚持有效市场和有为政府相结合，正是做好经济 工作的一个重要方法”。（或：加快构建高水平社会主义市场经济体制，为什么要用好“无 形之手”和“有形之手”？） 2026考研政治终极预测④套卷"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-2-36","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":36,"type":"material","difficulty":2,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"如何理解“我们今天取得的伟大成就，都是建立在毛泽东等老一辈革命家打下的江山、揽下\n的家底之上的”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","我们今天取得的伟大成就，都是建立在毛泽东等老一辈苹命家打下的江山、揽下的家底之上的。摘自.习近平2025年11月7日在广东考察时的讲话","争，土地革命战争，抗日战争和全国解放战争这四个阶段，其间经受了一九二七年和一九三四年两次严重失败的痛苦考验。经过长期武装斗争和各个方面、各种形式斗争的密切配合，终于在一九四九年取得了革命的胜利。 建国三十二年来，我们取得的主要成就是 四、建立和发展了社会主义经济，基本上完成了对生产资料私有制的社会主义改造，基本上实现了生产资料公有制和按劳分配。 五、在工业建设中取得重大成就，逐步建立了独立的比较完整的工业体系和国民经济体系。 我国第一个五年计划的经济建设，依靠我们自己的努力，加上苏联和其他友好国家的支援，同样取得了重大的成就。一批为国家工业化所必需而过去又非常薄弱的基础工业建立了起来。从一九五三年到一九五六年，全国工业总产值平均每年递增百分之十九点六，农业总产值平均 每年递增百分之四点八。经济发展比较快，经济效果比较好，重要经济部门之间的比例比较协 调。市场繁荣，物价稳定。人民生活显著改善。摘自《关于建国以来党的若干历史问题的决议》","坚持和加强党的全面领导是推进中国式现代化的根本保证。《建议》稿着眼提高党领导经 济社会发展能力和水平，强调坚持和加强党中央集中统一领导，完善党中央重大决策部署落实机制；持续用党的创新理论统一思想、统一意志、统一行动；坚持正确用人导向，完善千部考核评价机制；统筹推进各领域基层党组织建设；锲而不舍落实中央八项规定精神；完善党和国家监督体系；坚决打好反腐败斗争攻坚战、持久战、总体战。摘自习近平《关于(中共中央关于制定国民经济和社会发展第十五个五年规划的建议>的说明》（1）如何理解“我们今天取得的伟大成就，都是建立在毛泽东等老一辈革命家打下的江山、揽下 的家底之上的”？ （2）结合从“一五”计划到“十四五”规划的制定实施，说明中国共产党的领导是实现中国式现 代化的根本保证。 2026考研政治终极预测4套卷（二）"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-2-37","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":37,"type":"material","difficulty":2,"module":"思想道德与法治","stem":"为什么说“传承和弘扬伟大抗战精神，不仅是中国日新月异的重要密码，更是在新征程上创\n造新的历史伟业的力量源泉”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","历史承载过去，也启迪未来。新时代新征程，全国各族人民要在中国共产党坚强领导下，坚 时代中国特色社会主义思想，坚定不移走中国特色社会主义道路，传承和弘扬伟大抗战精神，踏 厉奋发、勇毅前行，为以中国式现代化全面推进强国建设、民族复兴伟业而团结奋斗！摘自习近平《在纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会上的讲话》","今天，神州大地欣欣向荣。当盛大阅兵仪式气势如虹，当雄壮的国歌旋律响起，当抗战老兵感慨“看到国家这么强大，当年的苦没白吃”……人们真切感受到，传承和弘扬伟大抗战精神，不仅是中国日新月异的重要密码，更是在新征程上创造新的历史伟业的力量源泉。摘编自《人民日报》（2025年9月5日）","要深入践行社会主义核心价值观，大力弘扬劳模精神、劳动精神、工匠精神。工人阶级和广 大劳动群众在长期奋斗中铸就的劳模精神、劳动精神、工匠精神，是社会主义核心价值观的生动 体现。要大力弘扬劳动最光荣、劳动最崇高、劳动最伟大、劳动最美丽的社会风尚，营造尊重劳 动、尊重知识、尊重人才、尊重创造的良好氛围，激励全体人民通过辛勤劳动、诚实劳动、创造性劳动实现对美好生活的向往。摘自习近平《在庆祝中华全国总工会成立100周年暨全国劳动模范 和先进工作者表彰大会上的讲话》 （1）为什么说“传承和弘扬伟大抗战精神，不仅是中国日新月异的重要密码，更是在新征程上创 造新的历史伟业的力量源泉”？ （2）为什么要“大力弘扬劳模精神、劳动精神、工匠精神”？ 2026考研政治终极预测④套卷"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-2-38","paper":"x4-2","book":"2026肖秀荣《4套卷》","setNo":2,"no":38,"type":"material","difficulty":2,"module":"形势与政策","stem":"如何理解“多边主义、团结合作是解决全球性难题的正确答案”，“我们要重温联合国创立\n初心”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","8月30日下午，国家主席习近平在天津迎宾馆会见来华出席2025年上海合作组织峰会的联合国秘书长古特雷斯。习近平指出，第二次世界大战结束前后，国际社会作出的最重要决定就是成立联合国。今年是世界反法西斯战争胜利和联合国成立80周年。历史启示我们，多边主义、团结合作是解决全球性难题的正确答案。我们要重温联合国创立初心，重申对联合国宪章宗旨和原则的承诺，推动联合国在新形势下重振权威和活力，成为各国协调行动、共同应对挑战的主要平台。中国永远是联合国可以信赖的伙伴。中方愿深化同联合国合作，支持联合国在国际事务中发挥核心作用，共同为维护世界和平、促进发展繁荣挺担当。习近平强调，在世界百年变局中，中国提供了稳定性和确定性。我们将继续以中国新发展 为世界提供新机遇，通过构建人类命运共同体、践行三大全球侣议、共建“一带一路”，同各国一道创造更加美好的未来。摘编自《人民日报》（2025年8月31日）","观察近期中国与世界交往的高光时刻，一种坚持始终清晰：面对变乱交织的国际局势，中国始终是维护和平与发展的“稳定锚”。成功举办上海合作组织成立以来规模最大的一届峰会，恰逢其时提出全球治理侣议；隆重举行中国人民抗日战争暨世界反法西斯战争胜利80周年纪念活动，携手各方铭记历史、共护和平；在金砖国家合作机制、联合国等多边平台不断推出引领合作共赢的新方案，在联合国气候变 化峰会宣布中国新一轮国家自主贡献；举办全球妇女峰会，提出支持全球妇女事业发展的新主张新举措····中国不仅自身坚定走和平发展道路，更持续为世界和平发展注入确定性和正能量。 习近平主席早在2014年就郑重指出：“中国走和平发展道路，不是权宜之计，更不是外交辞令，而是从历史、现实、未来的客观判断中得出的结论,是思想自信和实践自觉的有机统一。透视历史、现实与未来，不仅能读懂中国选择和平发展的深层逻辑，也能找到百年变局下国际社会应对共同挑战的正确方向。摘编自《人民日报》（2025年10月16日）（1）如何理解“多边主义、团结合作是解决全球性难题的正确答案”，“我们要重温联合国创立 初心”？"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x4-3-1","paper":"x4-3","book":"2026肖秀荣《4套卷》","setNo":3,"no":1,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"1.马克思、恩格斯以前的中外哲学都使用过实践的概念。一些思想家对实践也有过不少论述，但他们都没有真正理解人类实践的本质，没有看到实践在社会生活和认识活动中的决定意义。马克\n思在他的著作中系统论述了实践的观点，揭示了科学实践观的基本内容。这个被称为“包含新世\n界观天才萌芽的第一个文件”的著作是","options":[{"key":"A","text":"《德意志意识形态》"},{"key":"B","text":"《反杜林论》"},{"key":"C","text":"《关于费尔巴哈的提纲》"},{"key":"D","text":"《路德维希·费尔巴哈和德国古典哲学的终结》"}],"answerKey":"C","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x4-3-2","paper":"x4-3","book":"2026肖秀荣《4套卷》","setNo":3,"no":2,"type":"choice","difficulty":1,"module":"毛泽东思想和中国特色社会主义理论体系","stem":"2.习近平指出：“要顺应人民群众对美好生活的期待，坚持人民主体地位，把人口高质量发展同人民高品质生活紧密结合起来，把‘投资于物'同‘投资于人'紧密结合起来”。“十五五”规划建议也强调“推动人的全面发展”。马克思主义认为，在现实性上，人的本质是","options":[{"key":"A","text":"一切社会关系的总和"},{"key":"B","text":"单个人天生就具有的东西"},{"key":"C","text":"所有人共同属性的概括"},{"key":"D","text":"自然属性和社会属性的综合"}],"answerKey":"A","explanation":"马克思指出，“人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的\n总和”。这就告诉我们，人的本质属性是社会属性，而不是自然属性；人的本质属性表现在各种社\n会关系中；人的本质是变化发展的,而不是永恒不变的。A正确。","issues":[]},{"id":"x4-3-3","paper":"x4-3","book":"2026肖秀荣《4套卷》","setNo":3,"no":3,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"马克思主义政治经济学的理论十分丰富，其中“理解政治经济学的枢纽”的理论是 |","options":[],"answerKey":"C","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x4-3-4","paper":"x4-3","book":"2026肖秀荣《4套卷》","setNo":3,"no":4,"type":"choice","difficulty":1,"module":"马克思主义基本原理","stem":"4.第二次世界大战以后，资本主义国家经历了第三次科学技
