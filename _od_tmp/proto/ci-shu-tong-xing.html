带来的\n巨大生产率增长空间。与美国旨在提高制造业增加值占比的“再工业化”不同，我国数字化\n和绿色化发展的意涵是所有行业可以通过数字化转型和能源转型实现再次增长。第三，进\n一步全面深化改革将形成一个庞大的制度红利空间，带来资源配置效率提升的巨大可能，进\n一步拉动全要素生产率的增长。A、C、D正确。我国经济已由高速增长阶段转向高质量发展\n阶段，B错误。\n27. 答案A B D\n简析鸦片战争以后，中国还只是少数人有朦胧的民族觉醒意识。中日甲午战争以后，当中\n华民族面临生死存亡的关头时，中国人才开始有了普遍的民族意识的觉醒。甲午战争何以\n促成中国人民的民族意识开始普遍觉醒?主要原因在于：甲午战败和《马关条约》的签订给\n中国造成了深重的民族灾难；中国的惨败彻底打破了中国传统的夷夏观念，传统的“天朝\n上国”的优越感已经荡然无存。A、B、D正确。19 世纪70至80年代，列强从侵占中国周边\n邻国发展到蚕食中国边疆地区，使中国陷入“边疆危机”。1894年中日甲午战争爆发后，帝国\n主义列强对中国的争夺和瓜分的图谋达到高潮。C错误。\n28. 答案 A B C D\n简析百团大战是以破袭敌人交通线为主要目的的战斗，共分三个阶段。百团大战是全民族\n抗战以来八路军在华北发动的规模最大、持续时间最长的战略性进攻战役。百团大战，给日\n军的“囚笼政策”以沉重打击，钳制了日军大量兵力，打击了日军的侵略气焰；既锻炼了\n45\n\n\n2026考研政治冲刺③套卷答案及解析分册\n人民军队，提高了共产党和八路军的威望，又在抗日局面比较低沉时振奋了全国民心。A、\nB、C正确。百团大战是抗日战争中的重大战役，极大振奋了全国军民抗战到底的信心。2025\n年7月7日，习近平在参观百团大战纪念馆展陈时强调，百团大战的历史壮举，充分展现了\n我们党在全民族抗战中的中流砥柱作用，充分展现了党领导的人民战争的磅礴力量。要讲\n好抗战故事，把伟大抗战精神一代代传下去。D正确。","issues":[]},{"id":"x8-7-27","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":27,"type":"multi","difficulty":2,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","options":[],"answerKey":"","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-7-28","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":28,"type":"multi","difficulty":2,"module":"","stem":"28.1935年 1月,中央政治局在长征途中举行遵义会议,这在党的历史上是一个生死攸关的转折\n点。遵义会议","options":[{"key":"A","text":"标志着中国共产党在政治上开始走向成熟"},{"key":"B","text":"使实事求是的思想路线在全党范围确立起来"},{"key":"C","text":"确立党中央的正确领导,创造性地制定和实施符合中国革命特点的战略策略"},{"key":"D","text":"开启了党独立自主解决中国革命实际问题的新阶段"}],"answerKey":"BC","explanation":"1920年8月，中国共产党的最早组织在上海成立。中国共产党的早期组织为什么会首\n先在上海诞生?因为上海是马克思主义在中国最早的传播地和传播中心，又是中国工人阶\n级最密集的中心城市。在五四运动期间，上海的工人阶级最早以独立的政治力量登上历史\n舞台。A、C、D正确。李大钊在中国大地上率先举起了马克思主义旗帜，B错误。","issues":[]},{"id":"x8-7-29","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":29,"type":"multi","difficulty":2,"module":"","stem":"29.为了实现全面抗战路线和持久战战略总方针,毛泽东首次将游击战提高到战略地位。在极\n为艰苦的反“扫荡”反“清乡”斗争中,敌后军民创造了很多极为有效、灵活多样的歼敌方法，\n如伏击战、破袭战、地雷战、地道战、麻雀战等,使日军犹如困兽,陷入人民战争的汪洋大海。\n独立自主的游击战争","options":[{"key":"A","text":"实质上是抗日战争中时间最长、战斗战役持续不断的一场特殊战略大会战"},{"key":"B","text":"是人民军队发挥政治优势和军事优势最好的作战形式"},{"key":"C","text":"是坚持持久抗战、最终彻底战胜日本侵略者的唯一正确的政治军事方针"},{"key":"D","text":"始终是国民党正面战场正规战的重要辅助力量"}],"answerKey":"ABCD","explanation":"1949年3月召开的中共七届二中全会，规定了党在全国胜利后在政治、经济、外交方面\n应当采取的基本政策，指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主\n义社会的发展方向。在这次会议上，毛泽东告诫全党，夺取全国胜利，这只是万里长征走完\n了第一步，中国的革命是伟大的，但革命以后的路更长，工作更伟大，更艰苦。据此，他提出了\n“两个务必”的思想。毛泽东还指出，在胜利面前，必须警惕资产阶级“糖衣炮弹”的攻击。C、\nD正确。\n中共七届二中全会讨论了党的工作中心由乡村转移到城市的问题，指出“从现在起，开\n始了由城市到乡村并由城市领导乡村的时期”。1949年3月25日，毛泽东等中央领导人与\n中央机关、人民解放军总部进驻北平(北京)香山，标志着中国革命重心从农村转向城市。\nA 错误。中共七届三中全会上毛泽东作了《不要四面出击》的讲话。B错误。\n75\n\n\n2026考研政治冲刺◎套卷答案及解析分册\n3 0 . 答案 A B C D\n简析 中国革命道德的当代价值包括：有利于加强和巩固社会主义和共产主义的理想信念；\n有利于培育和践行社会主义核心价值观；有利于引导人们树立正确的道德观；有利于培育良\n好的社会道德风尚。A、B、C、D全选。\n31. 答案B C\n简析坚持法律面前人人平等，对于坚持走中国特色社会主义法治道路具有十分重要的意\n义。平等是社会主义法律的基本属性，是社会主义法治的基本要求。B、C正确。党的领导\n是社会主义法治最根本的保证，人民是依法治国的主体和力量源泉。A错误。推进全面依法\n治国，根本目的是依法保障人民权益。D错误。\n3 2 . 答案A C D\n简析外交部发言人在回答记者提问时指出，雅下水电工程建设是中国主权范围内的事，旨\n在加快发展清洁能源，大力改善当地民生，积极应对气候变化。中方在跨境河流开发上始\n终秉持高度负责任的态度，也有丰富的水电工程开发经验。A、C、D正确。雅下水电工程的\n核心功能是发电(利用水能)，而非主要进行跨区域的水资源调配(如南水北调工程)。虽然\n水电站在调度运行时会对局部水流有影响，但其主要目的不是改变全国或区域的水资源配\n置格局。B错误。\n3 3 . 答案A B C\n简析中美经贸关系是经济规律作用的结果，具有强大内生动力。中美经贸合作为双方带来\n的经济利益巨大，美国的受益程度丝毫不低于中国。美方盯着货物贸易逆差大做文章，扭曲\n了中美经贸关系的真实图景。中美货物贸易差额既是美国经济结构性问题的必然结果，也\n是由两国比较优势和国际分工格局决定的，还与统计方法有关。美国单边主义、保护主义不\n断抬头，一再对华推出单边关税措施，严重干扰两国正常合作。A、B、C正确，D错误。","issues":[]},{"id":"x8-7-30","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":30,"type":"multi","difficulty":2,"module":"","stem":"30.为深入学习贯彻习近平文化思想,培育和践行社会主义核心价值观,弘扬诚信文化、推进诚\n信建设,推动形成守信践诺的良好社会风尚,中央宣传部、国家发展改革委联合发布了2024\n年“诚信之星”。发布现场播放了“诚信之星”先进事迹视频短片，“诚信之星”讲述了自己的\n诚信追求和人生感悟。诚信是社会主义核心价值观的重要内容,是","options":[{"key":"A","text":"个人立身处世的基本价值规范"},{"key":"B","text":"社会存续发展的重要价值基石"},{"key":"C","text":"中华传统美德的根本要求"},{"key":"D","text":"社会主义职业道德的基本规范之一"}],"answerKey":"ABC","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x8-7-31","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":31,"type":"multi","difficulty":2,"module":"","stem":"31.我国宪法规定,国家工作人员就职时应当依照法律规定公开进行宪法宣誓。习近平指出,宪\n法宣制度有利于彰显宪法权威,增强公职人员宪法观念,激励公职人员忠于和维护宪法，\n也有利于在全社会增强宪法意识、树立宪法权威。把宪法放到如此重要的地位，是因为宪法","options":[{"key":"A","text":"是国家的根本法,是党和人民意志的集中体现"},{"key":"B","text":"是国家各项制度和法律法规的总依据"},{"key":"C","text":"规定了国家的根本制度"},{"key":"D","text":"具有最高的法律地位、法律权威、法律效力"}],"answerKey":"ABCD","explanation":"坚持依法治国和以德治国相结合，既要强化道德对法治的支撑作用，重视发挥道德的\n教化作用，提高全社会文明程度，为全面依法治国创造良好环境；又要把道德要求贯彻到法\n治建设中，以法治承载道德理念。立法、执法、司法都要体现社会主义道德要求，都要把社\n会主义核心价值观贯穿其中，使社会主义法治成为良法善治，引导全社会崇德向善。要运用\n法治手段解决道德领域突出问题，依法加强对群众反映强烈的失德行为的整治。A、B、C正\n确。思想道德和法律都是调节人们思想行为、协调人际关系、维护社会秩序的重要手段。思\n想道德和法律虽然在调节领域、调节方式、调节目标等方面存在很大不同，但是二者都是上\n层建筑的重要组成部分，共同服务于一定的经济基础。D错误。\n32. 答案A B C D\n简析近年来，全国人大代表、全国政协委员和台湾同胞多次提出建议，要求设立台湾光复纪\n念日，并举行纪念活动。设立台湾光复纪念日，在国家层面举行纪念活动，有利于体现台湾\n是中国不可分割一部分这一无可辩驳的历史事实，巩固国际社会坚持一个中国的格局，引\n领两岸同胞传承、弘扬伟大抗战精神，激励全体中华儿女为祖国统一、民族复兴而团结奋\n斗。A、B、C、D全选。\n33. 答案A B C D\n简析“上海精神”是上合组织的“根”和“魂”。“上海精神”广受欢迎，被视为处理国与国关\n系的理念典范。“上海精神”的内核同《联合国宪章》宗旨和原则高度契合，同和平共处五项\n原则一脉相承，同成员国睦邻友好的诉求完全呼应。“上海精神”彻底摒弃冷战思维、零和博\n弈、文明冲突的历史沉渣，成为各成员国同舟共济、世代友好的凝聚力量。A、B、C、D全选。","issues":[]},{"id":"x8-7-32","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":32,"type":"multi","difficulty":2,"module":"","stem":"32.2025年4月28日，习近平在庆祝中华全国总工会成立100周年暨全国劳动模范和先进工作\n者表彰大会上发表重要讲话强调,中华全国总工会成立以来的 100 年,是马克思主义工运理\n论同中国工人运动具体实际相结合的100 年,是我国工人阶级和工会组织矢志不渝跟党走、\n为实现中华民族伟大复兴团结奋斗的100 年。实践充分证明,我国工人阶级不愧是","options":[{"key":"A","text":"中国共产党最坚实最可靠的阶级基础"},{"key":"B","text":"我们社会主义国家的领导阶级"},{"key":"C","text":"先进生产力和生产关系的代表"},{"key":"D","text":"坚持和发展中国特色社会主义的主力军\n\n\n2026，考研政治冲刺8套卷（七）"}],"answerKey":"ABC","explanation":"《关于<中华人民共和国全国人民代表大会和地方各级人民代表大会代表法(修正草\n案)〉的说明》指出：(一)修改代表法是坚持党的全面领导、坚定不移走中国特色社会主义政\n治发展道路的必然要求；(二)修改代表法是推动人大工作高质量发展，坚持好、完善好、运行\n好人民代表大会制度的重要保障；(三)修改代表法是发展全过程人民民主，使各级人大及其\n常委会成为始终同人民群众保持密切联系的代表机关的客观要求。B、C、D正确。新时代爱\n国统一战线的历史责任是促进中华儿女大团结，A不符合题意。\n56\n\n\n简析国际调解院将与现有国际诉讼或仲裁机构相互补充，为各方和平解决国际争端提供新\n平台。中华法系推崇天下无讼、以和为贵，这同现代国际法提倡的和平解决国际争端是高度\n契合的。国际调解院不搞强制裁决而是提供中立平台，坚持自愿参与、平等决策、共同受\n益，尊重各方合理关切，追求实现互利共赢，生动诠释了和合共生的文明智慧。A、B、C正\n确。国际调解院面向所有国家(非仅发展中国家)，也不是“替代”国际法院，而是与现有国际\n诉讼或仲裁机构相互补充。D错误。","issues":[]},{"id":"x8-7-33","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":33,"type":"multi","difficulty":2,"module":"","stem":"33.2025年10月30日,国家主席习近平在韩国釜山同美国总统特朗普举行会晤。两国元首就事\n关中美关系的战略性、长远性问题以及共同关心的重大问题深入沟通,双方都同意保持经常\n性交往,加强在经贸、能源等领域合作,促进人文交流。此次会唔","options":[{"key":"A","text":"消除了中美之间的分歧和摩擦"},{"key":"B","text":"向世界释放了积极信号"},{"key":"C","text":"为中美关系稳定发展作出新指引、注入新动力"},{"key":"D","text":"为动荡变革的世界增添了宝贵的确定性"}],"answerKey":"ABCD","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x8-7-34","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":34,"type":"material","difficulty":2,"module":"","stem":"分析“发展新质生产力不能盲目跟风一个产业、简单套用一种模式”所蕴含的唯物辩证法原理。","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","要深刻把握培育新动能和更新旧动能的辩证关系。需要推动新旧发展动能平稳接续转 换。从国际经验看,传统产业的空心化往往制约科技和产业创新能力,削弱经济竞争力。我 国各地资源票赋和产业发展水平差异较大,发展新质生产力不能盲目跟风一个产业、简单套 用一种模式,切不可“一哄而上”。必须充分考虑本地区的实际情况,发挥自身优势,找到最 佳路径,形成具有本地特色的新质生产力培育模式。特别是要抓住“质态”更新，突出“新 质”这个关键，因地制宜发展新质生产力。 摘编自《人民日报》（2025年1月23日）","去年7月以来,我在四川、黑龙江、浙江、广西等地考察调研时,提出要整合科技创新资 源,引领发展战略性新兴产业和未来产业,加快形成新质生产力。12月中旬，,在中央经济工 作会议上,我又提出要以科技创新推动产业创新,特别是以颠覆性技术和前沿技术催生新产 业、新模式、新动能,发展新质生产力。我提出新质生产力这个概念和发展新质生产力这个 重大任务,主要考虑是:生产力是人类社会发展的根本动力,也是一切社会变迁和政治变革 的终极原因。高质量发展需要新的生产力理论来指导,而新质生产力已经在实践中形成并 展示出对高质量发展的强劲推动力、支撑力,需要我们从理论上进行总结、概括,用以指导新 的发展实践。摘自习近平《发展新质生产力是推动高质量发展的内在要求和重要着力点》(《求是》2024年第11期）（1）分析“发展新质生产力不能盲目跟风一个产业、简单套用一种模式”所蕴含的唯物辩证法原理。（2）从理论创新和实践创新的辩证关系角度分析,为什么要将已经在实践中形成的新质生产力“从理论上进行总结、概括,用以指导新的发展实践”。 2026考研政治冲刺8套卷试题分册"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-7-35","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":35,"type":"material","difficulty":2,"module":"","stem":"习近平在听取讲解和讨论后发表重要讲话。他指出,党的十八大以来,党中央不断完善 国家安全领导体制和法治体系、战略体系、政策体系，完善社会治理体系，强化社会治安整体 防控,着力提高公共安全治理水平,坚决维护国家主权、安全、发展利益，成功续写了经济快 速发展和社会长期稳定“两大奇迹”新篇章。适应形势任务的发展变化,平安中国建设只能 加强,不能削弱。 彻。各级党委和政府要坚持系统思维,进一步树立发展是硬道理、安全也是硬道理的理念, 上下齐发力,通过抓好一地一域一业的安全为国家整体安全创造条件,通过及时有效解决一 个个安全问题为国家长治久安筑牢根基。 习近平指出,平安中国建设为了人民,也依靠人民。要不断增进民生福祉,扎实推进共 同富裕,切实维护人民群众合法权益,维护社会公平正义。要完善社会治理体系、健全社会 工作体制机制,建设人人有责、人人尽责、人人享有的社会治理共同体。要培育自尊自信、理 性平和、积极向上的社会心态,弘扬锐意进取、甘于奉献、崇尚法治、文明礼让的时代新风。 习近平强调,防范化解各类风险是平安中国建设的一项重要任务。要把捍卫国家政治 安全摆在首位,坚定维护国家政权安全、制度安全、意识形态安全。要完善公共安全体系,推 动公共安全治理模式向事前预防转型,加强防灾减灾救灾、安全生产、食品药品安全、网络安 全、人工智能安全等方面工作。要着力防范重点领域风险。 习近平指出,建设更高水平平安中国,必须强化社会治安整体防控。要把专项治理和系 统治理、依法治理、综合治理、源头治理结合起来,发展壮大群防群治力量,筑起真正的铜墙 铁壁。要坚持和发展新时代“枫桥经验”,推进信访工作法治化,及时有效化解各种矛盾 纠纷。摘编自《人民日报》（2025年3月2日）（1）如何理解“适应形势任务的发展变化,平安中国建设只能加强,不能削弱”？ （2）为什么要“进一步树立发展是硬道理、安全也是硬道理的理念”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题： 习近平在听取讲解和讨论后发表重要讲话。他指出,党的十八大以来,党中央不断完善 国家安全领导体制和法治体系、战略体系、政策体系，完善社会治理体系，强化社会治安整体 防控,着力提高公共安全治理水平,坚决维护国家主权、安全、发展利益，成功续写了经济快 速发展和社会长期稳定“两大奇迹”新篇章。适应形势任务的发展变化,平安中国建设只能 加强,不能削弱。 彻。各级党委和政府要坚持系统思维,进一步树立发展是硬道理、安全也是硬道理的理念, 上下齐发力,通过抓好一地一域一业的安全为国家整体安全创造条件,通过及时有效解决一 个个安全问题为国家长治久安筑牢根基。 习近平指出,平安中国建设为了人民,也依靠人民。要不断增进民生福祉,扎实推进共 同富裕,切实维护人民群众合法权益,维护社会公平正义。要完善社会治理体系、健全社会 工作体制机制,建设人人有责、人人尽责、人人享有的社会治理共同体。要培育自尊自信、理 性平和、积极向上的社会心态,弘扬锐意进取、甘于奉献、崇尚法治、文明礼让的时代新风。 习近平强调,防范化解各类风险是平安中国建设的一项重要任务。要把捍卫国家政治 安全摆在首位,坚定维护国家政权安全、制度安全、意识形态安全。要完善公共安全体系,推 动公共安全治理模式向事前预防转型,加强防灾减灾救灾、安全生产、食品药品安全、网络安 全、人工智能安全等方面工作。要着力防范重点领域风险。 习近平指出,建设更高水平平安中国,必须强化社会治安整体防控。要把专项治理和系 统治理、依法治理、综合治理、源头治理结合起来,发展壮大群防群治力量,筑起真正的铜墙 铁壁。要坚持和发展新时代“枫桥经验”,推进信访工作法治化,及时有效化解各种矛盾 纠纷。摘编自《人民日报》（2025年3月2日）（1）如何理解“适应形势任务的发展变化,平安中国建设只能加强,不能削弱”？ （2）为什么要“进一步树立发展是硬道理、安全也是硬道理的理念”？"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-7-36","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":36,"type":"material","difficulty":2,"module":"","stem":"为什么说“一五”计划“在我国工业化起步阶段发挥了重要作用”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","为准备进行有计划的经济建设,我国从1951 年就着手编制第一个五年计划（以下简称“一五”计划）,并从1953年起一面开始实施,一面继续讨论修改,直至 1954年9月形成草案,1955年7月一届全国人大二次会议正式审议并通过。作为中共中央编制的第一个中期发展计划,虽然其制定过程极其艰难,但在反复论证中体现了实事求是的原则,较好解决了 2026考研政治冲刺8套卷（七） 我国经济建设中的一些难题,从而在我国工业化起步阶段发挥了重要作用。 关于采取编制五年计划这种做法的目的,中共中央在《关于编制一九五三年计划及五年 建设计划纲要的指示》中指出：“为了加速国家建设,除应动员全国力量，集中全国人力和财 力以赴外，必须加强国家建设的计划工作,使大规模建设能在正确的计划指导下进行,避免 可能发生的盲目性。” “一五”计划主要是对国家重大建设项目、生产力分布和国民经济重要比例关系等作出 规划,为国民经济发展远景确定目标和方向。到1957年底，“一五”计划全面提前超额完成。 摘编自《学习时报》（2025年10月17日）","从“一五”到十四五”，一以贯之的主题是把我国建设成为社会主义现代化国家,尽管 遭遇过各种意想不到的困难和挫折,我们的意志和决心始终没有动摇。 摘编自《人民日报》（2025年10月20日）","中共中央总书记、国家主席、中央军委主席习近平近日对“十五五”规划编制工作作出 特色社会主义一个重要政治优势。编制和实施“十五五”规划,对于全面落实党的二十大战 略部署、推进中国式现代化意义重大。要坚持科学决策、民主决策、依法决策,把顶层设计和 问计于民统一起来,加强调研论证,广泛凝聚共识,以多种方式听取人民群众和社会各界的 意见建议,充分吸收干部群众在实践中创造的新鲜经验,注重目标任务和政策举措的系统性 整体性协同性,高质量完成规划编制工作。 摘编自《人民日报》（2025年5月20日）（1）为什么说“一五”计划“在我国工业化起步阶段发挥了重要作用”？（2）如何理解科学制定和接续实施五年规划,是我们党治国理政一条重要经验,也是中国特色社会主义一个重要政治优势”？ 2026考研政治冲刺8套卷试题分册 37。","回答问题： 专项行动。 专项行动聚焦社交、短视频、直播等平台，全面排查话题、榜单、推荐、弹幕、评论等重点 环节，着力整治以下问题：挑动群体极端对立情绪,借社会热点事件强行关联身份、地域、性 别等信息标签化、污名化炒作,挑动群体间矛盾；宣扬恐慌焦虑情绪，恶意虚构散布灾情、险 情、警情等可能影响公共安全的突发事件，伪造发布政府部门公告：挑起网络暴力庆气，策 划、演绎打架斗殴、恶意刁难等剧本，宣扬“以暴制暴”等;过度泣染消极悲观情绪,通过炮制 所谓热披词、热门梗、表情包、语录段子等,过度自我矮化或者涫染颓丧消极负面情绪，引起 跟风效仿。 摘编自《人民日报》（2025年9月23日）（1）为什么我们要持续开展“清朗”系列专项行动,营造清朗的网络空间？（2）如何让网络生态日渐清朗,共建网上美好精神家园?"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-7-37","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":37,"type":"material","difficulty":2,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":[]},"issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-7-38","paper":"x8-7","book":"2026肖秀荣《8套卷》","setNo":7,"no":38,"type":"material","difficulty":2,"module":"","stem":"如何认识关税战、贸易战？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","当前,百年变局加速演进,世界进入新的动荡变革期。唯有不移公平正义之心、不坠互 利共赢之志,才能维护世界和平、实现共同发展。关税战、贸易战没有赢家,单边主义、保护 主义、霸权主义注定伤人害已。 摘自习近平《弘扬“中国一中亚精神”推动地区合作高质量发展 在第二届中国一中亚峰会上的主旨发言》","多边主义是解决世界面临困难挑战的必然选择,经济全球化是不可阻挡的历史潮流。 中国坚持真正的多边主义,推动普惠包容的经济全球化,积极参与全球经济治理,致力于建 设开放型世界经济。外资企业特别是跨国公司在维护世界经济秩序中发挥着重要作用,也 承担着重要贵任。我们要携手同行,推动经济全球化朝着正确方向发展。 摘自习近平《会见国际工商界代表时的讲话》（2025年3月28目） （1）如何认识关税战、贸易战？"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-8-1","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":1,"type":"choice","difficulty":1,"module":"","stem":"1.信息传递是人类生存发展的基础。从最初的肢体语言到驿站传书,再到承载海量数据的互联网,信息一直是人类社会不可或缺的存在。作为地球上重要的“居民”，自然界里的植物是否也存在信息交换呢？答案是肯定的。比如番茄会在受到伤害时群发“茉莉味”的信号,让周边的番茄秒变“苦瓜脸”。这套由挥发性气味小分子编织的“空气互联网”,如同自然界的“聊天\n记录”传递信息，让不会移动的植物们实现了跨时空的生存协作。随着化学生态学的发展，人\n类正逐步解码植物王国的“社交密码”,或许有一天，人类能够精准识别植物间的语言,听懂它\n们的“悄悄话”、了解它们成长丰产的需求,进而为它们遮风挡雨。人类对植物间信息交换的\n解码说明","options":[{"key":"A","text":"信息是世界普遍联系的基础"},{"key":"B","text":"自然规律与社会规律都是通过人的活动实现的"},{"key":"C","text":"客观世界中的一切都打着人的意识的印记"},{"key":"D","text":"人类对于自然界的认识是一个不断深化的过程"}],"answerKey":"A","explanation":"世界的物质统一性是世界普遍联系的基础。A错误。人类社会与自然界的不同主要在\n于，在自然界中一切都是自发产生的，而在人类社会中一切都打着人的意识的印记，是人有目\n的的实践活动的结果。B、C错误。从真理的发展上看，人类的认识是一个不断深化的过程，永\n远处在由真理的相对性走向绝对性、接近绝对性的转化和发展过程中。D正确。","issues":[]},{"id":"x8-8-2","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":2,"type":"choice","difficulty":1,"module":"","stem":"2.“改造主观世界的‘营养’,改造客观世界的‘钥匙’”,深入贯彻中央八项规定精神,许多党员\n干部这样体会习近平新时代中国特色社会主义思想的力量。党的创新理论学习不仅是提高思\n想认识、坚定理想信念的重要手段,也是增强理论素养、提高工作能力的根本途径。锻造作风、\n提升本领,关键就是从党的创新理论中汲取党性滋养,深化、内化、转化为改造主观世界的“营\n养”改造客观世界的“钥匙”。马克思主义认为,改造世界包括改造客观世界和改造主观世\n界。改造主观世界的核心是","options":[{"key":"A","text":"改造世界观"},{"key":"B","text":"提升人的意志品质"},{"key":"C","text":"提高人的实践能力"},{"key":"D","text":"认识人类自身"}],"answerKey":"D","explanation":"改造主观世界既包括提高人的认识能力，也包括丰富人的情感世界和提升人的意志品\n质，而核心是改造世界观，即观察和处理问题的立场观点方法。A正确。","issues":[]},{"id":"x8-8-3","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":3,"type":"choice","difficulty":1,"module":"","stem":"3.马克思主义政治经济学是经济学上的一场深刻革命,它站在无产阶级立场,运用辩证唯物主义\n和历史唯物主义的科学方法,批判继承了英国古典政治经济学的合理成分,揭露了无产阶级与\n资产阶级之间阶级对立和斗争的经济根源,论证了资本主义必然灭亡和社会主义必然胜利的\n客观规律。马克思经济学说的核心内容和基石是","options":[{"key":"A","text":"劳动二重性理论"},{"key":"B","text":"商品二因素理论"},{"key":"C","text":"剩余价值理论"},{"key":"D","text":"资本有机构成理论"}],"answerKey":"D","explanation":"剩余价值理论是马克思经济学说的核心内容和基石，是无产阶级反对资产阶级、揭示资\n本主义制度剥削本质的锐利武器。C正确。","issues":[]},{"id":"x8-8-4","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":4,"type":"choice","difficulty":1,"module":"","stem":"4.2025 年10月,美国联邦政府时隔近7年再度“停摆”。随着联邦政府“停摆”持续,其对美国社\n会的影响已从政府系统蔓延至民众日常生活,多项公共服务陷入停滞,弱势群体首当其冲。在发达资本主义的美国出现的种种社会问题,从一个侧面反映了资本主义固有的、内在的基本矛盾,即\n\n\n2026考研政治冲刺8套卷（试题分册","options":[{"key":"A","text":"生产社会化和生产资料资本主义私人占有之间的矛盾"},{"key":"B","text":"无产阶级与资产阶级之间的矛盾"},{"key":"C","text":"个别企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾"},{"key":"D","text":"生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾"}],"answerKey":"B","explanation":"在私有制商品经济条件下，私人劳动和社会劳动之间的矛盾是商品经济的基本矛盾。\n在资本主义制度下，这种矛盾进一步发展成资本主义的基本矛盾，即生产社会化和生产资料资\n本主义私人占有之间的矛盾，正是这一矛盾的不断运动，才使资本主义制度最终被社会主义制\n度所代替具有了客观必然性。A正确。B、C、D是资本主义基本矛盾在经济和阶级关系上的\n具体体现。\n70\n\n\n5 . 答案B\n南新毛泽东指出：“在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上\n层建筑和经济基础之间的矛盾。”社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本\n不同的性质和情况”。社会主义社会的基本矛盾是在生产关系和生产力基本适应、上层建筑\n和经济基础基本适应条件下的矛盾，是在人民根本利益一致基础上的矛盾，是非对抗性的矛\n盾。社会主义社会基本矛盾运动具有“又相适应又相矛盾”的特点，一方面社会主义生产关\n系已经建立起来，它是和生产力的发展相适应的；另一方面它又还很不完善，这些不完善的方\n面和生产力的发展又是相矛盾的。除了生产关系和生产力发展之间这种又相适应又相矛盾的\n情况以外，还有上层建筑和经济基础之间又相适应又相矛盾的情况。其中，相适应的一面是基\n本方面，相矛盾的一面是非基本方面。B正确，A、C、D不符合题意。","issues":[]},{"id":"x8-8-5","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":5,"type":"choice","difficulty":1,"module":"","stem":"5.1957年2 月,毛泽东作了《关于正确处理人民内部矛盾的问题》的报告,指出：“在社会主义社\n会中,基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。”\n社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。这里所说\n的“不同的”“情况”是指","options":[{"key":"A","text":"社会主义社会的矛盾反映在政治上可以划分为敌我矛盾和人民内部矛盾"},{"key":"B","text":"社会主义社会基本矛盾运动是“又相适应又相矛盾”"},{"key":"C","text":"社会主义社会基本矛盾运动相适应的一面是非基本方面"},{"key":"D","text":"社会主义社会基本矛盾运动相矛盾的一面是基本方面"}],"answerKey":"A","explanation":"我国对资本主义工商业的社会主义改造，第二步实行个别企业的公私合营，企业的生产\n资料由国家和资本家共同所有，国家派干部(公方代表)进入企业内部，根据国家建设需要，同\n工人、资本家(私方代表)共同管理和改造企业，公方代表居领导地位。企业利润的分配仍为\n“四马分肥”，资本家的剥削进一步受到限制。企业的经营管理以发展生产、满足人民需要和\n完成国家计划为目标，因而已经属于半社会主义性质的企业。C正确。A、B、D不符合题意。\n点拨从企业性质的角度来说，三步分别对应：“具有了社会主义的因素”“属于半社会主义\n性质”“基本上成为社会主义国营性质”。","issues":[]},{"id":"x8-8-6","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":6,"type":"choice","difficulty":1,"module":"","stem":"6.在邓小平指导下,党的十一届三中全会重新确立解放思想、实事求是的思想路线,停止使用\n“以阶级斗争为纲”的错误提法,作出把党和国家工作中心转移到经济建设上来、实行改革开\n放的历史性决策,开启了改革开放和社会主义现代化建设新时期,实现了党的历史上具有深远\n意义的伟大转折。党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正是","options":[{"key":"A","text":"坚持四项基本原则"},{"key":"B","text":"坚持改革开放"},{"key":"C","text":"坚持以经济建设为中心"},{"key":"D","text":"坚持中国特色社会主义"}],"answerKey":"C","explanation":"“以经济建设为中心，坚持四项基本原则，坚持改革开放”，即“一个中心、两个基本点”\n是党在社会主义初级阶段基本路线的简明概括。以经济建设为中心是党在改革开放和社会主\n义现代化建设新时期实现的最根本的拨乱反正。能否坚持以经济建设为中心，是关系到我国\n社会主义现代化的成败、关系到社会主义的前途和命运的大问题。邓小平指出：“离开了经济\n建设这个中心，就有丧失物质基础的危险。其他一切任务都要服从这个中心，围绕这个中心，\n决不能干扰它，冲击它。”四项基本原则是立国之本，是我们党和国家生存发展的政治基石；改\n革开放是强国之路，是我们党和国家发展进步的活力源泉。C正确，A、B、D错误。","issues":[]},{"id":"x8-8-7","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":7,"type":"choice","difficulty":1,"module":"","stem":"7.习近平指出：“中国式现代化,是中国共产党领导的社会主义现代化,既有各国现代化的共同\n特征,更有基于自已国情的中国特色。”党的二十大集中概括了中国式现代化五个方面的中国\n特色,深刻揭示了中国式现代化的科学内涵,这是理论概括,也是实践要求。关于中国式现代\n化，以下说法正确的是\n①人口规模巨大的现代化是中国式现代化的显著特征\n全体人民共同富裕的现代化是中国式现代化的本质特征\n既要物质富足、也要精神富有,是中国式现代化的崇高追求\n④促进人与自然和谐共生,是中国式现代化区别于西方现代化的显著标志","options":[{"key":"A","text":"023"},{"key":"B","text":"02④"},{"key":"C","text":"34"},{"key":"D","text":"234"}],"answerKey":"D","explanation":"中国式现代化的中国特色(5个方面)：第一，中国式现代化是人口规模巨大的现代化。\n这是中国式现代化的显著特征。第二，中国式现代化是全体人民共同富裕的现代化。这是中\n国式现代化的本质特征，也是区别于西方现代化的显著标志。第三，中国式现代化是物质文明\n和精神文明相协调的现代化。物质富足、精神富有是社会主义现代化的根本要求。习近平指\n出：“既要物质富足、也要精神富有，是中国式现代化的崇高追求。”第四，中国式现代化是人与\n自然和谐共生的现代化。尊重自然、顺应自然、保护自然，促进人与自然和谐共生，是中国式现\n代化的鲜明特点。第五，中国式现代化是走和平发展道路的现代化。坚持和平发展，在坚定维\n护世界和平与发展中谋求自身发展，又以自身发展更好维护世界和平与发展，推动构建人类命\n运共同体，是中国式现代化的突出特征。①②③正确，④错误。因此，本题选A。","issues":[]},{"id":"x8-8-8","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":8,"type":"choice","difficulty":1,"module":"","stem":"8.2025年9月3日,纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会在首都北京隆\n重举行。人民军队光荣接受党和人民检阅。阅兵场上，一系列先进装备震撼亮相;新型坦克、\n步兵战车等新一代传统陆战兵器,无人、水下、网电等领域新型作战装备,高超声速导弹、战略\n导弹等国之重器“以武止戈、砥定乾坤”,彰显的是新时代中国发展进步的硬核实力,展现\n的是人民军队捍卫和平的强大能力。“能战方能止战,准备打才可能不必打,越不能打越可能\n挨打”。这说明,强军兴军,核心是","options":[{"key":"A","text":"听党指挥"},{"key":"B","text":"能打胜仗"},{"key":"C","text":"作风优良"},{"key":"D","text":"艰苦奋斗"}],"answerKey":"A","explanation":"听党指挥是灵魂，决定军队建设的政治方向。能打胜仗是核心，反映军队的根本职能和\n军队建设的根本指向。作风优良是保证，关系军队的性质、宗旨、本色。B正确。","issues":[]},{"id":"x8-8-9","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":9,"type":"choice","difficulty":1,"module":"","stem":"9.面对纷繁复杂的国际国内形势,面对新一轮科技革命和产业变革,面对人民群众新期待,必须\n继续把改革推向前进。进一步全面深化改革的出发点和落脚点是\n\n\n2026考研政治冲刺8套卷（八）","options":[{"key":"A","text":"解放和增强社会活力"},{"key":"B","text":"解放和发展社会生产力"},{"key":"C","text":"促进社会公平正义、增进人民福"},{"key":"D","text":"推动生产关系和生产力、上层建筑和经济基础、国家治理和社会发展更好相适应"}],"answerKey":"B","explanation":"进一步全面深化改革，以经济体制改革为牵引，以促进社会公平正义、增进人民福祉为\n出发点和落脚点，更加注重系统集成，更加注重突出重点，更加注重改革实效，推动生产关系和\n生产力、上层建筑和经济基础、国家治理和社会发展更好相适应。C正确，D错误。解放和增\n强社会活力，是社会主义改革的内在要求和基本目的。解放和发展社会生产力，是改革开放的\n鲜明特征和首要任务。A、B错误。\n71\n\n\n2026考研政治冲刺③套卷 答案及解析分册\n1 0 . 答案A\n简析洋务运动具有封建性。洋务运动的指导思想是“中学为体，西学为用”，企图以吸取西\n方近代生产技术为手段，来达到维护和巩固中国封建统治的目的，这就决定了它必然失败的\n命运。因为新的生产力是同封建主义的生产关系及其上层建筑不相容的，是不可能在封建\n主义的桎梏下充分地发展起来的。A正确。洋务运动对列强具有依赖性和洋务企业的管理\n具有腐朽性，也是洋务运动失败的原因，但不是决定性的原因。B、C错误。维新派是在甲午\n战争失败后民族意识开始普遍觉醒的19世纪末才出现的。D错误。\n1 1 . 答案D\n简析孙中山的新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致，因而成为\n第一次国共合作的政治基础，D正确。A、B是第二次国共合作的特点，不选。第一次国共合\n作采取党内合作的形式，C错误。\n1 2 . 答案D\n简析西安事变的和平解决，成为时局转换的枢纽，十年内战局面基本结束，国内和平初步实\n现。D正确。中国人民在白山黑水间的奋起抵抗(1931年九一八事变之后)，成为中国人民\n抗日战争的起点。B错误。1937年卢沟桥事变爆发后，当地中国驻军奋起抵抗，中国由此进\n入全民族抗战阶段，并开辟了世界反法西斯战争的东方主战场。A错误。1937年9月22日，\n国民党中央通讯社发表《中共中央为公布国共合作宣言》；23日，蒋介石发表实际上承认共产\n党合法地位的谈话。以国共两党第二次合作为基础的抗日民族统一战线正式形成。C错误。\n1 3 . 答案C\n简析 1949年春，毛泽东在同有关人士谈话时提出，民主党派应“积极参政，共同建设新中\n国”。这标志着民主党派地位的根本变化，即它们不再是旧中国反动政权下的在野党，而将\n在中国共产党领导下，共同担负起管理国家和建设新中国的历史重任。中国共产党领导的\n多党合作政治格局，正是在这个基础上形成的。C正确。\n1948年4 月30日，中共中央在纪念五一国际劳动节的口号中提出：“各民主党派、各人\n民团体、各社会贤达迅速召开政治协商会议，讨论并实现召集人民代表大会，成立民主联合\n政府。”这个号召得到各民主党派和社会各界的热烈响应，揭开了中国共产党同各党派、各团\n体、各族各界人士协商建国的序幕，奠定了中国共产党领导的多党合作和政治协商制度的基\n础。A、B错误。1949年1月《对时局的意见》这个政治声明表明，中国各民主党派和无党\n派民主人士公开自愿接受中国共产党的领导，决心走人民革命的道路，拥护建立人民民主的\n新中国。D错误。","issues":[]},{"id":"x8-8-10","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":10,"type":"choice","difficulty":1,"module":"","stem":"10.甲午战争一役,洋务派经营多年的北洋海军全军覆没,标志着以“自强”“求富”为目标的洋务\n运动的失败。决定洋务运动必然失败命运的原因是","options":[{"key":"A","text":"洋务运动具有封建性"},{"key":"B","text":"洋务运动对列强具有依赖性"},{"key":"C","text":"洋务企业的管理具有腐朽性"},{"key":"D","text":"资产阶级维新派的强烈反对"}],"answerKey":"C","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x8-8-11","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":11,"type":"choice","difficulty":1,"module":"","stem":"11.在新民主主义革命时期,中国共产党与国民党实行过两次合作,第一次是建立国民革命联合","options":[{"key":"A","text":"广泛的民族性和复杂的阶级矛盾"},{"key":"B","text":"国共双方有政权有军队的合作"},{"key":"C","text":"合作双方采取党外合作的组织形式"},{"key":"D","text":"合作双方具有共同的政治基础"}],"answerKey":"C","explanation":"1935年8月1日，中国共产党驻共产国际代表团草拟《中国苏维埃政府、中国共产党\n中央为抗日救国告全体同胞书》(八一宣言)，不久公开发表，宣言主张停止内战，组织国防政\n府和抗日联军，对日作战。12月，中共中央在陕北瓦窑堡召开政治局扩大会议，提出党的基\n本策略任务是建立广泛的抗日民族统一战线，批评了党内长期存在的“左”倾冒险主义、关门\n主义的错误倾向。中国共产党在新的历史时期即将到来时掌握了政治主动权。C正确。","issues":[]},{"id":"x8-8-12","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":12,"type":"choice","difficulty":1,"module":"","stem":"12.1936 年 12 月初,蒋介石到达西安,逼迫张学良、杨虎城攻打陕甘的红军。12 月 12 日凌晨,张\n学良、杨虎城在屡次劝谏无效的情况下,发动了西安事变。事变后,张、杨联合发表通电,提出\n了改组南京政府、停止一切内战、开放民众爱国运动等八项抗日主张。中国共产党从民族大\n义出发,确定促成事变和平解决的基本方针,并派周恩来等到西安,参加谈判,迫使蒋介石作\n出“停止剿共,联红抗日”的承诺。西安事变的和平解决","options":[{"key":"A","text":"标志着中国进入全民族抗战阶段"},{"key":"B","text":"成为中国人民抗日战争的起点"},{"key":"C","text":"标志着抗日民族统一战线的正式形成"},{"key":"D","text":"成为时局转换的枢纽,国内和平初步实现"}],"answerKey":"D","explanation":"王明等人的“左”倾教条主义错误，对中国革命造成了极其严重的危害。这次错误使红\n军和根据地损失了90%，国民党统治区党的力量几乎损失了100%。其最大的恶果，就是使\n红军在第五次反“围剿”作战中遭到失败，不得不退出南方根据地实行战略转移——长征。\n1934年9月上旬，国民党军队加紧对中央革命根据地腹地发动进攻，红军已无在原地扭转战\n局的可能。10月，中共中央、中革军委率中央红军主力等8.6万余人踏上战略转移的漫漫征\n程，开始了世界历史上前所未有的壮举。③④正确。因此，本题选D。\n1 3 . 答案A\n简析党的八大坚持党中央提出的既反保守又反冒进，即在综合平衡中稳步前进的经济建设\n方针。A正确。毛泽东在《关于正确处理人民内部矛盾的问题》的报告中提出，对于物质利\n益、分配方面的人民内部矛盾，实行统筹兼顾、适当安排的方针，兼顾国家、集体和个人三方\n面的利益。B错误。1961年1月，党的八届九中全会决定对国民经济实行“调整、巩固、充\n实、提高”的八字方针。C错误。毛泽东在探索走中国工业化道路时，提出了以农业为基础，\n以工业为主导，以农轻重为序发展国民经济的总方针，以及一整套“两条腿走路”的工业化发\n展思路。D错误。\n1 4 . 答案B\n简析完备的法律规范体系，是中国特色社会主义法治体系的前提，是法治国家、法治政府、\n法治社会的制度基础；建设高效的法治实施体系，是建设中国特色社会主义法治体系的重\n点；严密的法治监督体系，是宪法法律有效实施的重要保障；有力的法治保障体系，是全面依\n法治国的重要依托。B正确，A、C、D错误。\n62\n\n\n1 5 . 答案A\n前析习近平指出，降低市场准入门槛是我们接下来扩大开放的重点。落实开放举措宜早不\n宜迟、宜快不宜慢。我们将扩大一些方面开放试点，还将加快文化、教育等领域的开放。同\n时，我们将着力破解市场准入中“大门开、小门不开”的具体问题，让外资企业在我们已经开\n放的领域“既准入又准营”。A正确，B、C、D错误。\n1 6 . 答案B\n简析 “两国方案”的核心在于实现巴勒斯坦和以色列作为两个主权国家和平共存。国际\n社会普遍认为，解决巴勒斯坦问题的唯一出路是落实“两国方案”，即建立以1967年边界为\n基础、以东耶路撒冷为首都、享有完全主权的独立的巴勒斯坦国。尽管巴勒斯坦早在1988年\n宣布建国，并得到联合国绝大多数会员国承认，但多数西方国家在此问题上长期保持缄默。\n新一轮巴以冲突的爆发，正是巴勒斯坦问题长期被“边缘化”的恶果。B正确，A、C、D错误。","issues":[]},{"id":"x8-8-13","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":13,"type":"choice","difficulty":1,"module":"","stem":"13.1949年1月22 日,李济深、沈钧儒等民主党派的领导人和著名的无党派民主人士55人联合\n发表《对时局的意见》，一致认定中共提出的关于召开政治协商会议、成立联合政府的主张\n“符合于全国人民大众的要求”,切表示“愿在中共领导下,献其绵薄,共策进行,以期中国\n人民民主革命之迅速成功,独立、自由、和平、幸福的新中国之早日实现”。1949 年春,毛泽东\n在同有关人士谈话时提出，民主党派应“积极参政,共同建设新中国”,这","options":[{"key":"A","text":"揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕"},{"key":"B","text":"奠定了中国共产党领导的多党合作和政治协商制度的基础"},{"key":"C","text":"标志着民主党派地位的根本变化"},{"key":"D","text":"表明中国各民主党派和无党派民主人士公开自愿接受中国共产党的领导\n14“法律既不是铭刻在大理石上，,也不是铭刻在铜表上,而是铭刻在公民们的内心里。”卢梭这\n句话强调的是"}],"answerKey":"B","explanation":"2025年中央一号文件首次提出发展农业新质生产力。D正确。其他三项都不是首次\n提出,A、B、C错误。","issues":[]},{"id":"x8-8-14","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":14,"type":"choice","difficulty":1,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","options":[],"answerKey":"","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-8-15","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":15,"type":"choice","difficulty":1,"module":"","stem":"15.进入新时代，以习近平同志为核心的党中央从强国建设、民族复兴的全局和战略高度,审视、\n谋划、部署新疆工作,不断深化对治疆规律的认识和把握，确立了新时代党的治疆方略,推动\n新疆各项事业取得历史性成就、发生历史性变革。新时代新驱工作的总目标是","options":[{"key":"A","text":"让老百姓过上好日子"},{"key":"B","text":"社会稳定和长治久安"},{"key":"C","text":"铸牢中华民族共同体意识"},{"key":"D","text":"高质量发展\n\n\n2026考研政治冲刺套卷试题分册"}],"answerKey":"A","explanation":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》对“十五五”经济\n社会发展作出了全面部署，明确把“建设现代化产业体系，巩固壮大实体经济根基”摆在战略\n任务的第一条。C正确，A、B、D错误。","issues":[]},{"id":"x8-8-16","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":16,"type":"choice","difficulty":1,"module":"","stem":"16.2025 年 5 月13 日,习近平出席中拉论坛第四届部长级会议开幕式并发表主旨讲话。习近平","options":[{"key":"A","text":"互利共赢"},{"key":"B","text":"平等相待"},{"key":"C","text":"开放包容"},{"key":"D","text":"造福人民"}],"answerKey":"C","explanation":"2025年7月24日，国家主席习近平会见欧洲理事会主席科斯塔和欧盟委员会主席冯\n德莱恩。习近平指出，中欧建交50年来，交流合作成果丰硕，既成就彼此又惠及世界，其中的\n重要经验和启示就是相互尊重、求同存异、开放合作、互利共赢。中欧经贸关系的本质是优\n势互补、互利共赢，应该也完全能够在发展中实现动态平衡。中国高质量发展、高水平对外\n开放将为中欧合作提供新机遇、拓展新空间。③④正确。因此，本题选D。","issues":[]},{"id":"x8-8-17","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":17,"type":"multi","difficulty":2,"module":"","stem":"17.习近平总书记多次强调坚持底线思维,强调“凡事从坏处准备,努力争取最好的结果,这样才\n能有备无患、遇事不慌,牢牢把握主动权”。以下论述体现底线思维的有","options":[{"key":"A","text":"“守乎其低而得乎其高”"},{"key":"B","text":"“备豫不虞,为国常道”"},{"key":"C","text":"“明镜所以照形,古事所以知今”"},{"key":"D","text":"“不谋全局者,不足谋一域"}],"answerKey":"AB","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x8-8-18","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":18,"type":"multi","difficulty":2,"module":"","stem":"18.在多地景区,游客们惊喜发现,登山竟然也能“开外挂”一一登山智能辅助产品成了新晋的爬山“神器”。泰山、黄山等知名景区纷纷投入使用外骨骼“机器腿”、智能登山杖、智能助行机\n器人等登山智能辅助产品,用科技力量帮助游客轻松登山。近年来,越来越多的新技术、新\n产品应用到体育运动、文旅休闲等领域,成为广大体育爱好者和行动不便人士的“新宠”。人\n们发明“机器腿”等辅助产品说明","options":[{"key":"A","text":"世界不会自动满足人的需求，人也不会满足于世界的现存形式"},{"key":"B","text":"主观和客观的矛盾是人类认识世界和改造世界的根本动力"},{"key":"C","text":"科学技术的发展是为了将人类从自然规律的制约下解放出来"},{"key":"D","text":"实践的需要推动人类的科学发现和技术发明"}],"answerKey":"AB","explanation":"社会存在和社会意识是辩证统一的。社会存在决定社会意识，社会意识是社会存在的\n反映，并反作用于社会存在。社会存在是社会意识内容的客观来源，社会意识是社会物质生\n43\n\n\n2026考研政治冲刺⊗套卷答案及解析分册\n活过程及其条件的主观反映。A正确。人民群众是社会历史的主体，是历史的创造者。人民\n群众是社会物质财富的创造者，是社会精神财富的创造者，是社会变革的决定力量。B正确。\n社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现。“素人”作\n品能够“引发更多情感共鸣”“戳中时代刚需”，说明其作为社会意识能够影响社会心态，反作\n用于社会存在。C正确。社会基本矛盾是历史发展的根本动力。人民群众始终是推动社会\n历史进步的根本动力。D错误。\n1 9 . 答案B C\n简析生产物质资料的劳动过程包括三个基本要素，即劳动者的劳动、劳动对象和劳动资料。\n劳动过程是劳动者通过有目的的活动，即运用劳动资料对劳动对象进行加工，改变自然界的\n物质形态，创造出满足人们某种需要的使用价值的过程。由于资本主义劳动过程的要素都\n为资本家所占有，这就决定了资本主义劳动过程的两个特点：其一，工人在资本家的监督下\n劳动，他们的劳动隶属于资本家；其二，劳动的成果或者产品全部归资本家所有。B、C正\n确。在资本主义制度下，工人的工资是劳动力的价值或价格，这是资本主义工资的本质。A\n错误。与以往的剥削制度不同，资本家与雇佣工人的关系不是完全占有，也不是人身依附，\n而是基于劳动者人身自由基础上的“平等”关系，剥削带有一定的隐蔽性。D错误。\n20. 答案A B D\n简析垄断组织操纵价格带来的结果是抑制了市场上价格的自由波动，垄断价格一定时期内\n背离生产价格和价值。但是，从全社会看，整个社会商品的价值仍然是由生产它们的社会必\n要劳动时间决定的，垄断价格既不能增加也不能减少整个社会所生产的价值总量，它只是对\n商品价值和剩余价值作了有利于垄断资本的再分配。A、B、D正确，C错误。\n21. 答案B C D\n简析 B、C、D正确。A是人口和地理决定论的观点，错误。\n2 2 . 答案A B C\n简析 A、B、C正确。关于跳出历史周期率问题，毛泽东在延安的窑洞里给出了第一个答案，\n这就是“让人民来监督政府”。面对党面临的重大风险考验和党内存在的突出问题，以习近\n平同志为核心的党中央坚定不移坚持和加强党的全面领导，坚定不移推进全面从严治党，深\n入推进新时代党的建设新的伟大工程，找到了“自我革命”这个跳出治乱兴衰历史周期率的\n第二个答案。D错误。\n2 3 . 答案A B D\n简析在“五统一、一开放”中，“统一政府行为尺度”的首次提出，意义重大。这一要求为政\n府行为厘清了边界、明确了尺度。“统一政府行为尺度”有助于为各类经营主体创造更公平\n的市场竞争环境，破解不同地区之间的过度“内卷”，促进要素资源流动。A、B、D正确。\n反腐败斗争是一项长期、复杂、系统的工程，需要综合运用法治、监督、教育等多种手段。“统\n一行为尺度”作为一项重要的制度性建设，是“治本之策”的重要一环，但将其作用拔高到“根\n本上杜绝”的程度，则忽略了问题的复杂性。C错误。\n44\n\n\n简析当前，人工智能技术加速迭代演进，正在对经济发展、社会进步、国际政治经济格局等\n方面产生重大而深远的影响。深入实施“人工智能+”行动，推动人工智能与经济社会深度融\n合，既是我们当前面临的紧迫任务，更是关乎长远发展的战略命题。深入实施“人工智能+”\n行动，是抢抓新一轮科技革命和产业变革机遇的战略选择，是培育发展新质生产力的内在要\n求，是满足人民美好生活需要的重要途径，是助力全球平等参与智能化发展进程的积极举\n措。A、B、C、D全选。\n2 5 . 答案A C D\n简析 2025年中央一号文件强调要稳定和完善农村土地承包关系，坚持“大稳定、小调\n整”，这是2025年中央一号文件提出的原则。要通过细致工作，确保延包政策扎扎实实落\n地，不能推倒重来、打乱重分，也不能借机违法调整或收回农户承包地，确保绝大多数农户承\n包地总体顺延、保持稳定。中央的要求非常明确，不允许城镇居民到农村购买农房、宅基地，\n不允许退休干部到农村占地建房，这两条政策底线必须守住、不能突破。A、C、D正确，B\n错误。","issues":[]},{"id":"x8-8-19","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":19,"type":"multi","difficulty":2,"module":"","stem":"19.通过对商品关系的深刻分析,马克思阐明了商品的二因素和生产商品的劳动的二重性及其\n相互关系、价值的质和量的规定性及其变化规律、价值形式的发展和货币的起源、商品经济的\n基本矛盾和基本规律及其作用,形成了科学的劳动价值论。马克思劳动价值论的重大意义在于","options":[{"key":"A","text":"首次提出了劳动创造价值的观点"},{"key":"B","text":"揭示了私有制条件下商品经济的基本矛盾"},{"key":"C","text":"为剩余价值理论的创立奠定了基础"},{"key":"D","text":"揭示了商品经济的一般规律,对理解社会主义市场经济具有指导意义"}],"answerKey":"ABD","explanation":"不变资本是以生产资料形态存在的资本。生产资料的价值通过工人的具体劳动被转\n移到新产品中，其转移的价值量不会大于它原有的价值量。尽管不同形式的生产资料转移\n价值的形式有所不同，有的是在一次生产过程中全部转移，如原材料和燃料；有的是在多次\n生产过程中逐渐转移，如机器、厂房等，但是转移的总是生产资料原有的价值量。以生产资\n料形式存在的资本在生产过程中只转移自己的价值量，不发生增殖，所以马克思把这部分资\n本叫作不变资本。A、D正确。\n20. 答案 A B D\n简析垄断是在自由竞争中形成的，是作为自由竞争的对立面产生的。但是，垄断并不能消\n除竞争，反而使竞争变得更加复杂和激烈。这是因为：第一，垄断没有消除产生竞争的经济\n条件。竞争是商品经济的一般规律。垄断产生以后，不但没有改变生产资料的资本主义私\n有制，而且又促进商品经济继续发展，所以不可能消除竞争。第二，垄断必须通过竞争来维\n持。垄断组织在取得一定的垄断地位后，由于存在攫取高额垄断利润的内在动力和面临更\n加强大的竞争对手的外在压力，必须不断增强自己的竞争实力，巩固自己的垄断地位。第\n三，社会生产是复杂多样的，任何垄断组织都不可能把包罗万象的社会生产全部包下来。\nA、B、D正确,C 错误。\n2 1 . 答案C D\n简析 1871年爆发的巴黎公社革命，是第一国际精神的产儿，是无产阶级夺取政权的第一\n次伟大尝试。马克思高度评价巴黎公社的意义，认为公社的原则是永存的。C、D正确。十\n月革命的胜利，实现了社会主义从理想到现实的伟大飞跃，开辟了人类历史的新纪元，苏维\n埃俄国成为世界上第一个社会主义国家。A错误。社会主义革命可以首先在一个或者几个\n国家获得胜利是列宁提出的。B错误。\n22. 答案A B\n简析 实事求是是毛泽东思想的基本点，是毛泽东思想的精髓。这条思想路线由毛泽东确立\n于民主革命时期。毛泽东向来反对离开中国社会和中国革命的实际去研究马克思主义。\n1930年，他在《反对本本主义》中强调调查研究是一切工作的第一步，提出了“没有调查，没\n有发言权”的著名论断。为了统一全党思想并为制定新民主主义革命的总路线奠定思想基\n础，毛泽东在延安整风期间又从思想路线的角度，不仅系统阐述了坚持实事求是的重要性，\n而且对实事求是的科学含义作了马克思主义的界定。毛泽东还把实事求是形象地比喻为\n“有的放矢”，强调我们要坚持用马克思主义之“矢”去射中国革命之“的”。经过延安\n24\n\n\n整风和党的七大，实事求是的思想路线在全党得到了确立。A、B正确。\n毛泽东在新民主主义革命时期领导我们党克服了党内曾经盛行的把马克思主义教条\n化、把共产国际决议和苏联经验神圣化的错误倾向，在全党确立了实事求是的思想路线，由\n此保证了新民主主义革命和社会主义改造的胜利。然而，党没能始终如一坚持这条思想路\n线，在社会主义建设道路的探索中出现了曲折。邓小平指出：“一个党，一个国家，一个民族，\n如果一切从本本出发，思想僵化，迷信盛行，那它就不能前进，它的生机就停止了，就要亡党\n亡国。”C是邓小平的观点，不符合题意。“不唯上、不唯书、只唯实，交换、比较、反复”是陈云\n提出的，D不符合题意。\n简析加快内外贸一体化发展是构建新发展格局、推动高质量发展的内在要求，对促进经济\n发展、扩大内需、稳定企业具有重要作用。内外贸一体化发展，能推动企业更好利用两个市\n场、两种资源，实现在国内外市场相互促进、协调发展。A、B正确。对中国企业而言，加快\n推进内外贸一体化可以借助国际竞争压力倒逼中国企业加快转型升级，通过灵活调整企业\n产供销渠道和生产经营计划，提升企业的抗风险能力和生产经营韧性。D正确。外部环境急\n剧变化的不确定性是客观事实，我们要认真应对，但无法彻底消除这种不确定性。C错误。\n24. 答案 A B C D\n简析人大代表作用的发挥，直接关系人民代表大会制度的运行，直接关系人大工作质量和\n水平。人大代表参加行使国家权力的主要形式是出席人民代表大会会议，参与重要法律法\n规的制定修改、计划预算的审查批准和重大事项的审议决定，依法参加选举、表决重要人\n事任免事项，提出议案和建议，等等。A、B、C、D全选。","issues":[]},{"id":"x8-8-20","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":20,"type":"multi","difficulty":2,"module":"","stem":"20.金融资本是由工业垄断资本和银行垄断资本融合在一起而形成的一种垒断资本。金融资本\n形成的主要途径包括","options":[{"key":"A","text":"金融联系"},{"key":"B","text":"资本参与"},{"key":"C","text":"行政干预"},{"key":"D","text":"人事参与\n21。在反对资产阶级的斗争中,无产阶级要从自发走向自觉并取得斗争的胜利,就必须建立起自\n已的革命政党。无产阶级政党"}],"answerKey":"ACD","explanation":"国家资本所有制在整个资本主义经济中所占的比重并不大，但是由于主要存在于基础\n设施和公共事业部门，所以对整个社会经济的发展有着重要的影响。国家资本所有制就其\n性质而言仍然是资本主义形式，体现着总资本家剥削雇佣劳动者的关系。A、C、D正确。第\n二次世界大战后，资本主义生产资料所有制发生了新的变化，这就是国家资本所有制形成并\n发挥重要作用，法人资本所有制崛起并成为居主导地位的资本所有制形式。B错误。\n21. 答案C D\n简析马克思、恩格斯适应社会的需要，在新的历史条件下创立和发展了唯物史观和剩余价\n值学说，为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。C、D正确。\n22. 答案B C D\n简析 1929年12月，红四军党的第九次代表大会(古田会议)在福建上杭县古田村召开。大\n会根据中央九月来信精神，通过了毛泽东起草的古田会议决议，其中最重要的是关于纠正党\n内错误思想的决议案，确立了思想建党、政治建军原则；阐述了加强党的思想建设的极端重\n要性，指明党内各种非无产阶级思想的表现、来源及纠正办法；规定红军是一个执行革命的\n政治任务的武装集团，必须绝对服从共产党的领导，必须全心全意为党的纲领、路线和政策\n而奋斗；提出红军必须担负打仗、筹款和做群众工作的任务，必须加强政治工作。B、C、D正\n确。1927年9 月29日，毛泽东领导秋收起义的起义军在江西永新县三湾村进行了著名的三\n湾改编，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队\n的重要开端。A错误。\n23. 答案A B C D\n简析 习近平总书记指出，构建新发展格局是适应我国发展新阶段要求、塑造国际合作和竞\n争新优势的必然选择。因此，我们要牢牢把握新发展阶段的新要求，完整准确全面贯彻新发\n展理念，加快推动高质量发展，夯实经济发展根基，塑造发展新动能新优势，扎实推进中国式\n现代化建设。构建新发展格局要求经济发展向内需主导转变，这为高质量发展提供有力支\n撑；构建新发展格局要求扩大高水平开放，这为高质量发展拓展广阔空间；构建新发展格局\n要求增强自主创新能力，这为高质量发展注入强劲动力；构建新发展格局要求加快构建新安\n全格局，这为高质量发展提供重要保障。A、B、C、D全选。\n24. 答案A B C\n简析破除“内卷式”竞争，是按照经济规律办事的必然要求。“内卷式”恶性竞争会削弱行\n业整体竞争力，会破坏产业发展生态，会阻碍国内大循环。“内卷式”竞争具有鲜明的内耗\n15\n\n\n2 0 2 6 考研政治冲刺8 套卷 答案及解析分册\n性，过多资源、要素投入低效竞争，抑制了创新活力的释放，阻碍了供需间高水平动态平衡的\n形成，还直接影响员工工资水平、政府税收收入、未来投资信心，进而影响经济发展全局。A、\nB、C正确。“内卷式”恶性竞争往往会引发价格战，导致利润空间受挤压。D错误。\n2 5 . 答案A C D\n简析一个大国发展兴盛，必然要求文化传播力、文明影响力大幅提升，实现软实力和硬实力\n相得益彰。一个国家的文化软实力，从根本上说，取决于其核心价值观的生命力、凝聚力、感\n召力。习近平指出：“我国要提高国家文化软实力，就必须使当代中国价值观念走向世界。”\nA、D正确。讲好中国故事、传播好中国声音，根本在于传播理念，以我为主，以理服人，以情\n动人。C正确。中国特色社会主义文化建设要坚持“二为”方向、“双百”方针。坚持为人民\n服务、为社会主义服务的根本方向，是决定社会主义文化事业前途命运的关键。坚持百花齐\n放、百家争鸣，是繁荣发展社会主义文化的重要方针。B错误。\n2 6 . 答案A B D\n简析题干这段材料的核心寓意是告诫党员干部不能在“舒适区”久留，要警惕意志消沉，继\n续“负重前行”。要有“挑担人”的自觉、“赶路人”的警醒、“攀登者”的坚定。A、B、D三项准\n确体现了这一警示的深刻内涵。“四风”问题具有顽固性、反复性，必须以打攻坚战、持久战\n的决心和恒心，锲而不舍落实中央八项规定精神，推进作风建设常态化长效化，以优良作风\n凝心聚力、真抓实干，不断开创事业发展新局面。C错误。\n2 7 . 答案A B C\n简析资本-帝国主义列强在对中国实行军事侵略、政治控制、经济掠夺的同时，还对中国进\n行文化渗透。例如，1907年美国总统西奥多·罗斯福宣布将退还部分庚子赔款，用于资助中\n国政府选派留学生赴美留学，史称“庚款兴学”。毛泽东在《“友谊”，还是侵略?》一文中指\n出，“庚款兴学”的实质是帝国主义的文化侵略。资本-帝国主义列强对中国进行文化渗透\n的目的是宣扬殖民主义奴化思想，麻醉中国人民的精神，摧毁中国人的民族自尊心和自信\n心。A、B、C正确。镇压中国人民的反抗是政治控制的方式，D不符合题意。","issues":[]},{"id":"x8-8-21","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":21,"type":"multi","difficulty":2,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","options":[],"answerKey":"","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-8-22","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":22,"type":"multi","difficulty":2,"module":"","stem":"22.1938年,毛泽东在党的六届六中全会上所作的《论新阶段》的政治报告中最先提出了“马克思\n主义的中国化”这个命题。这是党首次明确提出“马克思主义的中国化”的重大命题。既然\n马克思主义是科学的理论,是当时中国人选择的救国救民的真理,那么按他的理论照着做就\n行了,为什么还要提出马克思主义中国化时代化呢？这是因为找到了马克思主义这个薪新\n的思想武器,并不意味着就能够自然而然地解决中国革命所面临的问题。推进马克思主义\n中国化时代化","options":[{"key":"A","text":"是马克思主义理论自身发展的需要"},{"key":"B","text":"是解决中国实际问题和时代问题的客观需要"},{"key":"C","text":"才能真正解决教条主义和经验主义的问题"},{"key":"D","text":"才能找到放之四海而皆准的革命和建设模式"}],"answerKey":"BD","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x8-8-23","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":23,"type":"multi","difficulty":2,"module":"","stem":"23.历史正反两方面的经验表明，“两个结合”是我们取得成功的最大法宝。“结合”不是“拼\n盘”,不是简单的“物理反应”,而是深刻的“化学反应”。“结合”的结果是","options":[{"key":"A","text":"造就了一个有机统一的新的文化生命体"},{"key":"B","text":"让马克思主义成为中国的"},{"key":"C","text":"让中华优秀传统文化成为现代的"},{"key":"D","text":"让经由“结合”而形成的新文化成为中国式现代化的文化形态"}],"answerKey":"BCD","explanation":"外资企业在推动中国改革开放和现代化建设中发挥了重要作用。一是带动了中国经\n济增长和就业。二是促进了中国技术和管理进步。三是助推了中国改革开放。中国已经形\n成比较健全的利用外资法规政策体系和工作体系，将长期成为外资企业投资兴业的沃土。\nA、C、D 正确。\n外资经济是社会主义市场经济的重要组成部分，但不是社会主义经济的重要组成部分\n(只有公有制经济是社会主义经济)。B错误。\n24. 答案A C D\n简析实施区域重大战略，有助于打造高质量发展的动力源。比如，京津冀协同发展围绕疏\n解北京非首都功能，把发展落差的势能变成协同发展的动能，推动北京“新两翼”协同发力，\n带动周边区域高质量发展。实施区域重大战略，有助于加强生态文明建设。比如，长江经济\n带高质量发展坚持生态优先、绿色发展，共抓大保护、不搞大开发，扎实推进长江生态环境保护\n修复。实施区域重大战略，有助于建设改革开放的试验田。比如，粤港澳大湾区建设要求在\n“一国两制”方针和基本法框架内，发挥粤港澳三地综合优势，加强规则衔接、机制对接，推动港\n澳融入国家发展大局，对接高质量共建“一带一路”，建设高水平开放合作平台。A、C、D正确。\n共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的\n富裕，也不是整齐划一的平均主义；不是所有人都同时富裕，也不是所有地区同时达到一个\n富裕水准。B错误。\n34\n\n\n简析人是消费主体、生产主体和创新源泉，是生产力中最活跃的因素。“投资于人”就是紧\n盯“人”这一关键点，投资于人的多维度需求，投资于人的全面发展。这既有助于培育强大的\n国内消费市场，畅通国内大循环；也有助于增加人力资本，激发创新创造活力，加快发展新\n质生产力，夯实高质量发展的根基。A、B正确。把更多资金资源“投资于人”，在加强基础\n性、普惠性、兜底性民生建设和解决群众急难愁盼问题上多办实事，在健全社会保障体系、增\n强基本公共服务均衡性可及性上再上水平，有助于提高人民生活品质，实现在惠民中发展、\n在发展中惠民。我国人口发展呈现少子化、老龄化、区域人口增减分化等明显的趋势性特\n征，通过教育、培训等“投资于人”，有助于提高人口整体素质，更好释放人口红利和人才红\n利。C、D正确。\n2 6 . 答案B C D\n简析听党指挥、能打胜仗、作风优良，三者相互联系、密不可分，抓住了建设强大人民军队最\n根本、最紧要、最现实的问题，明确了加强军队建设的聚焦点和着力点，体现了坚持党的建\n军原则、人民军队根本职能、特有政治优势的高度统一。建军治军抓住听党指挥、能打胜仗、\n作风优良这三条，就抓住了要害，就能起到纲举目张的作用。B、C、D正确，A不符合题意。","issues":[]},{"id":"x8-8-24","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":24,"type":"multi","difficulty":2,"module":"","stem":"24.《新时代的中国国家安全》白皮书指出，总体国家安全观的关键在于“总体”。以下说法正确","options":[{"key":"A","text":"“总体”是新时代中国国家安全的灵魂"},{"key":"B","text":"总体国家安全观突出大安全理念"},{"key":"C","text":"追求绝对安全是新时代中国国家安全的中心任务"},{"key":"D","text":"大安全是新形势下对国家生存和可持续发展的维护"}],"answerKey":"ABCD","explanation":"当前，我国面临的国际环境复杂严峻，国内需求不足的挑战仍然较大。扩大内需不是\n权宜之计，而是战略之举。着力扩大国内需求，是当前和今后一段时间经济工作的重要任\n务。看普遍规律，内需主导是大国经济特征。从国际经验看，大国经济的特征都是内需为主\n导、内部可循环。看外部环境，扩大内需是应对外部冲击的有效途径。看国内现实，扩大内需\n是全面建设社会主义现代化国家的实践要求。看百姓需求，扩大内需是满足人民对美好生\n活向往的现实需要。A、B、C、D全选。","issues":[]},{"id":"x8-8-25","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":25,"type":"multi","difficulty":2,"module":"","stem":"25.2025年1月,习近平在二十届中央纪委四次全会上明确提出“风腐同查同治”,强调需解决风\n腐交织、共生共存的突出问题。这一部署基于对新型腐败与隐性腐败的精准研判，体现了作\n风建设常态化要求。凤腐同查同治,这一策略","options":[{"key":"A","text":"突破传统“分而治之”的局限"},{"key":"B","text":"揭示了不正之风与腐败问题同根同源的本质"},{"key":"C","text":"为破解“边纠风边生腐”难题提供了科学方法论"},{"key":"D","text":"标志着反腐败斗争进入标本兼治新阶段\n社会的共识和行动,成为习近平生态文明思想的核心理念。在“绿水青山就是金山银山”理\n念的指引下,我国生态文明建设从理论到实践都发生历史性、转折性、全局性变化,美丽中国\n建设迈出重大步伐。我国"}],"answerKey":"ABCD","explanation":"巩固和完善农村基本经营制度，必须牢牢守住土地公有制性质不改变、耕地红线不突\n破、农民利益不受损的底线，发展农业适度规模经营，促进农业经营主体高质量发展，为加快\n建设农业强国增活力添动能。A、B、C正确。我国农村土地实行使用权、承包权、经营权“三\n权分置”，农村土地经营权是可以流转的。D错误。\n26. 答案A B C D\n简析中华文明源远流长、博大精深，是中华民族独特的精神标识，是当代中国文化的根基，\n是维系全世界华人的精神纽带，是中国文化创新的宝藏。A、B、C、D全选。","issues":[]},{"id":"x8-8-26","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":26,"type":"multi","difficulty":2,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","options":[],"answerKey":"","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-8-27","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":27,"type":"multi","difficulty":2,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","options":[],"answerKey":"","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-8-28","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":28,"type":"multi","difficulty":2,"module":"","stem":"28.1920年8月,中国共产党的最早组织在上海成立。之后,在北京、武汉、长沙、济南、广州,都成立了共产党早期组织。在日本、法国成立了由留学生和华侨中先进分子组成的共产党早期组织。早期党的地方组织的形成,为中国共产党的创建准备了组织基础。中国共产党的早期组织之所以首先在上海诞生,是因为","options":[{"key":"A","text":"上海是中国工人阶级最密集的中心城市"},{"key":"B","text":"身居上海的陈独秀在中国大地上率先举起了马克思主义旗帜"},{"key":"C","text":"上海是马克思主义在中国最早的传播地和传播中心"},{"key":"D","text":"上海的工人阶级最早以独立的政治力量登上历史舞台"}],"answerKey":"BC","explanation":"1920年8月，中国共产党的最早组织在上海成立。中国共产党的早期组织为什么会首\n先在上海诞生?因为上海是马克思主义在中国最早的传播地和传播中心，又是中国工人阶\n级最密集的中心城市。在五四运动期间，上海的工人阶级最早以独立的政治力量登上历史\n舞台。A、C、D正确。李大钊在中国大地上率先举起了马克思主义旗帜，B错误。","issues":[]},{"id":"x8-8-29","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":29,"type":"multi","difficulty":2,"module":"","stem":"29.1949年3月召开的中共七届二中全会是新中国成立前中国共产党召开的一次十分重要的会\n议。毛泽东在会议上提出了“两个务必”的思想,即“务必使同志们继续地保持谦虚、谨慎、不\n骄、不躁的作风,务必使同志们继续地保持艰苦奋斗的作风”。这次会议","options":[{"key":"A","text":"标志着中国革命重心从农村转向城市"},{"key":"B","text":"提出要掌握斗争的方向,不要四面出击"},{"key":"C","text":"规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策"},{"key":"D","text":"。指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向\n30。中国革命道德内容丰富、历久弥新,是中国共产党领导全体人民实现民族独立、人民解放的\n精神支撑,对于我们走好新时代的长征路,实现中华民族伟大复兴仍然具有极其重要的现实\n意义。中国革命道德的当代价值在于,发扬革命道德、传承红色基因,有利于"}],"answerKey":"ABCD","explanation":"1949年3月召开的中共七届二中全会，规定了党在全国胜利后在政治、经济、外交方面\n应当采取的基本政策，指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主\n义社会的发展方向。在这次会议上，毛泽东告诫全党，夺取全国胜利，这只是万里长征走完\n了第一步，中国的革命是伟大的，但革命以后的路更长，工作更伟大，更艰苦。据此，他提出了\n“两个务必”的思想。毛泽东还指出，在胜利面前，必须警惕资产阶级“糖衣炮弹”的攻击。C、\nD正确。\n中共七届二中全会讨论了党的工作中心由乡村转移到城市的问题，指出“从现在起，开\n始了由城市到乡村并由城市领导乡村的时期”。1949年3月25日，毛泽东等中央领导人与\n中央机关、人民解放军总部进驻北平(北京)香山，标志着中国革命重心从农村转向城市。\nA 错误。中共七届三中全会上毛泽东作了《不要四面出击》的讲话。B错误。\n75\n\n\n2026考研政治冲刺◎套卷答案及解析分册\n3 0 . 答案 A B C D\n简析 中国革命道德的当代价值包括：有利于加强和巩固社会主义和共产主义的理想信念；\n有利于培育和践行社会主义核心价值观；有利于引导人们树立正确的道德观；有利于培育良\n好的社会道德风尚。A、B、C、D全选。\n31. 答案B C\n简析坚持法律面前人人平等，对于坚持走中国特色社会主义法治道路具有十分重要的意\n义。平等是社会主义法律的基本属性，是社会主义法治的基本要求。B、C正确。党的领导\n是社会主义法治最根本的保证，人民是依法治国的主体和力量源泉。A错误。推进全面依法\n治国，根本目的是依法保障人民权益。D错误。\n3 2 . 答案A C D\n简析外交部发言人在回答记者提问时指出，雅下水电工程建设是中国主权范围内的事，旨\n在加快发展清洁能源，大力改善当地民生，积极应对气候变化。中方在跨境河流开发上始\n终秉持高度负责任的态度，也有丰富的水电工程开发经验。A、C、D正确。雅下水电工程的\n核心功能是发电(利用水能)，而非主要进行跨区域的水资源调配(如南水北调工程)。虽然\n水电站在调度运行时会对局部水流有影响，但其主要目的不是改变全国或区域的水资源配\n置格局。B错误。\n3 3 . 答案A B C\n简析中美经贸关系是经济规律作用的结果，具有强大内生动力。中美经贸合作为双方带来\n的经济利益巨大，美国的受益程度丝毫不低于中国。美方盯着货物贸易逆差大做文章，扭曲\n了中美经贸关系的真实图景。中美货物贸易差额既是美国经济结构性问题的必然结果，也\n是由两国比较优势和国际分工格局决定的，还与统计方法有关。美国单边主义、保护主义不\n断抬头，一再对华推出单边关税措施，严重干扰两国正常合作。A、B、C正确，D错误。","issues":[]},{"id":"x8-8-30","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":30,"type":"multi","difficulty":2,"module":"","stem":"【OCR 转档缺失 · 题干待补充】","options":[],"answerKey":"","explanation":"","issues":["missing-content"],"qc":["missing-content"]},{"id":"x8-8-31","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":31,"type":"multi","difficulty":2,"module":"","stem":"31.中国特色社会主义法治道路本质上是中国特色社会主义道路在法治领域的具体体现。走中\n国特色社会主义法治道路,必须坚持法律面前人人平等。平等是","options":[{"key":"A","text":"社会主义法治最根本的保证"},{"key":"B","text":"社会主义法律的基本属性"},{"key":"C","text":"社会主义法治的基本要求"},{"key":"D","text":"推进全面依法治国的根本目的"}],"answerKey":"ABCD","explanation":"坚持依法治国和以德治国相结合，既要强化道德对法治的支撑作用，重视发挥道德的\n教化作用，提高全社会文明程度，为全面依法治国创造良好环境；又要把道德要求贯彻到法\n治建设中，以法治承载道德理念。立法、执法、司法都要体现社会主义道德要求，都要把社\n会主义核心价值观贯穿其中，使社会主义法治成为良法善治，引导全社会崇德向善。要运用\n法治手段解决道德领域突出问题，依法加强对群众反映强烈的失德行为的整治。A、B、C正\n确。思想道德和法律都是调节人们思想行为、协调人际关系、维护社会秩序的重要手段。思\n想道德和法律虽然在调节领域、调节方式、调节目标等方面存在很大不同，但是二者都是上\n层建筑的重要组成部分，共同服务于一定的经济基础。D错误。\n32. 答案A B C D\n简析近年来，全国人大代表、全国政协委员和台湾同胞多次提出建议，要求设立台湾光复纪\n念日，并举行纪念活动。设立台湾光复纪念日，在国家层面举行纪念活动，有利于体现台湾\n是中国不可分割一部分这一无可辩驳的历史事实，巩固国际社会坚持一个中国的格局，引\n领两岸同胞传承、弘扬伟大抗战精神，激励全体中华儿女为祖国统一、民族复兴而团结奋\n斗。A、B、C、D全选。\n33. 答案A B C D\n简析“上海精神”是上合组织的“根”和“魂”。“上海精神”广受欢迎，被视为处理国与国关\n系的理念典范。“上海精神”的内核同《联合国宪章》宗旨和原则高度契合，同和平共处五项\n原则一脉相承，同成员国睦邻友好的诉求完全呼应。“上海精神”彻底摒弃冷战思维、零和博\n弈、文明冲突的历史沉渣，成为各成员国同舟共济、世代友好的凝聚力量。A、B、C、D全选。","issues":[]},{"id":"x8-8-32","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":32,"type":"multi","difficulty":2,"module":"","stem":"32.雅鲁藏布江下游水电工程开工仪式于 2025 年 7 月 19 日在西藏自治区林芝市举行。雅下水\n电工程体量大、周期长、影响远,堪称世纪工程。中国之所以要修建雅下水电工程,是为了","options":[{"key":"A","text":"加快发展清洁能源"},{"key":"B","text":"优化国家水资源配置"},{"key":"C","text":"大力改善当地民生"},{"key":"D","text":"积极应对气候变化\n\n\n2026考研政治冲刺8套卷（八）"}],"answerKey":"ABC","explanation":"《关于<中华人民共和国全国人民代表大会和地方各级人民代表大会代表法(修正草\n案)〉的说明》指出：(一)修改代表法是坚持党的全面领导、坚定不移走中国特色社会主义政\n治发展道路的必然要求；(二)修改代表法是推动人大工作高质量发展，坚持好、完善好、运行\n好人民代表大会制度的重要保障；(三)修改代表法是发展全过程人民民主，使各级人大及其\n常委会成为始终同人民群众保持密切联系的代表机关的客观要求。B、C、D正确。新时代爱\n国统一战线的历史责任是促进中华儿女大团结，A不符合题意。\n56\n\n\n简析国际调解院将与现有国际诉讼或仲裁机构相互补充，为各方和平解决国际争端提供新\n平台。中华法系推崇天下无讼、以和为贵，这同现代国际法提倡的和平解决国际争端是高度\n契合的。国际调解院不搞强制裁决而是提供中立平台，坚持自愿参与、平等决策、共同受\n益，尊重各方合理关切，追求实现互利共赢，生动诠释了和合共生的文明智慧。A、B、C正\n确。国际调解院面向所有国家(非仅发展中国家)，也不是“替代”国际法院，而是与现有国际\n诉讼或仲裁机构相互补充。D错误。","issues":[]},{"id":"x8-8-33","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":33,"type":"multi","difficulty":2,"module":"","stem":"33.国务院新闻办公室于2025年4月9日发布了《关于中美经贸关系若干问题的中方立场》白皮\n书。白皮书指出,中美货物贸易差额","options":[{"key":"A","text":"是美国经济结构性问题的必然结果"},{"key":"B","text":"是由两国比较优势和国际分工格局决定的"},{"key":"C","text":"与统计方法有关"},{"key":"D","text":"源于美国长期操纵美元汇率"}],"answerKey":"ABCD","explanation":"","issues":["no-analysis"],"qc":["no-analysis"]},{"id":"x8-8-34","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":34,"type":"material","difficulty":2,"module":"","stem":"运用主观能动性与客观规律性相统一的原理,说明为什么“防沙治沙的目的,就是让那些本\n不该是荒漠的地方恢复原貌,而非消灭地球上原有的沙漠、荒漠”。","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","荒漠化是影响人类生存和发展的重大生态问题,我国是世界上荒漠化和沙化最为严重 的国家之一。从被誉为“中国魔方”的麦草方格、沙坡头“五带一体”铁路治沙技术,到沙漠 生态大数据平台、实现干旱地区飞播造林数十年来，一大批科研工作者把论文写在西北大漠上,在实践一线探索创新,为科学治沙打造了诸多“利器”。荒漠不是病,荒漠化才是病。在专家看来,天然的荒漠是一类具备多种功能和价值的生 态系统。而荒漠化指的是那些本不该是荒漠的地方,因为过度的人为活动,加上气候等因素 导致土地沙化。防沙治沙的目的,就是让那些本不该是荒漠的地方恢复原貌，而非消灭地球 上原有的沙漠、荒漠。 截至目前,我国53%的可治理沙化土地已得到有效治理,沙化土地面积净减少6500万 亩,呈现出“整体好转、改善加速”的良好态势。 摘编自《人民日报》（2025.年2月.26日）","夏日,生机勃勃,在北京市温榆河公园“生态心”区域,水边的芦苇和蒲草蓬勃舒展开 来,野花散发出淡淡芬芳,叫不上名字的野草也在享受着阳光和雨露。这里没有人工干预和 打理，一切都在“野蛮”生长。 城市公园里,为何有片区域无人管？ 温榆河公园规划面积30平方公里,是北京六环内最大的“绿肺”。其中,温榆河、清河交 汇处曾经采砂场林立,昼夜采砂不停,别说有珍稀动物了,就连麻雀、野兔也不愿意来。关停 腾退后,两河交汇处成为温榆河公园“生态心”,三角洲地带是其核心区。 在“生态心”,荒野化是主基调一一没有游乐设施,没有精心打理的花草,也没有园径和 路灯,让自然演替主导生态恢复进程,使之真正成为人迹罕至、草长莺飞的荒野。 在公园中留荒野,意义何在? 这是城市“再野化”的试点,通过减少人类活动的干预,恢复和重建生态系统功能,这对 超大城市生物多样性建设意义非凡。据介绍,温榆河公园近三成面积都规划为自然带,尽量 减少人为扰动。通过生境修复和再野化管理,可以增加生物物种数量,提升区域内荒野化自 然程度,改善野生动植物栖息环境,形成生态友好的环境空间。温榆河生态监测团队提供的 数据显示,温榆河公园已记录的动植物累计超过800种,其中不乏大钨、斑头秋沙鸭、青头潜 鸭、黄胸鸥等珍稀鸟类。 2026老考研政治冲刺8套卷 试题分册 不强求大树整齐划一，允许绿化中出现小虫、杂草，丰富的植物多样性引来各种动 物在这片水绿交融的荒野地,随着生态不断改善,更多的珍稀动植物将会陆续恢复。 摘编自《人民日报》（2025年6月10日） （1）运用主观能动性与客观规律性相统一的原理,说明为什么“防沙治沙的目的,就是让那些本 不该是荒漠的地方恢复原貌,而非消灭地球上原有的沙漠、荒漠”。 （2）“在公园中留荒野”对我们处理人与自然的关系有何启示？"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-8-35","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":35,"type":"material","difficulty":2,"module":"","stem":"为什么要“紧紧围绕铸牢中华民族共同体意识、推进中华民族共同体建设”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","率中央代表团出席新疆维吾尔自治区成立70周年庆祝活动的中共中央总书记、国家主 席、中央军委主席习近平,(9月)24 日听取新疆维吾尔自治区党委和政府工作汇报。他强 调,新疆要完整准确全面贯彻新时代党的治疆方略，坚持稳中求进工作总基调,统筹发展和 安全,牢牢扭住社会稳定和长治久安工作总目标,紧紧围绕铸牢中华民族共同体意识、推进 中华民族共同体建设,锚定中央赋予的“五大战略定位”，凝心聚力、久久为功,努力建设团 结和谐、繁荣富裕、文明进步、安居乐业、生态良好的社会主义现代化新疆。 习近平指出,要全力维护新疆社会大局稳定。坚持抓基层、强基础、固根本,筑牢反恐维 稳的人民防线。铸牢中华民族共同体意识、推进中华民族共同体建设,推进我国宗教中国 化,加强文化润疆、注重以文化人，引导各族干部群众树立正确的国家观、历史观、民族观、文 化观、宗教观。 摘编自《人民日报》(2025年9月25日）","习近平总书记指出：“各族人民都有一个共同家园,就是中国;都有一个共同身份,就是 中华民族;都有一个共同名字,就是中国人;都有一个共同梦想,就是实现中华民族伟大 复兴。\" 要坚持和完善民族区域自治制度,健全铸牢中华民族共同体意识制度机制,加强宗教事 务治理法治化,促进各民族广泛交往交流交融,牢固树立休成与共、荣辱与共、生死与共、命 运与共的共同体理念。要坚持以铸牢中华民族共同体意识为主线,深化民族团结进步创建, 宗教观,增强国家意识、公民意识、法治意识,构筑中华民族共有精神家园。 摘编自《人民日报》（2025年9月26日）（1）为什么要“紧紧围绕铸牢中华民族共同体意识、推进中华民族共同体建设”？（2）为什么“要坚持和完善民族区域自治制度”？ 2026考研政治冲刺8套卷（八）"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-8-36","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":36,"type":"material","difficulty":2,"module":"","stem":"为什么说辛亥革命是“中国人民和中国先进分子为实现民族独立、人民解放进行的一次伟大\n而艰辛探索”?","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","110年前,以孙中山先生为代表的革命党人发动了震惊世界的辛亥革命,推翻了清朝政 府,结束了在中国延续几千年的君主专制制度,近代以来中国发生的深刻社会变革由此拉开 了序幕。这是中国人民和中国先进分子为实现民族独立、人民解放进行的一次伟大而艰辛探索。历史发展总是螺旋式上升、波浪式前进的。由于历史进程和社会条件的制约,由于没有 封建的社会性质和中国人民的悲惨境遇,没有完成实现民族独立、人民解放的历史任务。辛 亥革命之后,在这场革命中接受洗礼的中国人民和中国先进分子继续探寻救国救民道路。 十月革命一声炮响,给中国送来了马克思列宁主义，促进了中国人民的伟大觉醒,在马克思 列宁主义同中国工人运动的紧密结合中,中国共产党应运而生。中国共产党一经诞生,就把 为中国人民谋幸福、为中华民族谋复兴确立为自己的初心和使命，点亮了实现中华民族伟大 复兴的灯塔。 摘自习近平《在纪念辛亥革命110周年大会上的讲话》","孙中山先生的伟大,不仅在于他领导了辛亥革命,而且在于他为了实现革命理想,与时 俱进完善自已的革命理念和斗争方略，毫不妥协同逆时代潮流而动的各种势力进行斗 争毛泽东同志把三民主义纲领、统一战线政策、艰苦奋斗精神并称为孙中山先生“留给 我们的最中心最本质最伟大的遗产”,是“对于中华民族最伟大的贡献”。 中国共产党人是孙中山先生革命事业最坚定的支持者、最忠诚的合作者、最忠实的继承者。摘自习近平《在纪念孙中山先生诞辰150周年大会上的讲话》 （1）为什么说辛亥革命是“中国人民和中国先进分子为实现民族独立、人民解放进行的一次伟大 而艰辛探索”? （2）怎样理解“中国共产党人是孙中山先生革命事业最坚定的支持者、最忠诚的合作者、最忠实 的继承者”？"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-8-37","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":37,"type":"material","difficulty":2,"module":"","stem":"如何理解“平凡岗位,亦有书写不凡人生、实现社会价值的广阔天地”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","古语有云：“敬业者,专心致志以事其业也。”干一行、爱一行,专一行精一行,爱岗敬业 的精神在接续奋斗中代代相传。当年,百货大楼售货员张乘贵练就售货“一抓准”、算账“一 口清”的本领,以“一团火”般的服务热情温暖顾客。如今,快递员宋学文累计配送30余万 件包襄,用零差评、零投诉、零安全事故的业绩赢得认可;建筑工人邹彬,在工地上磨炼砌筑 技能,成长为全国技术能手,以一技之长“砌”出精彩人生…这些最美劳动者身上有着突 出的共同品质,即就蔬业业、争创一流。他们用双手刻画劳动之美,展现自信风采,证明敬业 2026 考研政治冲刺套卷 试题分册 是最坚实的职业阶梯。 平凡岗位,亦有书写不凡人生、实现社会价值的广阔天地。向下扎根,不懈耕耘,既为个 人成长打下基础,也将生活点染得更加丰富多彩。劳动者的自我实现与社会进步紧密相连、同频共振、在岗位上发光发热,温暖与正能量也会传递给周围的人。外卖员仔细核对信息,确保餐品准确送达顾客；产业工人不断精进技能,提高生产效率;社区工作者耐心倾听居民需求,及时解决急难愁盼·………·每一名劳动者日常的勤勉敬业,汇聚成推动社会高效运转、不断向前的强大力量。 摘编自《人民日报》（2025年2月27日）","志愿服务是社会文明进步的重要标志，是新时代党引导动员人民群众贡献智慧力量、创 造美好生活、实现奋斗目标的生动实践， 《关于健全新时代志愿服务体系的意见》提出,到2035年，“志愿服务成为社会主义文 化强国的重要标志”。这个目标的提出,标志着中国特色志愿服务由组织推动、专业提升的 发展阶段,迈入了文化引领的新征程。要大力培育志愿文化、弘扬志愿精神，让志愿服务成 为人们的价值追求、行为习惯和生活方式。 摘编自《人民日报》（2025年3月20日）（1）如何理解“平凡岗位,亦有书写不凡人生、实现社会价值的广阔天地”？（2）为什么“要大力培育志愿文化、弘扬志愿精神”？"]},"issues":["no-ref"],"qc":["no-ref"]},{"id":"x8-8-38","paper":"x8-8","book":"2026肖秀荣《8套卷》","setNo":8,"no":38,"type":"material","difficulty":2,"module":"","stem":"中国为什么要\"持续推进平等有序的世界多极化”？","explanation":"","answerPoints":[],"material":{"title":"材料","paragraphs":["回答问题：","国际形势越是变乱交织,我们越要坚持和维护联合国权威,坚定维护以联合国为核心的 国际体系、以国际法为基础的国际秩序、以联合国宪章宗旨和原则为基础的国际关系基本准则,持续推进平等有序的世界多极化、普惠包容的经济全球化。 摘自习近平《以史为鉴共创未来》","一是坚守多边主义。国际形势越是变乱交织,越要坚定维护以联合国为核心的国际体系、以国际法为基础的国际秩序,坚定维护国际公平正义。摘自习近平《共迎时代挑战携手推进全球气候治理 在气候和公正转型领导人峰会上的致辞》（1）中国为什么要\"持续推进平等有序的世界多极化”？（2）为什么要\"坚守多边主义”？"]},"issues":["no-ref"],"qc":["no-ref"]}];

/** 当前筛选范围下的题目：quizSource 决定考纲 / 卷（4套卷、8套卷） */
function paperSelected() { return !!quizModule && quizModule.startsWith(quizSource + '-'); }
function paperSetQuestions(key) { const [b, s] = String(key || '').split('-'); return b && s && PAPER_QUESTIONS[b] ? PAPER_QUESTIONS[b].filter(q => q.paper === `${b}-${s}`) : []; }
function quizPool() {
  if (paperSelected()) return paperSetQuestions(quizModule);
  return PAPER_QUESTIONS[quizSource] || [];
}
function paperStats(key) {
  const pool = paperSetQuestions(key);
  const done = pool.filter(q => state.quizAnswers[q.id]).length;
  const correct = pool.filter(q => state.quizAnswers[q.id] && state.quizAnswers[q.id].correct).length;
  return { total: pool.length, done, correct, rate: done ? Math.round(correct / done * 100) : 0 };
}
function allQuizDone() { return ALL_PAPER_QUESTIONS.filter(q => state.quizAnswers[q.id]).length; }
function allQuizTotal() { return ALL_PAPER_QUESTIONS.length; }
function quizArt() { return `<svg viewBox="0 0 100 82" fill="none"><path d="M16 71h68M20 65V23l30-15 30 15v42" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M29 65V36h42v29M38 65V45h24v20M46 45v20M54 45v20" stroke="currentColor" stroke-width="1.7"/><path d="M50 8v-4M14 27h-4M86 27h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`; }

/** 政治首页：来源切换（4套卷 / 8套卷） */

 * 资料库 · 政治（内嵌在学科 tab 下面）。

 * **只画索引级信息**：来源切换 + 套卷卡片。题干列表不在这里——那属于卷详情页

/**
 * 卷详情页（独立路由 quiz-paper）：这一套卷的题目列表。
 * 题干只在这里出现——属于分包内容，不进主包。
 */
function quizPaperSetPage() {
  const book = PAPER_BOOKS[quizSource];
  const key = paperSelected() ? quizModule : `${quizSource}-1`;
  const setNo = Number(key.split('-')[1]);
  const pool = paperSetQuestions(key);
  const st = paperStats(key);
  const typeLabel = q => q.type === 'choice' ? '单选' : q.type === 'multi' ? '多选' : '材料';
  const rows = pool.map(q => {
    const a = state.quizAnswers[q.id];
    // 材料题没有对错：答过（看过采分点）就是「已读参考答案」，不能按 correct:false 标成答错了
    const ok = Boolean(a) && (a.correct || q.type === 'material');
    const mark = a ? (ok ? icon('circleCheck') : icon('refresh')) : icon('chevron');
    const tone = a ? (ok ? ' ok' : ' bad') : '';
    const memo = !a ? '' : q.type === 'material' ? ' · 已读参考答案' : a.correct ? ' · 已答对' : ' · 答错了';
    const qc = (q.issues && q.issues.length) ? `<span class="qc-badge">${QUALITY_LABELS[q.issues[0]] || '待校正'}</span>` : '';
    const stem = (q.stem || '').replace(/\n/g, ' ');
    return `<button class="quiz-row${tone}" data-action="quiz-open" data-qid="${q.id}" data-od-id="pq-${q.id}"><span class="knowledge-number">${String(q.no).padStart(2, '0')}</span><span class="knowledge-content"><h3>${stem.length > 30 ? stem.slice(0, 30) + '…' : stem}${qc}</h3><p>${typeLabel(q)}${q.module ? ' · ' + q.module : ''}${memo}</p></span>${mark}</button>`;
  }).join('');
  return `<section class="page" data-od-id="politics-paper-set">
  <div class="panel mt20" data-od-id="paper-progress"><div class="row"><div><p class="eyebrow">${book.label} · 第 ${setNo} 套</p><p class="big-number">${st.done} <small>/ ${st.total}</small></p></div><span class="pill">${icon(st.done === st.total ? 'check' : 'clock')}${st.done === st.total ? '已全部练过' : `还剩 ${st.total - st.done} 题`}</span></div>${progressBar(st.total ? st.done / st.total * 100 : 0)}<p class="quiet-note" style="margin-top:10px">已答对 ${st.correct} 题，正确率 ${st.rate}%</p></div>
  <div class="row mt16"><button class="text-button" data-action="quiz-paper-back" data-od-id="paper-back-select">${icon('back')}换一套卷</button><span class="subtext" style="font-size:10px">按卷面顺序排列题目</span></div>
  <div class="quiz-list">${rows || '<div class="panel"><p class="subtext">这一套暂时没有题目。</p></div>'}</div>
  <button class="primary-button mt20" data-action="quiz-start" data-od-id="start-paper-quiz">${st.done ? '继续练习本套' : '从头开始本套'}${icon('arrow')}</button>
  <p class="quiet-note">整卷按顺序作答，做完全套查看结果与错题回顾。</p></section>`;
}

function politicsQuestionPage() {
  const pool = quizPool();
  if (!pool.length) return emptyPage('book','这一套还没有题目','换一套卷，或者稍后再来。','quiz-paper-back','换一套卷','quiz-empty-return');
  if (quizCursor >= pool.length) quizCursor = pool.length - 1;
  const q = pool[quizCursor];
  const a = state.quizAnswers[q.id];
  const isChoice = q.type === 'choice';
  const isMulti = q.type === 'multi';
  const isMaterial = q.type === 'material';
  const quizTypeLabel = isChoice ? '单选题' : isMulti ? '多选题' : '材料分析题';
  const savedPicked = a ? (Array.isArray(a.picked) ? a.picked : String(a.picked || '').split('')) : [];
  const pickedList = (quizPicked && quizPicked.length) ? quizPicked : savedPicked;
  // 选择题/多选题：交卷后（有作答记录）就展示结果；材料题只认 quizRevealed
  const revealed = (isChoice || isMulti) ? (quizRevealed || Boolean(a)) : quizRevealed;
  const correctKey = (isChoice || isMulti) ? String(q.answerKey || '') : '';
  const isRight = Boolean(a && a.correct);

  const options = (isChoice || isMulti) ? (q.options || []).map(o => {
    const key = o.key, text = String(o.text || '').replace(/\n/g, ' ');
    const pickedThis = pickedList.includes(key);
    const isAnswer = isChoice ? key === correctKey : correctKey.includes(key);
    let tone = '';
    let mark = '';
    if (revealed) {
      if (isAnswer) { tone = ' ok'; mark = icon('circleCheck'); }
      else if (pickedThis) { tone = ' bad'; mark = icon('refresh'); }
    } else if (pickedThis) { tone = ' picked'; mark = icon('check'); }
    return `<button class="option-row${tone}" data-action="quiz-pick" data-key="${key}" data-od-id="option-${key}" ${revealed?'disabled':''}><span class="option-key">${key}</span><span class="option-text">${text}</span>${mark}</button>`;
  }).join('') : '';

  const materialBlock = isMaterial ? `<section class="detail-section" data-od-id="quiz-material"><h2>${(q.material && q.material.title) || '材料'}</h2>${(q.material && q.material.paragraphs && q.material.paragraphs.length) ? q.material.paragraphs.map(p=>`<p class="material-para">${p}</p>`).join('') : '<p class="material-para">（材料正文转档缺失）</p>'}</section>` : '';

  const stemText = String(q.stem || '').replace(/\n/g, ' ');
  const questionBlock = `<section class="detail-section" data-od-id="quiz-questions"><h2>题目</h2><p class="material-para">${stemText}</p></section>`;

  const answerBlock = revealed ? (isMaterial
    ? `<section class="detail-section quiz-explain" data-od-id="quiz-answer-points"><h2>参考答案 · 采分点</h2>${(q.answerPoints && q.answerPoints.length) ? `<ol class="point-ol">${q.answerPoints.map(p=>`<li>${p}</li>`).join('')}</ol>` : '<p class="subtext">（参考答案转档缺失）</p>'}<p class="subtext mt12">${q.explanation || ''}</p></section>`
    : `<section class="detail-section quiz-explain" data-od-id="quiz-explanation"><h2>${isRight?'答对了':'正确答案是 '+correctKey}</h2><p class="subtext">${q.explanation || '（解析转档缺失）'}</p></section>`) : '';

  const hasPicked = !!pickedList.length;
  const tools = (isChoice || isMulti)
    ? (revealed
        ? `<button class="primary-button mt20" data-action="quiz-next" data-od-id="quiz-next">${quizCursor>=pool.length-1?'查看练习结果':'下一题'}${icon('arrow')}</button>`
        : `<button class="primary-button mt20" data-action="quiz-submit" data-od-id="quiz-submit" ${hasPicked?'':'disabled'}>${hasPicked?'提交答案':(isMulti?'请选择你的答案（多选）':'请先选择一个选项')}${icon('arrow')}</button>`)
    : `<button class="primary-button mt20" data-action="quiz-show" data-od-id="quiz-show">${icon('eye')}${revealed?'隐藏参考答案':'查看参考答案'}</button><button class="primary-button mt20" data-action="quiz-next" data-od-id="quiz-next" ${revealed?'':'hidden'}>${quizCursor>=pool.length-1?'查看练习结果':'下一题'}${icon('arrow')}</button>`;

  const position = q.book ? `${PAPER_BOOKS[quizSource].label} · 第 ${q.setNo} 套` : `${q.module} / ${quizTypeLabel}`;

  const pageTitle = isMaterial ? '结合材料回答问题' : quizTypeLabel;
  return `<section class="page" data-od-id="politics-question"><p class="eyebrow">${position} / ${quizCursor+1}/${pool.length}</p><h1 class="page-title" data-od-id="politics-question-stem">${pageTitle}</h1>${isMulti?'<p class="hint-note">多选题 · 多选、少选、错选均不得分</p>':''}
${progressBar((quizCursor+1)/pool.length*100)}
${materialBlock}
${questionBlock}
${(isChoice||isMulti)?`<div class="option-list" data-od-id="quiz-options">${options}</div>`:''}
${answerBlock}
${tools}
<button class="text-button mt20" style="width:100%" data-action="quiz-back" data-od-id="quiz-back">${icon('back')}返回题库</button></section>`;
}

/** 刷题结果页 */
function quizResultPage() {
  const pool = quizPool();
  const done = pool.filter(q => state.quizAnswers[q.id]).length;
  const correct = pool.filter(q => state.quizAnswers[q.id] && state.quizAnswers[q.id].correct).length;
  const total = pool.length;
  const rate = done ? Math.round(correct/done*100) : 0;
  const weak = done - correct;
  const wrongItems = pool.filter(q => state.quizAnswers[q.id] && !state.quizAnswers[q.id].correct);
  const label = `${PAPER_BOOKS[quizSource].short}第${quizModule ? quizModule.split('-')[1] : 1}套`;
  const weakBlock = wrongItems.length
    ? `<div class="section-head"><h2>值得再看一遍</h2><span>${wrongItems.length} 题</span></div><div class="quiz-list">${wrongItems.map(q=>`<button class="quiz-row bad" data-action="quiz-open" data-qid="${q.id}" data-od-id="result-${q.id}"><span class="knowledge-number">${icon('refresh')}</span><span class="knowledge-content"><h3>${(q.stem||'').length>24?String(q.stem||'').slice(0,24)+'…':q.stem}</h3><p>${q.book?`第 ${q.no} 题 · ${q.type==='choice'?'单选':q.type==='multi'?'多选':'材料'}`:(q.module+' · '+(q.type==='choice'?'选择题':'材料题'))}</p></span>${icon('chevron')}</button>`).join('')}</div>`
    : `<div class="panel mt20"><h3>这一组都答对了。</h3><p class="subtext mt12">保持节奏，明天再来一组。</p></div>`;
  return `<section class="page" data-od-id="politics-quiz-result"><div class="result-hero"><div class="result-mark">${icon('check')}</div><h1 data-od-id="politics-quiz-result-title">${weak?'再练一遍，就稳了。':'这一组，拿下了。'}</h1><p class="subtext">${label}：已练习 ${done} / ${total} 题，答对 ${correct} 题。<br>${weak?`还有 ${weak} 题值得再见一面。`:'全部答对，保持你的节奏。'}</p></div><div class="result-counts" data-od-id="politics-quiz-summary"><div class="result-count"><strong>${correct}</strong><span>答对</span></div><div class="result-count"><strong>${weak}</strong><span>待巩固</span></div><div class="result-count"><strong>${rate}%</strong><span>正确率</span></div></div><button class="primary-button mt20" data-action="quiz-start" data-od-id="quiz-restart">再练一遍本套${icon('arrow')}</button>
<button class="text-button mt20" style="width:100%" data-action="quiz-back" data-od-id="quiz-result-back">${icon('back')}返回题库</button>
${weakBlock}</section>`;
}

function stampInspectable(root) { root.querySelectorAll('h1,h2,h3,button,input,select,section,article,form').forEach((node,i)=>{ if(!node.hasAttribute('data-od-id')) node.setAttribute('data-od-id',`${route}-${node.tagName.toLowerCase()}-${i+1}`); }); }
const politicsQuizPage = () => `<section class="page" data-od-id="politics-quiz-standalone">`+politicsQuizBody()+`</section>`;
const extraPages={'review':reviewPage,'word-detail':wordDetailPage,'result':resultPage,'favorites':favoritesPage,'wordbook':wordbookPage,'word-plan':wordPlanPage,'topic':topicPage,'plan':planPage,'goals':goalsPage,'quiz':politicsQuizPage,'quiz-paper':quizPaperSetPage,'quiz-question':politicsQuestionPage,'quiz-result':quizResultPage};
function closeSheet() { document.getElementById('overlay').hidden=true; }
function openMenu() { sheetOpener=document.activeElement; const overlay=document.getElementById('overlay'); overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-heading"><div class="sheet-handle"></div><div class="row"><h2 id="menu-heading">词数同行</h2><button class="icon-button" data-action="close-sheet" aria-label="关闭菜单" data-od-id="close-menu">${icon('close')}</button></div><p class="subtext">背好每个单词，理解每个知识点。</p><div class="menu-list"><button class="menu-row" data-action="nav" data-route="goals" data-od-id="menu-goals">${icon('target')}<strong>调整学习目标</strong>${icon('chevron')}</button><button class="menu-row" data-action="nav" data-route="favorites" data-od-id="menu-favorites">${icon('star')}<strong>查看收藏单词</strong>${icon('chevron')}</button><button class="menu-row" data-action="nav" data-route="plan" data-od-id="menu-plan">${icon('plan')}<strong>打开学习计划</strong>${icon('chevron')}</button></div><p class="quiet-note">词数同行 · 考研知识库原型<br>体验数据仅保存在当前浏览器。</p></section>`; overlay.hidden=false; overlay.querySelector('button').focus(); }
function handleAction(action, el) {
  if(action==='tab') { historyStack=[]; const target=el.dataset.route; if(target==='math'||target==='library') { searchTerm=''; ensureSubjectInTab(target); } navigate(target,false); }
  else if(action==='nav') navigate(el.dataset.route);
  else if(action==='home') { historyStack=[]; navigate('home',false); }
  else if(action==='back') goBack();
  else if(action==='menu') openMenu();
  else if(action==='close-sheet') { closeSheet(); if(sheetOpener) sheetOpener.focus(); }
  else if(action==='subject') { const tab=activeTab(), list=tabSubjects(tab), k=Number(el.dataset.value); if(list[k]!==undefined) { subjectIndex=list[k]; subjectCursor[tab]=k; } searchTerm=''; render(); }
  else if(action==='clear-search') { searchTerm=''; render(); document.getElementById('knowledge-search').focus(); }
  else if(action==='chart') { chartMode=el.dataset.value; render(); }
  else handleLearningAction(action,el);
}
function startReview(weak=false) {
  if(!weak && reviewQueue.length && reviewIndex<reviewQueue.length) { navigate('review'); return; }
  const plan=wordPlan(), today=wordToday();
  const due=vocabulary.map((w,i)=>({w,i})).filter(({w})=>state.answered[w.word] && state.answered[w.word]!=='familiar');
  const fresh=vocabulary.map((w,i)=>({w,i})).filter(({w})=>!state.answered[w.word]);
  const newDone=(Number(today.learned)||0)>=plan.newTotal;
  reviewMode=(weak||newDone)?'review':'new';
  let queue=reviewMode==='review'?due:fresh;
  if(!queue.length) queue=reviewMode==='review'?fresh:due;
  reviewQueue=queue.map(x=>x.i); reviewIndex=0; reviewGrade=null; revealMeaning=true;
  if(!reviewQueue.length) navigate('result'); else navigate('review',route!=='result');
}
function handleLearningAction(action,el) {
  if(action==='review-start') startReview();
  else if(action==='review-weak') startReview(true);
  else if(action==='reveal') { revealMeaning=!revealMeaning; render(); }
  else if(action==='grade') {
    if(reviewGrade || !['familiar','fuzzy','unknown'].includes(el.dataset.value)) return;
    const w=vocabulary[reviewQueue[reviewIndex]]; if(!w) return;
    reviewGrade=el.dataset.value; const firstTime=!state.answered[w.word]; state.answered[w.word]=reviewGrade; wordProgress(firstTime); revealMeaning=true; persist(); render(); main.scrollTop=Math.max(0,main.scrollHeight-main.clientHeight);
  }
  else if(action==='review-next') { if(!reviewGrade) return; reviewIndex++; reviewGrade=null; revealMeaning=true; if(reviewIndex>=reviewQueue.length) navigate('result',false); else { render(); main.scrollTop=0; } }
  else if(action==='word-detail') { detailWord=Number(el.dataset.word); if(vocabulary[detailWord]) navigate('word-detail'); }
  else if(action==='favorite') { const index=Number(el.dataset.word); if(!vocabulary[index])return; const exists=state.favorites.includes(index); state.favorites=exists?state.favorites.filter(i=>i!==index):[...state.favorites,index]; persist(); const scroll=main.scrollTop; render(); main.scrollTop=scroll; showToast(exists?'已取消收藏':'已收藏，可在「我的」中查看'); }
  else if(action==='word-filter') { wordFilter=el.dataset.value||'all'; render(); }
  else if(action==='word-plan') { const field=el.dataset.field, value=Number(el.dataset.value), allowed=field==='newTotal'?[10,20,30,50]:[20,30,50,80]; if(!allowed.includes(value)) return; state.goals=field==='newTotal'?{...state.goals,words:value}:{...state.goals,review:value}; persist(); render(); showToast(field==='newTotal'?`每天新学 ${value} 个单词`:`每天复习 ${value} 个单词`); }
  else if(action==='quiz') { quizSource='x4'; quizModule=''; quizCursor=0; quizPicked=[]; quizRevealed=false; navigate('quiz'); }
  else if(action==='quiz-source') { quizSource=el.dataset.source; quizModule=''; quizCursor=0; quizPicked=[]; quizRevealed=false; render(); main.scrollTop=0; }
  else if(action==='quiz-paper') { quizModule=el.dataset.paper; quizCursor=0; quizPicked=[]; quizRevealed=false; navigate('quiz-paper'); }
  else if(action==='quiz-paper-back') { quizModule=''; quizCursor=0; quizPicked=[]; quizRevealed=false; goBack(); }
  else if(action==='quiz-start') { if(!paperSelected()) quizModule=quizSource+'-1'; quizCursor=0; quizPicked=[]; quizRevealed=false; navigate('quiz-question'); }
  else if(action==='quiz-open') { const qid=el.dataset.qid, pool=quizPool(); const k=pool.findIndex(q=>q.id===qid); quizCursor=k<0?0:k; quizPicked=[]; quizRevealed=false; navigate('quiz-question'); }
  else if(action==='quiz-pick') { if(quizRevealed) return; const q=quizPool()[quizCursor]; quizPicked=Array.isArray(quizPicked)?quizPicked:[]; if(q && q.type==='multi'){ const k=el.dataset.key; quizPicked=quizPicked.includes(k)?quizPicked.filter(x=>x!==k):[...quizPicked,k]; } else { quizPicked=[el.dataset.key||'']; } render(); main.scrollTop=main.scrollTop; }
  else if(action==='quiz-submit') {
    const pool=quizPool(), q=pool[quizCursor]; quizPicked=Array.isArray(quizPicked)?quizPicked:[]; if(!q || !['choice','multi'].includes(q.type) || !quizPicked.length || state.quizAnswers[q.id]) return;
    const picked = q.type==='choice' ? quizPicked[0] : [...quizPicked].sort().join('');
    state.quizAnswers[q.id]={picked, correct:picked===q.answerKey}; quizRevealed=true; persist(); render();
  }
  else if(action==='quiz-show') { const pool=quizPool(), q=pool[quizCursor]; if(!q) return; const firstReveal=!quizRevealed; quizRevealed=firstReveal; if(firstReveal && q.type==='material' && !state.quizAnswers[q.id]) { state.quizAnswers[q.id]={picked:'', correct:false}; persist(); } render(); }
  else if(action==='quiz-next') { const pool=quizPool(); if(quizCursor>=pool.length-1) { navigate('quiz-result',false); return; } quizCursor++; quizPicked=[]; quizRevealed=false; render(); main.scrollTop=0; }
  else if(action==='quiz-back') goBack();
  else if(action==='topic') { subjectIndex=Number(el.dataset.subject); detailTopic=Number(el.dataset.topic); markTopicRead(subjectIndex,detailTopic); navigate('topic'); }
  else if(action==='math-home') navigate('math');
  else if(action==='toggle-plan') { const key=topicKey(subjectIndex,detailTopic), exists=state.planned.includes(key); state.planned=exists?state.planned.filter(k=>k!==key):[...state.planned,key]; persist(); const scroll=main.scrollTop; render(); main.scrollTop=scroll; showToast(exists?'已从学习计划中移除':'已加入计划，下一次接着学'); }
}
function saveGoals(form) {
  const data=Object.fromEntries(new FormData(form));
  if(![10,20,30,50].includes(Number(data.words)) || ![1,2,3,5].includes(Number(data.knowledge))) { showToast('请选择有效的学习目标'); return; }
  state.goals={...state.goals,words:Number(data.words),review:wordPlan().reviewTotal,knowledge:Number(data.knowledge),english:data.english,subject:data.subject,year:data.year}; persist();
  document.getElementById('goal-save-status').textContent=`已保存：每天 ${data.words} 个单词、阅读 ${data.knowledge} 个知识点，从明天开始执行。`;
  showToast('目标已保存，一起稳稳向前');
}

document.addEventListener('input',event=>{ if(event.target.id==='knowledge-search') { searchTerm=event.target.value.trim(); document.getElementById('knowledge-results').innerHTML=knowledgeResults(); stampInspectable(main); } });
document.getElementById('overlay').addEventListener('click',event=>{ if(event.target===event.currentTarget) { closeSheet(); if(sheetOpener) sheetOpener.focus(); } });
document.addEventListener('keydown',event=>{ const overlay=document.getElementById('overlay'); if(!overlay.hidden) { if(event.key==='Escape') { closeSheet(); if(sheetOpener) sheetOpener.focus(); } if(event.key==='Tab') { const items=[...overlay.querySelectorAll('button, input, select')], first=items[0], last=items[items.length-1]; if(event.shiftKey && document.activeElement===first) { event.preventDefault(); last.focus(); } else if(!event.shiftKey && document.activeElement===last) { event.preventDefault(); first.focus(); } } } });
document.querySelector('[data-action="menu"]').innerHTML=icon('more');
document.querySelector('[data-action="home"]').innerHTML=icon('mini');
render();
</script>
