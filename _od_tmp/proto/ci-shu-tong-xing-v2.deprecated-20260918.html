function handleAction(action, el) {
  if(action==='tab') { historyStack=[]; if(el.dataset.route==='math') searchTerm=''; navigate(el.dataset.route,false); }
  else if(action==='nav') navigate(el.dataset.route);
  else if(action==='home') { historyStack=[]; navigate('home',false); }
  else if(action==='back') goBack();
  else if(action==='menu') openMenu();
  else if(action==='close-sheet') { closeSheet(); if(sheetOpener) sheetOpener.focus(); }
  else if(action==='subject') { subjectIndex=Number(el.dataset.value); searchTerm=''; render(); }
  else if(action==='clear-search') { searchTerm=''; render(); document.getElementById('knowledge-search').focus(); }
  else if(action==='chart') { chartMode=el.dataset.value; render(); }
  else handleLearningAction(action,el);
}
function startReview(weak=false) {
  if(!weak && reviewQueue.length && reviewIndex<reviewQueue.length) { navigate('review'); return; }
  reviewQueue=vocabulary.map((w,i)=>({w,i})).filter(({w})=>weak?(state.answered[w.word] && state.answered[w.word]!=='familiar'):!state.answered[w.word]).map(x=>x.i);
  reviewIndex=0; reviewGrade=null; revealMeaning=true;
  if(!reviewQueue.length) navigate('result'); else navigate('review',route!=='result');
}
function openQuestion(index=subjectIndex) { subjectIndex=index; selectedAnswer=null; submitted=false; navigate('question'); }
function pronounce(index) {
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance==='undefined') { showToast('当前浏览器不支持语音朗读，可参考单词音标'); return; }
  window.speechSynthesis.cancel(); const utterance=new SpeechSynthesisUtterance(vocabulary[index].word); utterance.lang='en-GB'; utterance.rate=0.82;
  const voice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='en-gb'); if(voice) utterance.voice=voice;
  utterance.onerror=()=>showToast('暂时无法播放发音，可参考单词音标'); window.speechSynthesis.speak(utterance);
}
function handleLearningAction(action,el) {
  if(action==='review-start') startReview();
  else if(action==='review-weak') startReview(true);
  else if(action==='reveal') { revealMeaning=!revealMeaning; render(); }
  else if(action==='grade') {
    if(reviewGrade || !['familiar','fuzzy','unknown'].includes(el.dataset.value)) return;
    const w=vocabulary[reviewQueue[reviewIndex]]; if(!w) return;
    reviewGrade=el.dataset.value; state.answered[w.word]=reviewGrade; revealMeaning=true; persist(); render(); main.scrollTop=Math.max(0,main.scrollHeight-main.clientHeight);
  }
  else if(action==='review-next') { if(!reviewGrade) return; reviewIndex++; reviewGrade=null; revealMeaning=true; if(reviewIndex>=reviewQueue.length) navigate('result',false); else { render(); main.scrollTop=0; } }
  else if(action==='word-detail') { detailWord=Number(el.dataset.word); if(vocabulary[detailWord]) navigate('word-detail'); }
  else if(action==='favorite') { const index=Number(el.dataset.word); if(!vocabulary[index])return; const exists=state.favorites.includes(index); state.favorites=exists?state.favorites.filter(i=>i!==index):[...state.favorites,index]; persist(); const scroll=main.scrollTop; render(); main.scrollTop=scroll; showToast(exists?'已取消收藏':'已收藏，可在「我的」中查看'); }
  else if(action==='pronounce') pronounce(Number(el.dataset.word));
  else if(action==='topic') { subjectIndex=Number(el.dataset.subject); detailTopic=Number(el.dataset.topic); navigate('topic'); }
  else if(action==='math-home') navigate('math');
  else if(action==='toggle-plan') { const key=subjects[subjectIndex].id+'-'+detailTopic, exists=state.planned.includes(key); state.planned=exists?state.planned.filter(k=>k!==key):[...state.planned,key]; persist(); const scroll=main.scrollTop; render(); main.scrollTop=scroll; showToast(exists?'已从学习计划中移除':'已加入计划，下一次接着学'); }
  else if(action==='question') openQuestion(el.dataset.subject===undefined?subjectIndex:Number(el.dataset.subject));
  else if(action==='answer' && !submitted) { selectedAnswer=Number(el.dataset.value); const scroll=main.scrollTop; render(); main.scrollTop=scroll; main.querySelector(`[data-od-id="answer-${selectedAnswer}"]`).focus({preventScroll:true}); }
  else if(action==='submit-answer') {
    if(selectedAnswer===null || submitted) return; submitted=true; const s=subjects[subjectIndex];
    if(!state.solved.includes(s.id)) state.solved.push(s.id);
    if(selectedAnswer===s.correct) state.wrong=state.wrong.filter(id=>id!==s.id); else if(!state.wrong.includes(s.id)) state.wrong.push(s.id);
    persist(); render(); const feedback=document.getElementById('answer-feedback'); main.scrollTop=Math.max(0,feedback.offsetTop-main.offsetTop-18);
  }
  else if(action==='retry-question') { selectedAnswer=null; submitted=false; render(); main.scrollTop=0; }
  else if(action==='finish-question') { navigate('math'); showToast('本题已计入今日学习记录'); }
}
function saveGoals(form) {
  const data=Object.fromEntries(new FormData(form));
  if(![20,30,50,80].includes(Number(data.words)) || ![3,5,10].includes(Number(data.math))) { showToast('请选择有效的学习目标'); return; }
  state.goals={words:Number(data.words),math:Number(data.math),english:data.english,subject:data.subject,year:data.year}; persist();
  document.getElementById('goal-save-status').textContent=`已保存：每天 ${data.words} 个单词、${data.math} 道题，从明天开始执行。`;
  showToast('目标已保存，一起稳稳向前');
}
document.addEventListener('click', event=>{ const el=event.target.closest('[data-action]'); if(el && !el.disabled) handleAction(el.dataset.action,el); });
document.addEventListener('submit',event=>{ if(event.target.id==='goal-form') { event.preventDefault(); saveGoals(event.target); } });
document.addEventListener('input',event=>{ if(event.target.id==='knowledge-search') { searchTerm=event.target.value.trim(); document.getElementById('math-results').innerHTML=mathResults(); stampInspectable(main); } });
document.getElementById('overlay').addEventListener('click',event=>{ if(event.target===event.currentTarget) { closeSheet(); if(sheetOpener) sheetOpener.focus(); } });
document.addEventListener('keydown',event=>{ const overlay=document.getElementById('overlay'); if(!overlay.hidden) { if(event.key==='Escape') { closeSheet(); if(sheetOpener) sheetOpener.focus(); } if(event.key==='Tab') { const items=[...overlay.querySelectorAll('button, input, select')], first=items[0], last=items[items.length-1]; if(event.shiftKey && document.activeElement===first) { event.preventDefault(); last.focus(); } else if(!event.shiftKey && document.activeElement===last) { event.preventDefault(); first.focus(); } } return; } if(route==='question' && !submitted && event.target.getAttribute('role')==='radio' && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) { event.preventDefault(); selectedAnswer=((selectedAnswer??0)+(['ArrowLeft','ArrowUp'].includes(event.key)?3:1))%4; render(); main.querySelector(`[data-od-id="answer-${selectedAnswer}"]`).focus({preventScroll:true}); } });
document.querySelector('[data-action="menu"]').innerHTML=icon('more');
document.querySelector('[data-action="home"]').innerHTML=icon('mini');
render();
</script>
</body>
</html>
